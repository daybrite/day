[package]
name = "day-uikit"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

# Xcode links the Rust static library; it does not inherit Rust's framework link attributes.
[package.metadata.day.ios]
frameworks = ["MobileCoreServices"]

[dependencies]
log = { workspace = true }
day-spec = { workspace = true }
# Tweaks (docs/tweaks.md): the ext module reads the realized tree (day-core) and
# extends Decorate (day-pieces) with this toolkit\'s tweak modifier.
day-core = { workspace = true }
day-pieces = { workspace = true }
linkme = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
block2 = { workspace = true }
dispatch2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSLocale", "NSString", "NSUndoManager", "NSArray", "NSBundle", "NSDictionary", "NSPathUtilities", "NSURL", "NSIndexPath", "NSRunLoop", "NSDate", "NSObjCRuntime", "NSUserActivity", "NSSet", "NSEnumerator"] }
objc2-core-foundation = { workspace = true, default-features = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGContext", "CGGradient", "CGColorSpace"] }
objc2-quartz-core = { workspace = true, features = ["CADisplayLink"] }
objc2-ui-kit = { workspace = true, features = [
    "UIApplication", "UIResponder", "UIView", "UIWindow", "UIScreen", "UIViewController",
    "UIScene", "UIWindowScene", "UISceneSession", "UISceneConfiguration", "UISceneOptions", "UISceneDefinitions",
    # The scene's own geometry (docs/size-classes.md) — iOS 26 deprecated
    # `UIWindowScene.coordinateSpace` in favour of `effectiveGeometry.coordinateSpace`, and a
    # resizable window is exactly where measuring the SCREEN instead goes wrong.
    "UIWindowSceneGeometry",
    # The system text size changing under a running app (Dynamic Type, docs/list.md "Row heights").
    "UIContentSizeCategory",
    # Deep-link + launcher-shortcut intake at the scene delegate (docs/deep-links.md).
    "UIApplicationShortcutItem", "UIOpenURLContext", "block2",
    # The one screen `Toolkit::monitors` describes is named after the device (docs/windows.md).
    "UIDevice",
    # Window capture (docs/window-image.md): UIGraphicsImageRenderer + UIImagePNGRepresentation.
    "UIGraphicsRenderer", "UIGraphicsImageRenderer", "UIImage",
    "UIButtonConfiguration", "UIBackgroundConfiguration",
    "UILabel", "UIControl", "UIButton", "UITextField", "UISwitch",
    # A text field's input traits (docs/textfield.md): keyboard, capitalization and return-key
    # enums, the AutoFill content types, and the text-input calls a secure flip re-enters
    # the text through.
    "UITextInputTraits", "UITextInput", "UISlider", "UIColor",
    "UIAlertController", "UIActivityViewController", "UIActivity", "UIPopoverPresentationController",
    # The cover tier's sheets (docs/cover.md): a page sheet's dismissal delegate, and the half
    # sheet's medium detent.
    "UIPresentationController", "UISheetPresentationController",
    "UIProgressView", "UIActivityIndicatorView",
    "UIScrollView", "UIAccessibility", "UIBezierPath", "UIImage", "UIImageView", "UITraitCollection", "NSAttributedString", "NSStringDrawing", "UIStringDrawing", "UIFont",
    "UINavigationController", "UINavigationBar", "UINavigationItem",
    "UIBarAppearance", "UINavigationBarAppearance",
    # Adaptive navigation (docs/size-classes.md): the split host that collapses and expands
    # with the window's size class, and the delegate Day observes it through.
    "UISplitViewController",
    # Inline search on a `.searchable()` surface (docs/search.md): the UISearchController the
    # navigation item reveals when the top-level list is pulled down — the iOS convention.
    "UISearchController", "UISearchBar",
    "UITabBarController", "UITabBar", "UITabBarItem",
    "UITableView", "UITableViewCell", "UILabel", "UIRefreshControl",
    # The hierarchical tree (docs/tree.md): a list-layout UICollectionView driven by a
    # diffable data source over SECTION snapshots, disclosure via UICellAccessory.
    "UICollectionView", "UICollectionViewCell", "UICollectionViewListCell",
    "UICollectionViewLayout", "UICollectionViewCompositionalLayout", "UICollectionLayoutList",
    "UIDiffableDataSource", "NSDiffableDataSourceSectionSnapshot", "UICellAccessory",
    "UIGraphics", "UIGestureRecognizer", "UITapGestureRecognizer", "UIPanGestureRecognizer",
    "UIMenu", "UIMenuElement", "UIMenuLeaf", "UIAction", "UICommand", "UIContextMenuInteraction",
    # The window toolbar under a navigation controller's pages (docs/toolbars.md).
    "UIBarItem", "UIBarButtonItem", "UIToolbar", "UIBarButtonItemGroup",
    "UIContextMenuConfiguration", "UIInteraction", "UIKeyCommand",
    # The `.cursor()` decorator on iPadOS (docs/cursor.md): pointer styles, not shapes.
    "UIPointerInteraction", "UIPointerStyle", "UIPointerRegion", "UIHoverStyle", "UITargetedPreview",
    # A focusable canvas and its hardware-keyboard arrows (docs/menus.md): the press stream a
    # first-responder view reads (`pressesBegan:`), the key on each press, and the touch that
    # makes the canvas first responder in the first place.
    "UIPress", "UIPressesEvent", "UIKey", "UIKeyConstants", "UITouch", "UIEvent",
    "UIDocumentPickerViewController", "UIViewControllerTransitionCoordinator",
    "UIGeometry",
    # List drag-to-reorder (docs/list.md): the drag-delegate item that lifts a row without
    # entering editing mode (the move/target data-source methods are ungated).
    "UIDragItem", "UIDragSession", "UIDragInteraction", "UIDropInteraction",
    "objc2-core-foundation", "objc2-core-graphics",
] }
