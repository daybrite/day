[package]
name = "day-dom"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

# The web backend (DESIGN.md §9): the DOM is the toolkit. Pure Rust over a small JS shim that
# owns the actual DOM calls, keyed by numeric node ids — the same trampoline architecture as
# day-arkui's NodeAPI shim, with JS in place of C. The shim ships inside day-cli
# (crates/day-cli/resources/web/), which embeds it; see this crate's lib.rs header.
[dependencies]
day-spec = { workspace = true }
day-geometry = { workspace = true }
log = { workspace = true }

# The entropy bridge (§9): `day build` compiles every web app with
# `--cfg getrandom_backend="custom"`, and this crate answers getrandom v0.3's custom-backend
# hook from the shim's `day_dom_entropy` (crypto.getRandomValues) — the raw-wasm pipeline has
# no wasm-bindgen runtime for getrandom's own `wasm_js` backend. Target-gated: on native
# hosts (clippy's cross-target sweep) getrandom keeps its OS backends and the hook is absent.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", default-features = false }
