[package]
name = "day-appkit"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[[test]]
name = "native_links"
harness = false # AppKit must be exercised on the process's main thread.

[[test]]
name = "native_list_menus"
harness = false

[[test]]
name = "native_main_menu"
harness = false

[build-dependencies]
day-build = { workspace = true }

[dependencies]
day-fluent = { workspace = true }
log = { workspace = true }
day-spec = { workspace = true }
# Tweaks (docs/tweaks.md): the ext module reads the realized tree (day-core) and
# extends Decorate (day-pieces) with this toolkit\'s tweak modifier.
day-core = { workspace = true }
day-pieces = { workspace = true }
# Localize the AppKit-built menu chrome (default menu + standard App menu About/Quit).
day-l10n = { workspace = true }
linkme = { workspace = true }
objc2 = { workspace = true }
objc2-uniform-type-identifiers = { workspace = true }
block2 = { workspace = true }
dispatch2 = { workspace = true }
objc2-core-foundation = { workspace = true, default-features = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGImage", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataConsumer", "CGPDFContext"] }
objc2-quartz-core = { workspace = true, features = ["CAMediaTimingFunction", "CATransaction", "CADisplayLink"] }
objc2-foundation = { workspace = true, features = ["NSLocale",
    "NSString", "NSUndoManager", "NSGeometry", "NSNotification", "NSDistributedNotificationCenter", "NSDictionary", "NSData", "NSValue", "NSIndexSet",
    "NSObject", "NSArray", "NSURL", "NSProcessInfo", "NSUserDefaults",
] }
objc2-app-kit = { workspace = true, features = [
    "objc2-core-graphics", "objc2-uniform-type-identifiers", "NSRunningApplication",
    "NSApplication", "NSResponder", "NSWindow", "NSView", "NSControl", "NSButton", "NSScreen",
    "NSTextField", "NSSecureTextField", "NSTextContent", "NSSlider", "NSSwitch", "NSCell", "NSText", "NSGraphics", "NSBox",
    "NSScrollView", "NSClipView", "NSMenu", "NSMenuItem", "NSFont", "NSColor",
    "NSBitmapImageRep", "NSImageRep", "NSEvent", "NSCursor", "NSTrackingArea", "NSAccessibilityProtocols", "NSAccessibilityConstants",
    "NSGraphicsContext", "NSAppearance", "NSSplitView", "NSLayoutConstraint",
    # The sidebar nav host (docs/navigation.md): NSSplitViewController owns the split's
    # delegate, holding priorities and the sidebar item's material, so the sidebar gets the
    # system source-list treatment instead of a hand-rolled NSVisualEffectView.
    "NSSplitViewController", "NSSplitViewItem", "NSViewController",
    "NSAlert", "NSOutlineView", "NSTableView", "NSTableColumn", "NSTableCellView", "NSTableHeaderView",
    "NSVisualEffectView", "NSUserInterfaceItemIdentification",
    "NSBezierPath", "NSGradient", "NSColorSpace", "NSImage", "NSImageView", "NSStringDrawing", "NSAttributedString",
    "NSProgressIndicator", "NSTabView", "NSTabViewItem",
    "NSSavePanel", "NSOpenPanel", "NSPanel", "NSWorkspace",
    "NSAnimationContext", "NSLayoutManager",
    # List drag-to-reorder (docs/list.md): the NSTableView drag data-source methods and the
    # pasteboard writer that carries the dragged row index.
    "NSDragging", "NSDraggingSession", "NSDraggingItem", "NSPasteboard", "NSPasteboardItem",
    # List swipe actions (docs/list.md): the row-action class and the block2 bridge its
    # handler-taking constructor is gated on.
    "NSTableViewRowAction", "block2",
    # Window toolbars (docs/toolbars.md): NSToolbar plus the item classes that give search and
    # pull-down items their real macOS behavior (collapsing search, menu indicator).
    "NSToolbar", "NSToolbarItem", "NSSearchToolbarItem", "NSMenuToolbarItem", "NSSearchField",
] }

[[test]]
name = "native_applications"
harness = false

[[test]]
name = "native_window_visibility"
harness = false

[[test]]
name = "native_list_scroll"
harness = false

[[test]]
name = "native_document_layout"
harness = false

[[test]]
name = "native_toolbar_search"
harness = false
