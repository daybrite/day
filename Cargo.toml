[workspace]
resolver = "2"
# CI checks daybrite/Day-Showcase out here (.github/actions/showcase) to build the framework
# against the app it documents. A package nested inside a workspace it is not a member of
# fails every cargo command, so it is excluded here as well as declaring its own
# `[workspace]`. This side is what keeps an older app ref building.
# `apps/*` are standalone packages (their own `[workspace]`): the conformance app builds against
# this checkout by path through `day build`, never as a workspace member (docs/testing.md).
exclude = ["showcase-src", "apps/*"]
members = [
    "crates/day-geometry",
    "crates/day-fonts",
    "crates/day-reactive",
    "crates/day-spec",
    "crates/day-async",
    "crates/day-bridge",
    "crates/day-dbus",
    "crates/day-mock",
    "crates/day-core",
    "crates/day-pieces",
    "crates/day-l10n",
    "crates/day-fluent",
    "crates/day-script",
    "crates/day-script-proto",
    "crates/day-vector",
    "crates/day-model",
    "crates/day-macros",
    "crates/day",
    "toolkits/day-appkit",
    "toolkits/day-gtk",
    "toolkits/day-qt",
    "toolkits/day-macos-tabs",
    "toolkits/day-qt-sys",
    "toolkits/day-uikit",
    "toolkits/day-android",
    "toolkits/day-xaml",
    "toolkits/day-xaml-sys",
    "toolkits/day-arkui",
    "toolkits/day-dom",
    "pieces/day-piece-swiftui",
    "parts/day-part-device",
    "parts/day-part-sensors",
    "parts/day-part-clipboard",
    "parts/day-part-connectivity",
    "parts/day-part-haptics",
    "parts/day-part-sound",
    "parts/day-part-wakelock",
    "parts/day-part-prefs",
    "parts/day-part-fs",
    "parts/day-part-http",
    "parts/day-part-downloads",
    "parts/day-part-permissions",
    "parts/day-part-location",
    "parts/day-part-local-notify",
    "parts/day-part-biometrics",
    "parts/day-part-keychain",
    "pieces/day-piece-texteditor",
    "pieces/day-piece-settings",
    "tweaks/day-tweak-button-bezel",
    "tweaks/day-tweak-tooltip",
    "tweaks/day-tweak-slider-tickmarks",
    "tweaks/day-tweak-tree-style",
    "crates/day-toolchain",
    "crates/day-build",
    "crates/day-cli",
]
# The quick-iteration set: what a flagless `cargo build`/`check`/`test` compiles, kept small so
# editor loops stay fast (the CLI and the piece/part catalog are left out). This list is not the
# CI test roster: CI tests the whole workspace minus the toolkit backends via
# scripts/ci/host-test.sh, so a crate absent here still has its tests run on every push.
default-members = [
    "crates/day-fluent",
    "crates/day-script-proto",
    "crates/day-geometry",
    "crates/day-fonts",
    "crates/day-build",
    "crates/day-reactive",
    "crates/day-spec",
    "crates/day-async",
    "crates/day-mock",
    "crates/day-core",
    "crates/day-pieces",
    "crates/day-l10n",
    "crates/day-vector",
]

# crates.io publishing policy: `day-cli`, its dependencies `day-fonts`, `day-toolchain`,
# `day-build`, `day-vector`, and `day-script-proto`, plus `day-macros`, are publishable.
# Every other member carries `publish = false`, so `cargo publish --workspace` (and the `release` CI job) selects those seven
# in dependency order. To publish another crate later, drop its `publish = false`.
[workspace.package]
version = "0.6.0"
authors = ["Daybrite <hello@daybrite.dev>"]
edition = "2024"
description = "Declarative app development API using native UI toolkits"
repository = "https://github.com/daybrite/day"
license = "MPL-2.0"
homepage = "https://daybrite.dev"
keywords = ["design", "graphics", "gui", "toolkit", "ui"]
categories = ["gui", "command-line-utilities"]
rust-version = "1.89"

[workspace.dependencies]
# Internal dependencies use paths and take their package version from [workspace.package].
# Only day-fonts, day-vector, day-toolchain, day-build, and day-script-proto need versions:
# published crates depend on them, and crates.io requires a registry version requirement.
# Cargo cannot inherit these requirements from workspace.package; update them when releasing.
day-geometry = { path = "crates/day-geometry" }
day-fonts = { path = "crates/day-fonts", version = "0.6.0" }
day-reactive = { path = "crates/day-reactive" }
day-spec = { path = "crates/day-spec" }
day-mock = { path = "crates/day-mock" }
day-core = { path = "crates/day-core" }
day-pieces = { path = "crates/day-pieces" }
day-l10n = { path = "crates/day-l10n" }
day-fluent = { path = "crates/day-fluent" }
day-script = { path = "crates/day-script" }
day-script-proto = { path = "crates/day-script-proto", version = "0.6.0" }
day-vector = { path = "crates/day-vector", version = "0.6.0" }
day-model = { path = "crates/day-model" }
day-macros = { path = "crates/day-macros" }
# Persistence is maintained separately: https://github.com/daybrite/day-persistence.
day = { path = "crates/day" }
day-part-device = { path = "parts/day-part-device" }
day-part-sensors = { path = "parts/day-part-sensors" }
day-part-clipboard = { path = "parts/day-part-clipboard" }
day-part-connectivity = { path = "parts/day-part-connectivity" }
day-part-haptics = { path = "parts/day-part-haptics" }
day-part-sound = { path = "parts/day-part-sound" }
day-part-wakelock = { path = "parts/day-part-wakelock" }
day-part-prefs ={ path = "parts/day-part-prefs" }
day-part-http = { path = "parts/day-part-http" }
day-part-downloads = { path = "parts/day-part-downloads" }
day-part-permissions = { path = "parts/day-part-permissions" }
day-part-location = { path = "parts/day-part-location" }
day-part-local-notify = { path = "parts/day-part-local-notify" }
day-part-fs = { path = "parts/day-part-fs" }
day-part-biometrics = { path = "parts/day-part-biometrics" }
day-part-keychain = { path = "parts/day-part-keychain" }
day-piece-swiftui = { path = "pieces/day-piece-swiftui" }
day-piece-settings = { path = "pieces/day-piece-settings" }
day-piece-texteditor = { path = "pieces/day-piece-texteditor" }
# Tweaks (docs/tweaks.md): packaged per-backend configuration of built-in pieces.
day-tweak-button-bezel = { path = "tweaks/day-tweak-button-bezel" }
day-tweak-tooltip = { path = "tweaks/day-tweak-tooltip" }
day-tweak-tree-style = { path = "tweaks/day-tweak-tree-style" }
day-tweak-slider-tickmarks = { path = "tweaks/day-tweak-slider-tickmarks" }
day-toolchain = { path = "crates/day-toolchain", version = "0.6.0" }
day-build = { path = "crates/day-build", version = "0.6.0" }
day-async = { path = "crates/day-async" }
day-bridge = { path = "crates/day-bridge" }
day-dbus = { path = "crates/day-dbus" }
day-appkit = { path = "toolkits/day-appkit" }
day-gtk = { path = "toolkits/day-gtk" }
day-qt = { path = "toolkits/day-qt" }
day-qt-sys = { path = "toolkits/day-qt-sys" }
day-uikit = { path = "toolkits/day-uikit" }
day-android = { path = "toolkits/day-android" }
day-xaml = { path = "toolkits/day-xaml" }
day-xaml-sys = { path = "toolkits/day-xaml-sys" }
day-arkui = { path = "toolkits/day-arkui" }
day-dom = { path = "toolkits/day-dom" }
# Repeated third-party dependencies share versions here. Consumers retain their own
# features, optional flags, and target conditions. day-build keeps its documented cc 1.4
# minimum; the native shims inherit the broader cc 1 requirement.
anstream = "1"
anstyle = "1"
cc = "1"
gtk4 = "0.11"
httpdate = "1"
png = "0.18"
rusqlite = "0.40"
serde = "1"
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
toml = "1.1"
uuid = { version = "1", default-features = false }
windows = "0.62"
# The `IAsyncOperation` the `windows` crate hands back is this crate's type (a dependency of
# `windows` either way); naming it needs the direct line.
windows-future = "0.3"
# Apple runtime and framework binding versions are shared by every workspace member.
# Feature selections and optional/target gating stay in the consuming crates. Bindings with
# lean consumers disable defaults here; consumers needing defaults opt back in explicitly.
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-avf-audio = "0.3.2"
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = "0.3.2"
objc2-core-location = { version = "0.3.2", default-features = false }
objc2-core-motion = { version = "0.3.2", default-features = false }
objc2-foundation = "0.3.2"
objc2-map-kit = { version = "0.3.2", default-features = false }
objc2-quartz-core = "0.3.2"
objc2-security = { version = "0.3.2", default-features = false }
objc2-ui-kit = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
objc2-user-notifications = "0.3.2"
# The HarmonyOS backend's platform bindings (docs/harmonyos.md): openharmony-rs's raw NDK
# bindings (ArkUI's node API, OH_Drawing, the image kit, rawfile, VSync, UDMF, hilog) and
# ohos-rs's NAPI runtime, which registers `libentry.so`'s ArkTS module and marshals its exports.
# Only the `*-linux-ohos` targets pull them; the API level matches build-profile.json5's
# compatibleSdkVersion.
ohos-sys = { version = "0.9", features = ["api-18", "arkui", "drawing", "hilog", "rawfile", "image-kit", "image-kit-pixelmap", "image-kit-image-source", "image-kit-image-packer", "vsync", "udmf"] }
ohos-sys-opaque-types = "0.1"
napi-ohos = { version = "1.2", features = ["napi8"] }
napi-derive-ohos = "1.2"
libc = "0.2"
slotmap = "1.1"
linkme = "0.3"
inventory = "0.3.25"
# The logging facade every day crate emits through (docs/logging.md). It is a facade only, with
# no backend and no dependencies, and it is `no_std`-capable, so taking it costs a crate name and
# nothing else; it is also what lets an app install `env_logger`/`tracing`/its own `log::Log`
# with no cooperation from us. day-core ships the default implementation; day-dom the
# browser-console one.
log = "0.4"
# ICU4X compiled data supports the framework's locale formatting and searching.
# Accept 2.1 so embedders such as Servo (SpiderMonkey's ICU C API) can share the graph.
# Ordinary builds may resolve newer 2.x versions. See docs/localization.md.
icu_locale_core = "2.1"
icu_decimal = { version = "2.1", features = ["compiled_data", "alloc", "ryu"] }
icu_calendar = { version = "2.1", features = ["compiled_data"] }
icu_time = { version = "2.1", features = ["compiled_data"] }
icu_datetime = { version = "2.1", features = ["compiled_data"] }
icu_collator = { version = "2.1", features = ["compiled_data"] }
# Search matching (docs/localization.md "Searching"). `auto` gives the segmenter its LSTM +
# dictionary models, which is the only way word starts are found in a script that does not
# write spaces (Chinese, Japanese, Thai, Khmer). Rules alone would make search useless there.
icu_segmenter = { version = "2.1", features = ["compiled_data", "auto"] }
icu_casemap = { version = "2.1", features = ["compiled_data"] }
intl-memoizer = "0.5"

# The dayscript runner re-encodes every capture it saves, and `day screenshot pack` compresses
# them (crates/day-cli/src/screenshot.rs). Unoptimized, the PNG codec takes 1.4 s per 2560×1600
# capture, where it takes 10 ms optimized, so a debug CLI builds these few crates optimized.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

[profile.release]
# `fat` rather than `thin` for reproducibility (DESIGN.md §20.3). ThinLTO makes an internal symbol
# external so it can be inlined across modules, renaming it with a `.llvm.<hash>` suffix to avoid
# collisions. Measured here: that suffix was not stable across build directories, so the same commit
# built twice on one machine produced binaries differing in exactly those symbol names, and
# downstream in the GNU build-id and `.strtab` size. What feeds the hash is not established (the
# upstream reports attribute it to different inputs in different cases), so this is a fix for the
# observed symptom, not for a diagnosed root cause. Fat LTO merges everything into one module, so no
# cross-module promotion happens and the suffix is never emitted (measured: 53 occurrences → 0).
# Cargo's `trim-paths`, the more targeted candidate, is still unstable as of Cargo 1.97.
# `codegen-units = 1` is the other half, and is the documented baseline for reproducible rustc
# output; see rust-lang/rust#129080 for the standing list of reproducibility hazards.
lto = "fat"
codegen-units = 1
