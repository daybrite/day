[workspace]
resolver = "2"
# CI checks daybrite/Day-Showcase out here (.github/actions/showcase) to build the framework
# against the app it documents. A package nested inside a workspace it is not a member of
# fails every cargo command, so it is excluded here as well as declaring its own
# `[workspace]` — this side is what keeps an older app ref building.
exclude = ["showcase-src"]
members = [
    "crates/day-geometry",
    "crates/day-fonts",
    "crates/day-reactive",
    "crates/day-spec",
    "crates/day-bridge",
    "crates/day-mock",
    "crates/day-core",
    "crates/day-pieces",
    "crates/day-l10n",
    "crates/day-fluent",
    "crates/day-script",
    "crates/day-vector",
    "crates/day-model",
    "crates/day-persistence",
    "crates/day-sqlite-worker",
    "crates/day-macros",
    "crates/day",
    "toolkits/day-appkit",
    "toolkits/day-gtk",
    "toolkits/day-qt",
    "toolkits/day-qt-sys",
    "toolkits/day-uikit",
    "toolkits/day-android",
    "toolkits/day-xaml",
    "toolkits/day-xaml-sys",
    "toolkits/day-arkui",
    "toolkits/day-arkui-sys",
    "toolkits/day-dom",
    "pieces/day-piece-combobox",
    "pieces/day-piece-webview",
    "pieces/day-piece-media",
    "pieces/day-piece-swiftui",
    "parts/day-part-speech",
    "parts/day-part-battery",
    "parts/day-part-sensors",
    "parts/day-part-clipboard",
    "parts/day-part-network",
    "parts/day-part-haptics",
    "parts/day-part-prefs",
    "parts/day-part-deviceinfo",
    "parts/day-part-fs",
    "parts/day-part-http",
    "parts/day-part-permissions",
    "parts/day-part-location",
    "parts/day-part-local-notify",
    "pieces/day-piece-activity",
    "pieces/day-piece-searchfield",
    "pieces/day-piece-map",
    "pieces/day-piece-remote-image",
    "pieces/day-piece-rating",
    "pieces/day-piece-pullrefresh",
    "pieces/day-piece-datetime",
    "pieces/day-piece-colorpicker",
    "pieces/day-piece-stepper",
    "pieces/day-piece-texteditor",
    "pieces/day-piece-settings",
    "tweaks/day-tweak-button-bezel",
    "tweaks/day-tweak-tooltip",
    "tweaks/day-tweak-slider-tickmarks",
    "tweaks/day-tweak-tree-style",
    "crates/day-toolchain",
    "crates/day-build",
    "crates/day-cli",
    "crates/day-lite",
    "crates/day-break",
]
# The quick-iteration set: what a FLAGLESS `cargo build`/`check`/`test` compiles, kept small so
# editor loops stay fast (day-lite's oxc tree, the CLI, and the piece/part catalog are
# deliberately out). This list is NOT the CI test roster — CI tests the whole workspace minus
# the toolkit backends via scripts/ci/host-test.sh, so a crate absent here still has its tests
# run on every push.
default-members = [
    "crates/day-fluent",
    "crates/day-geometry",
    "crates/day-fonts",
    "crates/day-build",
    "crates/day-reactive",
    "crates/day-spec",
    "crates/day-mock",
    "crates/day-core",
    "crates/day-pieces",
    "crates/day-l10n",
    "crates/day-vector",
]

# crates.io publishing policy: for now ONLY `day-cli` and its leaf dependencies (`day-fonts`,
# `day-toolchain`, and `day-build` — the resource-constant build helper an app's `build.rs` depends
# on) are published, so `cargo install day-cli` and a scaffolded app's `[build-dependencies]` both
# resolve while the rest of the crate names stay unclaimed and free to rename. Every other member
# carries `publish = false`, so `cargo publish --workspace` (and the `release` CI job) publishes
# exactly those four, in dependency order. To publish another crate later, drop its `publish = false`.
[workspace.package]
version = "0.4.1"
authors = ["Daybrite <hello@daybrite.dev>"]
edition = "2024"
description = "Declarative app development API using native UI toolkits"
repository = "https://github.com/daybrite/day"
license = "MPL-2.0"
homepage = "https://daybrite.dev"
keywords = ["design", "graphics", "gui", "toolkit", "ui"]
categories = ["gui", "command-line-utilities"]
rust-version = "1.89"

[workspace.dependencies]
day-geometry = { path = "crates/day-geometry", version = "0.4.1" }
day-fonts = { path = "crates/day-fonts", version = "0.4.1" }
day-reactive = { path = "crates/day-reactive", version = "0.4.1" }
day-spec = { path = "crates/day-spec", version = "0.4.1" }
day-mock = { path = "crates/day-mock", version = "0.4.1" }
day-core = { path = "crates/day-core", version = "0.4.1" }
day-pieces = { path = "crates/day-pieces", version = "0.4.1" }
day-l10n = { path = "crates/day-l10n", version = "0.4.1" }
day-fluent = { path = "crates/day-fluent", version = "0.4.1" }
day-script = { path = "crates/day-script", version = "0.4.1" }
day-vector = { path = "crates/day-vector", version = "0.4.1" }
day-model = { path = "crates/day-model", version = "0.4.1" }
# default-features = false so trait-only and engine-agnostic consumers (day-lite) can inherit
# without an engine choice; consumers wanting the default engine say `default-features = true`.
day-persistence = { path = "crates/day-persistence", version = "0.4.1", default-features = false }
day-sqlite-worker = { path = "crates/day-sqlite-worker", version = "0.4.1" }
day = { path = "crates/day", version = "0.4.1" }
day-piece-combobox = { path = "pieces/day-piece-combobox", version = "0.4.1" }
day-piece-webview = { path = "pieces/day-piece-webview", version = "0.4.1" }
day-part-battery = { path = "parts/day-part-battery", version = "0.4.1" }
day-part-speech = { path = "parts/day-part-speech", version = "0.4.1" }
day-part-sensors = { path = "parts/day-part-sensors", version = "0.4.1" }
day-part-clipboard = { path = "parts/day-part-clipboard", version = "0.4.1" }
day-part-network = { path = "parts/day-part-network", version = "0.4.1" }
day-piece-media = { path = "pieces/day-piece-media", version = "0.4.1" }
day-part-haptics = { path = "parts/day-part-haptics", version = "0.4.1" }
day-part-prefs = { path = "parts/day-part-prefs", version = "0.4.1" }
day-part-deviceinfo = { path = "parts/day-part-deviceinfo", version = "0.4.1" }
day-part-http = { path = "parts/day-part-http", version = "0.4.1" }
day-part-permissions = { path = "parts/day-part-permissions", version = "0.4.1" }
day-part-location = { path = "parts/day-part-location", version = "0.4.1" }
day-part-local-notify = { path = "parts/day-part-local-notify", version = "0.4.1" }
day-part-fs = { path = "parts/day-part-fs", version = "0.4.1" }
day-piece-activity = { path = "pieces/day-piece-activity", version = "0.4.1" }
day-piece-searchfield = { path = "pieces/day-piece-searchfield", version = "0.4.1" }
day-piece-map = { path = "pieces/day-piece-map", version = "0.4.1" }
day-piece-remote-image = { path = "pieces/day-piece-remote-image", version = "0.4.1" }
day-piece-rating = { path = "pieces/day-piece-rating", version = "0.4.1" }
day-piece-settings = { path = "pieces/day-piece-settings", version = "0.4.1" }
day-piece-pullrefresh = { path = "pieces/day-piece-pullrefresh", version = "0.4.1" }
day-piece-datetime = { path = "pieces/day-piece-datetime", version = "0.4.1" }
day-piece-colorpicker = { path = "pieces/day-piece-colorpicker", version = "0.4.1" }
day-piece-stepper = { path = "pieces/day-piece-stepper", version = "0.4.1" }
day-piece-texteditor = { path = "pieces/day-piece-texteditor", version = "0.4.1" }
# Tweaks (docs/tweaks.md): packaged per-backend configuration of built-in pieces.
day-tweak-button-bezel = { path = "tweaks/day-tweak-button-bezel", version = "0.4.1" }
day-tweak-tooltip = { path = "tweaks/day-tweak-tooltip", version = "0.4.1" }
day-tweak-tree-style = { path = "tweaks/day-tweak-tree-style", version = "0.4.1" }
day-tweak-slider-tickmarks = { path = "tweaks/day-tweak-slider-tickmarks", version = "0.4.1" }
day-toolchain = { path = "crates/day-toolchain", version = "0.4.1" }
day-build = { path = "crates/day-build", version = "0.4.1" }
day-bridge = { path = "crates/day-bridge", version = "0.4.1" }
day-lite = { path = "crates/day-lite", version = "0.4.1" }
day-break = { path = "crates/day-break", version = "0.4.1" }
day-appkit = { path = "toolkits/day-appkit", version = "0.4.1" }
day-gtk = { path = "toolkits/day-gtk", version = "0.4.1" }
day-qt = { path = "toolkits/day-qt", version = "0.4.1" }
day-qt-sys = { path = "toolkits/day-qt-sys", version = "0.4.1" }
day-uikit = { path = "toolkits/day-uikit", version = "0.4.1" }
day-android = { path = "toolkits/day-android", version = "0.4.1" }
day-xaml = { path = "toolkits/day-xaml", version = "0.4.1" }
day-xaml-sys = { path = "toolkits/day-xaml-sys", version = "0.4.1" }
day-arkui = { path = "toolkits/day-arkui", version = "0.4.1" }
day-arkui-sys = { path = "toolkits/day-arkui-sys", version = "0.4.1" }
day-dom = { path = "toolkits/day-dom", version = "0.4.1" }
slotmap = "1.1"
linkme = "0.3"
# The logging facade every day crate emits through (docs/logging.md). A facade only — no backend,
# no dependencies of its own, `no_std`-capable — so taking it costs a crate name and nothing else,
# and it is what lets an app install `env_logger`/`tracing`/its own `log::Log` with no cooperation
# from us. day-core ships the default implementation; day-dom the browser-console one.
log = "0.4"
# icu4x (docs/localization.md "Formatted values"/"Sorting"): one minor version across the runtime
# crates so day-cli's exact-pinned datagen output (baked data) always matches what day-l10n
# compiles against. `compiled_data` is the all-locale fallback; `day build` thins it per app via
# ICU4X_DATA_DIR (crates/day-cli/src/intl.rs).
icu_locale_core = "2.2"
icu_decimal = { version = "2.2", features = ["compiled_data", "alloc", "ryu"] }
icu_calendar = { version = "2.2", features = ["compiled_data"] }
icu_time = { version = "2.2", features = ["compiled_data"] }
icu_datetime = { version = "2.2", features = ["compiled_data"] }
icu_collator = { version = "2.2", features = ["compiled_data"] }
# Search matching (docs/localization.md "Searching"). `auto` gives the segmenter its LSTM +
# dictionary models, which is the only way word starts are found in a script that does not
# write spaces — Chinese, Japanese, Thai, Khmer. Rules alone would make search useless there.
icu_segmenter = { version = "2.2", features = ["compiled_data", "auto"] }
icu_casemap = { version = "2.2", features = ["compiled_data"] }
intl-memoizer = "0.5"

[profile.release]
# `fat` rather than `thin` for reproducibility (DESIGN.md §20.3). ThinLTO makes an internal symbol
# external so it can be inlined across modules, renaming it with a `.llvm.<hash>` suffix to avoid
# collisions. Measured here: that suffix was NOT stable across build directories, so the same commit
# built twice on ONE machine produced binaries differing in exactly those symbol names, and
# downstream in the GNU build-id and `.strtab` size. What feeds the hash is not established — the
# upstream reports attribute it to different inputs in different cases — so this is a fix for the
# observed symptom, not for a diagnosed root cause. Fat LTO merges everything into one module, so no
# cross-module promotion happens and the suffix is never emitted (measured: 53 occurrences → 0).
# Cargo's `trim-paths`, the more targeted candidate, is still unstable as of Cargo 1.97.
# `codegen-units = 1` is the other half, and is the documented baseline for reproducible rustc
# output; see rust-lang/rust#129080 for the standing list of reproducibility hazards.
lto = "fat"
codegen-units = 1
