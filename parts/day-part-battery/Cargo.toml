[package]
name = "day-part-battery"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

# A HEADLESS day-ecosystem crate (no UI Piece): a shared cross-platform API for reading the device's
# battery status via each platform's NATIVE API. Any Rust code can depend on it and call
# `day_part_battery::status()`. Platform selection is by `#[cfg(target_os)]` (it depends on the OS, not a
# widget toolkit), so there are no backend features — it "just works" per target:
#   macOS    — IOKit IOPowerSources (CoreFoundation)
#   iOS      — UIDevice batteryLevel/batteryState
#   Windows  — GetSystemPowerStatus
#   Linux    — /sys/class/power_supply
#   HarmonyOS— native libohbattery_info.so (BasicServicesKit), gated on target_env = "ohos"
#   Android  — BatteryManager via the inline Java arm in src/android.rs (docs/bridge.md)
# See docs/battery.md + docs/extending.md.

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["UIDevice"] }

# Android reads BatteryManager through the generated JNI call into this crate's Java arm, using
# day-android's cached JVM/Context. This is the one platform where the headless crate rides on the
# Day runtime (like the pieces' Android backends).
[target.'cfg(target_os = "android")'.dependencies]
day-android = { workspace = true }
# daybridge (docs/bridge.md): the Java arm and its declaration live in src/android.rs, so the
# dependency is Android-only too — every other target compiles exactly as it did before.
day-bridge = { workspace = true }

# No `[package.metadata.day.android].java` any more: the Android half is the Java arm in
# src/android.rs, which `day build` renders and stages into the app's Gradle build (docs/bridge.md).

[build-dependencies]
day-build = { workspace = true }
