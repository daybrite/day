[package]
name = "day-part-local-notify"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

# A HEADLESS day-ecosystem crate (no UI Piece): post and schedule the platform's OWN notifications.
# Any Rust code can depend on it and call `day_part_local_notify::post(...)`. Platform selection is
# by `#[cfg(target_os)]` (a notification is an OS concern, not a widget-toolkit one), so there are
# no backend features:
#   iOS/macOS — UNUserNotificationCenter: immediate + OS-HELD scheduling (fires while the app is
#               dead), a delegate for foreground presentation and taps
#   Android   — NotificationManager via this crate's own Java shim; scheduling is AlarmManager + a
#               <receiver> (Android has no notification scheduler), declared through the
#               manifest-components key (docs/extending.md)
#   Linux     — org.freedesktop.Notifications over the session D-Bus, std only; no OS-held
#               scheduler, so a scheduled notification is lost if the process exits
#   Web       — the Notification API through the day-dom shim; foreground only
#   Windows   — not wired yet (ToastNotification needs an AUMID shortcut + COM activator)
#   HarmonyOS — not wired yet (the NDK notification surface is narrower than ArkTS)
# See docs/notify.md + docs/extending.md.
#
# PERMISSIONS. This crate does not ask for any: a denial surfaces as `NotifyError::PermissionDenied`
# and the app requests access through day-part-permissions (`Permission::Notifications`). Keeping
# them separate means neither crate depends on the other — the split day-part-location keeps.

[dependencies]
# `request_route` (tap → navigation) and the main-thread door. day-core is the only day crate this
# needs: it owns the routing rail a notification tap has to reach.
day-core = { workspace = true }
day-reactive = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSValue",
] }
# The typed wrapper rather than raw `msg_send!`: UserNotifications has enough classes in play
# (center, content, trigger, request, sound) that hand-rolled selectors would be the riskier
# budget — the same call day-part-haptics makes for objc2-app-kit.
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNNotificationSound",
    "UNNotificationSettings",
    "UNNotification",
    "UNNotificationResponse",
    "UNError",
    "block2",
] }
# The delegate's two callbacks take completion-handler blocks. Without them a notification posted
# while the app is FOREGROUND is silently suppressed by iOS — the reason "Post" appeared to do
# nothing in the running app.
block2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
day-android = { workspace = true }

# --- Android backend contribution (docs/extending.md) ---
[package.metadata.day.android]
java = ["android/java"]
res = ["android/res"]
# Structural, not user-facing: re-arming scheduled notifications after a reboot needs no consent
# prompt and no reason string, so the crate contributes it rather than the app. POST_NOTIFICATIONS
# is the runtime permission the APP declares via day-part-permissions.
permissions = ["android.permission.RECEIVE_BOOT_COMPLETED"]
proguard = ["android/proguard-rules.pro"]
# The alarm + boot receivers. Android instantiates these by name from the manifest, so without this
# the APK installs, runs, and silently never delivers a scheduled notification.
manifest-components = ["android/components.xml"]

[package.metadata.day.ios]
frameworks = ["UserNotifications"]

[package.metadata.day.macos]
frameworks = ["UserNotifications"]

[package.metadata.day.permissions]
uses = ["notifications"]
