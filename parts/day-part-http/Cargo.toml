[package]
name = "day-part-http"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

# A HEADLESS day-ecosystem crate (no UI Piece): HTTP(S) requests through each platform's NATIVE
# networking stack, so apps inherit the system's configuration (proxies + PAC, per-network VPN
# routing, Low Data Mode, enterprise/MDM certificate stores) and carry no TLS library of their own.
# Platform selection is by `#[cfg(target_os)]` / `#[cfg(target_arch)]`, so there are no backend
# features:
#   macOS/iOS — URLSession with a session delegate per client (src/apple.rs)
#   Android   — OkHttp through a Java bridge arm (src/bridge.rs, read by src/bridged.rs)
#   Windows   — WinHTTP in asynchronous mode (src/windows.rs)
#   Linux     — the system's libcurl, opened with dlopen at run time (src/linux.rs)
#   HarmonyOS — the Network Kit through an ArkTS bridge arm (src/bridge.rs, src/bridged.rs)
#   Web       — fetch and WebSocket through a JavaScript bridge arm (src/bridge.rs, src/bridged.rs)
# `tier()` reports NativeStack or Unavailable, and `capabilities()` what a Client can do there.
# See docs/http.md.

[dependencies]
# The bridge's runtime half (docs/bridge.md "Streams"): the Android, HarmonyOS and web arms in
# `src/bridge.rs` report each exchange as a stream of frames.
day-bridge = { workspace = true }
# Oneshot futures for the client's `*_future` forms (docs/async.md).
day-async = { workspace = true }
# The portable client's helpers (docs/http.md "Client"), each measured against the lock before it
# came in: WHATWG URL parsing for redirect targets and cookie domains (icu4x is already in the
# tree, so only idna's adapter, form_urlencoded and url arrive), HTTP dates for cookies and
# Retry-After, the public suffix list for cookie domain safety, and the Digest hashes.
url = "2"
httpdate = "1"
psl = "2"
sha2 = "0.11"
md-5 = "0.11"

[build-dependencies]
day-build = { workspace = true }

# macOS/iOS: URLSession through objc2, with a session delegate per client (src/apple.rs).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "block2",
    "NSArray",
    "NSDate",
    "NSHTTPCookie",
    "NSHTTPCookieStorage",
    "NSStream",
    "NSURLAuthenticationChallenge",
    "NSURLCache",
    "NSURLCredential",
    "NSURLProtectionSpace",
    "NSURLSession",
    "NSURLRequest",
    "NSURLResponse",
    "NSURL",
    "NSData",
    "NSDictionary",
    "NSString",
    "NSError",
    "NSObject",
    "NSEnumerator",
    "NSOperation",
    "NSValue",
] }
# Server trust (SecTrust: the chain and the platform verdict) and client identities
# (SecPKCS12Import), both already part of every Apple app's Security framework.
objc2-security = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "SecBase",
    "SecCertificate",
    "SecIdentity",
    "SecImportExport",
    "SecTrust",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CFArray",
    "CFBase",
    "CFData",
    "CFDictionary",
    "CFError",
    "CFString",
] }

# Android rides the day runtime's cached JVM, like every part with a Java arm.
[target.'cfg(target_os = "android")'.dependencies]
day-android = { workspace = true }

# Linux desktop: the system's libcurl, opened with dlopen at run time (src/linux.rs), so the
# binary links no HTTP or TLS library of its own and a system without libcurl reports Unavailable.
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
libc = "0.2"

# --- Android backend contribution (docs/extending.md) ---
[package.metadata.day.android]
java = ["src/DayHttp.java"]
# Normal install-time permission; no runtime prompt.
permissions = ["android.permission.INTERNET"]
# The HTTP engine (docs/http.md): OkHttp on the platform trust/proxy/policy rails. Resolved
# from mavenCentral (a default repo) into the app's Gradle build by the day CLI.
gradle-dependencies = ["com.squareup.okhttp3:okhttp:4.12.0"]

# (No [package.metadata.day.ios]: NSURLSession lives in Foundation, which every app links already.)

[dev-dependencies]
# The libcurl transport's tests also run on macOS, against the system's libcurl.
libc = "0.2"
