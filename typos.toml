#
# Spelling gate (DESIGN.md §20, the `spelling` job in ci.yml). Two jobs in one tool: catch real
# typos, and hold the tree to STYLE_GUIDE.md's American-English rule — `locale = "en-us"` is what
# turns the British -our/-ise/-re families into findings rather than taste. Prose drifts one
# comment at a time, so the check has to be mechanical.
#
# typos skips its own config, so the examples below can be spelled the way they are spelled.
#
# Run it locally exactly as CI does:  typos
# Fix what it can fix by itself:      typos --write-changes

[default]
locale = "en-us"

# Every entry below maps a word to itself, which is how typos is told "this is not a mistake".
# Each one is a decision, so each one says why.
[default.extend-words]

# --- the one deliberate departure from STYLE_GUIDE.md's American rule -----------------------
# `cancelled` stays double-l. day-part-http's public `HttpError::Cancelled` and GitHub Actions'
# own `cancelled()` both pin the spelling, so switching the prose to "canceled" would leave the
# API reading British while the sentence describing it reads American. American usage accepts
# both; STYLE_GUIDE.md records this as the exception.
cancelled = "cancelled"
cancelling = "cancelling"

# --- platform and toolkit vocabulary -------------------------------------------------------
UDID = "UDID"                  # Apple's Unique Device Identifier, not a UUID
SEH = "SEH"                    # Windows Structured Exception Handling (day-break)
seeked = "seeked"              # the HTML media event name
criticals = "criticals"        # GTK's own term for g_log CRITICAL records
unparented = "unparented"      # GTK widget state: detached from its parent
unparseable = "unparseable"
invokable = "invokable"

# --- identifiers whose short names look like misspellings -----------------------------------
anc = "anc"                    # ancestor, in day-core's tree walks
nd = "nd"                      # node, in the web shim
clen = "clen"                  # chunk length, in the icns reader
iit = "iit"                    # ArkUI_AttributeItem local in the arkui shim
ot = "ot"                      # offset-top, in DayCover.java's layout params
pendings = "pendings"          # day-break's queued-report field
optin = "optin"                # test names ending "_without_optin"
noen = "noen"                  # a fixture directory named "locales-default-noen"
ba = "ba"                      # byte-buffer locals (ba/bb) in rebuild.rs's text differ
pard = "pard"                  # RTF's \pard — "paragraph default", the styled-text codec reads it

# --- fragments of longer words the splitter hands over on their own -------------------------
mis = "mis"                    # the hyphenated prefix: mis-pane, mis-ordering, mis-applied
PN = "PN"                      # from "PNGs"
BOOLEA = "BOOLEA"              # from "BOOLEANs"
BA = "BA"                      # from "E7BA", a Segoe Fluent icon codepoint
caf = "caf"                    # slug("Café") == "caf", asserted in pack/naming.rs
ths = "ths"                    # from "1024ths of a point", Pango's markup unit
empted = "empted"              # from "pre-empted"

# --- deliberate typos: fixtures that exist to BE misspelled ---------------------------------
# `--profile relaese` is the argument-parsing test's wrong input, and `stlye:` is the Fluent
# lint's bad-format-option fixture. Correcting either would delete the thing under test.
relaese = "relaese"
stlye = "stlye"
resaon = "resaon"

# --- not English ----------------------------------------------------------------------------
# Starter-app translations in day-cli (starter_l10n.rs), German dates in day-l10n's ICU tests,
# and a French crash-report fixture. All correct in their own language.
Helo = "Helo"                  # ms-MY
Itens = "Itens"                # pt-BR
Controles = "Controles"        # es-ES, pt-BR
Elemente = "Elemente"          # de-DE
Elementy = "Elementy"          # pl-PL
Juli = "Juli"                  # de
invalide = "invalide"          # fr

# Whole identifiers, so the words inside them stay checked everywhere else — "labelled" on its
# own is still a finding, it is only `ariaLabelledBy` that is spelled that way by its spec.
[default.extend-identifiers]
WriteableBitmap = "WriteableBitmap"  # the WinRT type, spelled that way by Microsoft
ariaLabelledBy = "ariaLabelledBy"    # the ARIA DOM property, spelled that way by the spec

[files]
extend-exclude = [
  # Generated: regenerated by scripts/ci/*-matrix.sh, so a fix here is drift, not a fix.
  "docs/*-matrix.md",
  # Not English. typos has no per-language mode, and every one of these is a translation.
  "crates/day-l10n/catalog/ar.ftl",
  "crates/day-l10n/catalog/de.ftl",
  "crates/day-l10n/catalog/es.ftl",
  "crates/day-l10n/catalog/fr.ftl",
  "crates/day-l10n/catalog/ja.ftl",
  "crates/day-l10n/catalog/zh.ftl",
  # Build output and dependency trees.
  "target/",
  "build/",
  "**/node_modules/",
  "website/dist/",
  "*.lock",
  "**/package-lock.json",
  # Binary payloads.
  "*.svg",
  "*.png",
]
