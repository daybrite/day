[package]
name = "day-piece-stepper"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
build = "build.rs"

# A numeric STEPPER FIELD (docs/stepper.md): `stepper(value)` is a text field with
# increment/decrement arrows, bound two-way to any `Binding<f64>` — an inspector's "stroke
# width", a quantity, a font size.
#
# NATIVE realizes a leaf where the platform ships the widget: an NSTextField + NSStepper
# composite on AppKit (macOS has no combined control), GtkSpinButton, and a QDoubleSpinBox
# shim. COMPOSED builds the same field from ordinary Day pieces (− / field / +), so it behaves
# identically on every other target. The default is native where an arm exists and composed
# where none does — uikit, mdc, arkui, dom and xaml appear in no [features] list below and no
# `backends` entry: they need no code of their own.

[features]
appkit = ["dep:day-appkit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
gtk = ["dep:day-gtk", "dep:gtk4"]
qt = ["dep:day-qt"]                 # + build.rs compiles src/lib-qt-shim.cpp (QDoubleSpinBox)
# No renderer — the feature exists so an app can enable `day-piece-stepper/mock` uniformly;
# the composed field carries mock, like every backend without an arm.
mock = []

# Backends this piece carries a native-renderer [features] entry for. `day` unions
# `<pkg>/<backend>` into an app build (Tier A.2), so an app depends on this piece with a plain
# `{ workspace = true }` and no per-backend feature fan-out of its own.
[package.metadata.day.piece]
backends = ["appkit", "gtk", "qt", "mock"]

[dependencies]
day-spec = { workspace = true }
day-core = { workspace = true }
day-pieces = { workspace = true }
day-reactive = { workspace = true }
linkme = { workspace = true }
day-appkit = { workspace = true, optional = true }
day-gtk = { workspace = true, optional = true }
day-qt = { workspace = true, optional = true }
gtk4 = { version = "0.11", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSControl", "NSStepper", "NSTextField", "NSView", "NSResponder", "NSFont"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
day-mock = { workspace = true }
