# A compose piece (DESIGN.md §8): the shared appearance + language settings rows every app's
# preferences surface needs, persisted through day-part-prefs and applied live through
# day-core's set_appearance/set_locale. Pure composition, with no native code and no cargo
# features.

[dependencies]
day-pieces = { workspace = true }
day-core = { workspace = true }
day-spec = { workspace = true }
day-reactive = { workspace = true }
day-fluent = { workspace = true }
day-part-prefs = { workspace = true }
