[package]
name = "day-piece-rating"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

# A compose piece (DESIGN.md §8 / the composition-first tier): a reusable widget built from Day's
# core primitives, with no native/per-toolkit code. Works on every backend.
# The flagship example that native pieces are the exception, not the rule. Filled in by the build.

[features]
# The piece's `#[day::test]` cases (docs/testing.md): compiled only into a test build, which
# the conformance app turns on.
conformance = ["dep:day-macros"]

[dependencies]
day-macros = { workspace = true, optional = true }
day-pieces = { workspace = true }
day-core = { workspace = true }
day-reactive = { workspace = true }
