[package]
name = "day-piece-pager"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
uikit = ["dep:day-uikit", "dep:objc2", "dep:objc2-ui-kit", "dep:objc2-foundation"]
mdc = ["dep:day-android"]
arkui = ["dep:day-arkui"]

[package.metadata.day.piece]
backends = ["uikit", "mdc", "arkui"]

[dependencies]
day-core.workspace = true
day-pieces.workspace = true
day-spec.workspace = true
day-reactive.workspace = true
linkme.workspace = true
day-uikit = { workspace = true, optional = true }
day-android = { workspace = true, optional = true }
day-arkui = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true, features = ["NSArray", "NSObject", "NSRunLoop"] }
objc2-ui-kit = { workspace = true, optional = true, features = ["UIView", "UIResponder", "UIViewController", "UIPageViewController", "UIGestureRecognizer", "UIScrollView", "UINavigationController", "block2"] }

[package.metadata.day.android]
java = ["src/DayPager.java"]
gradle-dependencies = ["androidx.viewpager:viewpager:1.1.0"]

[dev-dependencies]
day-mock.workspace = true
