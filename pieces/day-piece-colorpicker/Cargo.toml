[package]
name = "day-piece-colorpicker"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
build = "build.rs"

# A standalone color picker (docs/colorpicker.md): `color_picker(Signal<Color>)` is a color well —
# a swatch showing the current color that opens a chooser when pressed — in two idioms.
#
# NATIVE realizes a leaf that six toolkits render with their own chooser (NSColorWell + the shared
# NSColorPanel, UIColorWell, GtkColorDialogButton, a QColorDialog shim, the XAML ColorPicker in a
# flyout, `<input type="color">`). COMPOSED builds the whole picker from ordinary Day pieces and a
# canvas, so it needs no arm and behaves identically on all nine targets. The default is native
# where the toolkit has a chooser and composed where it does not — which is android-mdc and
# harmony-arkui, neither of which ships a color picker at any layer. Those two therefore appear in
# no [features] list below and no `backends` entry: they need no code of their own.

[features]
appkit = ["dep:day-appkit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
gtk = ["dep:day-gtk", "dep:gtk4"]
qt = ["dep:day-qt"]                 # + build.rs compiles src/lib-qt-shim.cpp (QColorDialog)
uikit = ["dep:day-uikit", "dep:objc2", "dep:objc2-ui-kit", "dep:objc2-foundation", "dep:objc2-core-foundation"]
# XAML: build.rs compiles src/lib-xaml-shim.cpp — a Button whose Flyout holds the system
# `ColorPicker`, boxed through day-xaml-sys's day_xaml_box seam. Windows-only, built in CI, NOT
# verified locally (docs/colorpicker.md records what a Windows check must confirm).
xaml = ["dep:day-xaml", "dep:day-xaml-sys"]
# web-dom: `<input type="color">`, the browser's own picker.
dom = ["dep:day-dom"]
# No renderer — the feature exists so an app can enable `day-piece-colorpicker/mock` uniformly;
# the kind then falls back to day's placeholder leaf.
mock = []

# Backends this piece carries a native-renderer [features] entry for. `day` unions
# `<pkg>/<backend>` into an app build (Tier A.2), so an app depends on this piece with a plain
# `{ workspace = true }` and no per-backend feature fan-out of its own. mdc and arkui are absent
# on purpose: their picker is the composed one, which is plain Rust behind no feature at all.
[package.metadata.day.piece]
backends = ["appkit", "gtk", "qt", "uikit", "xaml", "dom", "mock"]

[dependencies]
day-spec = { workspace = true }
day-core = { workspace = true }
day-pieces = { workspace = true }
day-reactive = { workspace = true }
# The composed panel's buttons and its screen-reader labels come from the core catalog
# (`day-cancel`, `day-done`, `day-color-*`), so they arrive translated in every locale Day ships.
day-l10n = { workspace = true }
linkme = { workspace = true }
day-appkit = { workspace = true, optional = true }
day-gtk = { workspace = true, optional = true }
day-qt = { workspace = true, optional = true }
day-uikit = { workspace = true, optional = true }
day-xaml = { workspace = true, optional = true }
day-xaml-sys = { workspace = true, optional = true }
day-dom = { workspace = true, optional = true }
gtk4 = { version = "0.11", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSColor", "NSColorPanel", "NSColorSpace", "NSColorWell", "NSControl", "NSPanel", "NSView", "NSWindow", "NSResponder"] }
objc2-ui-kit = { version = "0.3", optional = true, features = ["UIColor", "UIColorWell", "UIControl", "UIView", "UIResponder"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString"] }
objc2-core-foundation = { version = "0.3", optional = true, features = ["CFCGTypes"] }

[build-dependencies]
day-toolchain = { workspace = true }
cc = "1"

[dev-dependencies]
day-mock = { workspace = true }
day-l10n = { workspace = true }
