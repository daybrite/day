copyright = "2026 Daybrite"
contact-email = "hello@daybrite.dev"
review-notes = """
Daylite is a reference "superapp" host for the day-lite runtime. It ships three sample miniapps
(weather, todo, tic-tac-toe) that are installed from a catalog bundled with the app; no account or
network connection is needed to exercise it.

Miniapps are JavaScript/TypeScript running in an embedded QuickJS interpreter that drives native
widgets directly. There is no web view. A miniapp declares the capabilities it needs (network hosts,
storage) and the install flow shows them before it is installed, which is the flow to review.
"""
