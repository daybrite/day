name: map-shot
description: Apple-only native MapKit map (docs/map.md) — recenter Boston->Paris, let tiles load, screenshot. Run on appkit/uikit only.
flow:
  - wait_for: { id: home-title }
  - navigate: { route: map }
  - assert_route: { route: map }
  - assert_visible: { id: map-title }
  - assert_visible: { id: map }
  - tap: { id: map-paris }
  - assert_text: { id: map-coords, text: "48.8566, 2.3522" }
  - pause: { secs: 3 }
  - screenshot: map
