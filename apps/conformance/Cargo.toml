[package]
name = "conformance"
version = "0.1.0"
edition = "2024"
publish = false
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
mdc = ["day/mdc"]
xaml = ["day/xaml"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# The checkout this app lives in, by path: the conformance app is built against the commit it
# sits in, never against a published Day (docs/testing.md).
day = { path = "../../crates/day", features = ["conformance"] }
# The pieces inside this checkout, each with its own cases (docs/testing.md). Only these: a
# piece from another repository is that repository's to test.
day-piece-activity = { path = "../../pieces/day-piece-activity", features = ["conformance"] }
day-piece-colorpicker = { path = "../../pieces/day-piece-colorpicker", features = ["conformance"] }
day-piece-combobox = { path = "../../pieces/day-piece-combobox", features = ["conformance"] }
day-piece-datetime = { path = "../../pieces/day-piece-datetime", features = ["conformance"] }
day-piece-map = { path = "../../pieces/day-piece-map", features = ["conformance"] }
day-piece-pullrefresh = { path = "../../pieces/day-piece-pullrefresh", features = ["conformance"] }
day-piece-rating = { path = "../../pieces/day-piece-rating", features = ["conformance"] }
day-piece-remote-image = { path = "../../pieces/day-piece-remote-image", features = ["conformance"] }
day-piece-searchfield = { path = "../../pieces/day-piece-searchfield", features = ["conformance"] }
day-piece-settings = { path = "../../pieces/day-piece-settings", features = ["conformance"] }
day-piece-texteditor = { path = "../../pieces/day-piece-texteditor", features = ["conformance"] }
day-piece-stepper = { path = "../../pieces/day-piece-stepper", features = ["conformance"] }

[build-dependencies]
day-build = { path = "../../crates/day-build" }

# Its own workspace: a package nested inside the framework's workspace without being a member
# fails every cargo command, and the root excludes `apps/*` for the same reason.
[workspace]
