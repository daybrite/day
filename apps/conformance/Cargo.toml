[package]
name = "conformance"
version = "0.1.0"
edition = "2024"
publish = false
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
xaml = ["day/xaml"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# The checkout this app lives in, by path: the conformance app is built against the commit it
# sits in, never against a published Day (docs/testing.md).
day = { path = "../../crates/day", features = ["conformance"] }
# The pieces inside this checkout, each with its own cases (docs/testing.md). Only these: a
# piece from another repository is that repository's to test.
day-piece-settings = { path = "../../crates/day-piece-settings", features = ["conformance"] }
day-piece-text-editor = { path = "../../crates/day-piece-text-editor", features = ["conformance"] }

[target.'cfg(target_env = "ohos")'.dependencies]
# The opt-in native-input fixture exercises an existing toolkit hook without adding a
# public piece modifier just for the test.
day-core = { path = "../../crates/day-core" }
day-spec = { path = "../../crates/day-spec" }

[build-dependencies]
day-build = { path = "../../crates/day-build" }

[dev-dependencies]
day-core = { path = "../../crates/day-core" }

# Its own workspace: a package nested inside the framework's workspace without being a member
# fails every cargo command, and the root excludes `apps/*` for the same reason.
[workspace]

# Suite-level guard against accidentally unlinking an entire provider. Individual tests
# are discovered from compiler exports, never listed here.
[package.metadata.day.conformance]
required-providers = [
    "conformance",
    "day-pieces",
    "day-piece-settings",
    "day-piece-text-editor",
    ]
