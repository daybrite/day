# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Crate families released in lockstep have to be bumped in lockstep. They share types
    # across crate boundaries, and a 0.x bump is a SemVer-incompatible one, so a PR that
    # moves two of six leaves the other four behind, cargo keeps both minors in the graph,
    # and the same struct from two versions stops being the same type ("expected
    # oxc_allocator::allocator::Allocator, found oxc_allocator::Allocator"). One PR per
    # family instead of one per crate.
    groups:
      oxc:
        patterns:
          - "oxc_*"
    # `windows-future` has to be the version the `windows` crate itself is built on: Day names
    # its `IAsyncOperation` only because `windows` hands that type back. windows-rs published
    # `windows-future`/`windows-core` 0.100 without a matching `windows` release (still 0.62,
    # on windows-future 0.3), so a 0.100 bump alone splits `windows-core` in two and the WinRT
    # types stop satisfying its traits (PR #67). Move it together with `windows` instead.
    ignore:
      - dependency-name: "windows-future"
        versions: [">=0.4"]
