name: Day crate names
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crate-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/ci/check-crate-names.py
