# doctor-verify: scheduled scaffold/package checks and executable tutorial walkthroughs.
#
# Each job does what a new user on a stock machine would: `cargo install day-cli` (from crates.io,
# with the runner's preinstalled Rust), install that combo's toolkit prerequisites, and run
# `day doctor verify -t <combo> --day-version <v> --strict`, one command that checks the environment (a
# focused `day doctor`, whose checks are errors, so passing means the prerequisites really are
# complete), scaffolds an app with `day new`, builds it, and packages it. It catches a broken or
# yanked release, a dependency that stopped compiling, a scaffold that drifted from the API, and
# OS-specific regressions before users hit them.
#
# Doctor matrix: platform-toolkit combos × main/latest Day versions.
#   main:     doctor-verify installs day-cli from the git remote's main branch and scaffolds against it.
#             A regression is reported the day it lands, not at the next release.
#   latest:   the newest day-cli published to crates.io, what a user who installs today gets. The
#             CLI installed above is already that version, so doctor-verify skips the second install
#             and runs it.
# The day under test decides both halves (the CLI that scaffolds/builds/packs, and the `day`
# dependency the scaffold carries), so a job can never test one against the other.
#
# `--strict` is why a broken prerequisite still fails the job: without it, doctor-verify would skip the
# combo it can no longer build and report success. The per-combo matrix is kept (rather than one
# `day doctor verify` per runner) so every combo reports its own red or green cell.
#
# The job summary carries each combo's build time and packaged artifact size: `day doctor verify` writes
# that table to $GITHUB_STEP_SUMMARY itself.
#
# Probe the installed CLI's capabilities before provisioning the target SDK. An older CLI fails
# with an update instruction instead of spending the job on setup and then failing to parse.
#
# NOTE: scaffolds take their `day` dependency from the git remote (a tag for a release, a branch
# for `main`) because the framework crates are not yet published to crates.io. Once they are,
# `--day-version <x.y.z>` can pair with `--registry` for the pure crates.io path.
# Tutorial jobs independently validate the shared YAML and walk through all six Session counter
# lessons on macOS, Windows, and Linux. Release jobs use the published site's recipe and a fresh
# crates.io install; main jobs use checkout sources. Each job uploads its verification evidence.
name: doctor-verify

on:
  # Twice daily (UTC) rather than the four times install.yml ran: a cell now packages as well as
  # builds, and does it in release, so it costs more wall clock than the old build-only job.
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:
  # PRs validate tutorial sources only; native checks run on the schedule or manual dispatch.
  pull_request:
    paths:
      - website/tutorials/**
      - website/plugins/tutorial-steps.mjs
      - website/src/lib/tutorial*
      - website/scripts/tutorial*.mjs
      - website/scripts/verify-marketing-evidence.mjs
      - website/src/components/TutorialPlatform.astro
      - website/src/pages/tutorials/**
      - website/src/content/docs/getting-started.md
      - website/src/content/docs/tutorial-*.md
      - website/package*.json
      - .github/actionlint.yaml
      - .github/workflows/doctor-verify.yml

# Tutorial jobs check out the recipe and runner; doctor jobs install from public sources.
permissions:
  contents: read

env:
  # Verbose day CLI (docs/environment.md): each scaffolded build forwards the underlying
  # cargo/gradle/xcodebuild/hvigor commands and their raw logs. A `latest` CLI that predates
  # DAY_VERBOSE ignores it, which is the right degradation for a job whose point is to run
  # exactly what a user installs.
  DAY_VERBOSE: "1"

jobs:
  doctor-verify:
    if: github.event_name != 'pull_request'
    name: ${{ matrix.combo }} · day ${{ matrix.day-version }}
    strategy:
      fail-fast: false # report every combo independently; one break shouldn't hide the others
      matrix:
        # Two axes, crossed: every combo is checked against every day under test. `main` catches a
        # regression the day it lands; `latest` catches one a user would hit today, on the newest
        # published release. `include` rows carry no `day-version`, so each one attaches its os +
        # toolkit to both of its combo's jobs rather than adding jobs of its own.
        day-version: [main, latest]
        combo:
          - macos-appkit
          - macos-gtk
          - macos-qt
          - ios-uikit
          - linux-gtk
          - linux-qt
          - android-material
          - harmony-arkui
          - windows-winui
        # Only the runner each combo needs: the toolkit column went with the setup ladder, which
        # is now one action that derives what a target needs from the target itself.
        include:
          - { combo: macos-appkit,  os: xcode-27 }
          - { combo: macos-gtk,     os: xcode-27 }
          - { combo: macos-qt,      os: xcode-27 }
          - { combo: ios-uikit,     os: xcode-27 }
          - { combo: linux-gtk,     os: ubuntu-latest }
          - { combo: linux-qt,      os: ubuntu-latest }
          - { combo: android-material,   os: ubuntu-latest }
          - { combo: harmony-arkui, os: ubuntu-latest }
          - { combo: windows-winui, os: windows-latest }
        # windows-winui is newer than the latest published CLI; verify it on `main` until a
        # release carries it, then drop this.
        exclude:
          - { day-version: latest, combo: windows-winui }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90 # a cell now builds and packages; the slowest (ios, linux flatpak) run long
    defaults:
      run:
        shell: bash
    steps:
      # --- the one true user step: install the published CLI with stock Rust ---------------
      - name: cargo install day-cli
        run: cargo install day-cli
      - name: Require the verification command
        run: |
          if ! day doctor verify --help >/dev/null 2>&1; then
            echo "::error::The installed day CLI lacks 'doctor verify'. Install a CLI built from the current day revision."
            exit 1
          fi

      # --- everything this combo needs, in one step ----------------------------------------
      # The toolkit's dev libraries, the Rust std for its cross-compile, the SDK a mobile target
      # builds through, and the tools `day pack` needs: all of it is a property of the target, so
      # it lives in one action every Day workflow calls (daybrite/actions), not in a ladder of
      # `if: matrix.combo == …` steps copied between three repositories.
      #
      # `java: false` because this workflow's claim is "what a new user on a stock machine
      # gets", and pinning a JDK it would not have weakens that. Day accepts 17+, which every
      # runner image already has. `extras: false` for the same reason: doctor-verify builds and packs
      # a scaffolded app, it runs no walkthrough, so it needs no display or screenshot tools.
      - name: Set up ${{ matrix.combo }} dependencies
        uses: daybrite/actions/.github/actions/setup-day-deps@v1
        with:
          target: ${{ matrix.combo }}
          pack: true
          extras: false
          java: false

      # --- the check: doctor → new → build → pack, for this combo --------------------------
      # `--day-version` decides both halves of what is under test: doctor-verify installs that day-cli
      # (skipping the install when the CLI above is already that version: the `latest` cells) and
      # pins the app it scaffolds to the same day. The scaffold goes under `--dir`, a directory in
      # the runner's temp dir whose name holds a space, so new → build → pack (and the CLI install
      # doctor-verify puts in the same root) all run against a path containing one. Doctor verification removes each
      # combo's project as it finishes; the run's build time and packaged artifact size land in the
      # job summary. `runner.temp` rather than `$RUNNER_TEMP`: the Windows legs run PowerShell.
      #
      # --profile release, not doctor-verify's own debug default: the sizes then describe what users
      # actually download, and release is where the full format set exists (`day pack` builds the
      # Play .aab only for release, so a debug run would leave that pipeline unchecked).
      - name: day doctor verify -t ${{ matrix.combo }} (day ${{ matrix.day-version }})
        run: |
          target="${{ matrix.combo }}"
          # The published driver validates targets BEFORE installing the requested CLI.
          # It predates android-material; use the temporary tooling alias at this boundary
          # until the published driver knows the canonical name. The current CLI accepts
          # this alias when the driver delegates scaffold/build/pack to main.
          if [ "$target" = android-material ]; then target=android-mdc; fi
          day doctor verify -t "$target" --day-version ${{ matrix.day-version }} --profile release --strict --dir "${{ runner.temp }}/Day Project Root"

  tutorial-source:
    name: Tutorial recipe and renderer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm --prefix website ci
      - run: npm --prefix website run tutorials:check

  tutorial-walkthrough:
    name: Tutorial · ${{ matrix.platform }} · ${{ matrix.mode }}
    if: github.event_name != 'pull_request'
    needs: tutorial-source
    strategy:
      fail-fast: false
      matrix:
        mode: [release, main]
        platform: [macos, windows, linux]
        include:
          - platform: macos
            runner: xcode-27
            target: macos-appkit
          - platform: windows
            runner: windows-2025
            target: windows-winui
          - platform: linux
            runner: ubuntu-24.04
            target: linux-gtk
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # Provision the documented SDK baseline. This does not install Day or create the app.
      - uses: daybrite/actions/.github/actions/setup-day-deps@v1
        with:
          target: ${{ matrix.target }}
          pack: false
          extras: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: npm --prefix website ci
      # The release lane reads the recipe shipped with the live site. The main lane uses this
      # checkout's recipe, CLI, and framework, and records its dependency substitutions.
      - name: Execute the tutorial
        shell: bash
        env:
          TUTORIAL_PLATFORM: ${{ matrix.platform }}
          TUTORIAL_MODE: ${{ matrix.mode }}
          TUTORIAL_SOURCE: ${{ matrix.mode == 'release' && 'published' || 'checkout' }}
          TUTORIAL_OUT: ${{ runner.temp }}/tutorial-${{ matrix.platform }}-${{ matrix.mode }}
        run: |
          command=(node website/scripts/tutorial-walkthrough.mjs
            --platform "$TUTORIAL_PLATFORM" --mode "$TUTORIAL_MODE"
            --source "$TUTORIAL_SOURCE" --out "$TUTORIAL_OUT")
          if [[ "$TUTORIAL_PLATFORM" == linux ]]; then
            xvfb-run -a -s '-screen 0 1280x1024x24' "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Record result
        if: always()
        shell: bash
        env:
          TUTORIAL_OUT: ${{ runner.temp }}/tutorial-${{ matrix.platform }}-${{ matrix.mode }}
        run: |
          if [[ -f "$TUTORIAL_OUT/evidence/result.json" ]]; then
            cat "$TUTORIAL_OUT/evidence/result.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Tutorial did not start; inspect prerequisite or recipe-fetch failures.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tutorial-${{ matrix.platform }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/tutorial-${{ matrix.platform }}-${{ matrix.mode }}/evidence
          retention-days: 14
          if-no-files-found: warn
