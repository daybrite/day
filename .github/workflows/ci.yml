# CI (DESIGN.md §20.1): per-OS jobs, patterns lifted from pane's per-OS matrix and hop's
# screenshot pipeline. Banked toolchain knowledge encoded here from day one: the Gradle/AGP
# builds use the runner's default preinstalled JDK (Day accepts 17+; Gradle 9.6 runs on 17…26;
# the old "pin 21, never newer" rule was an AGP-8-era jdk-image-transform quirk that no longer
# holds), rustup toolchains for cross-std, GSK_RENDERER=cairo for headless GTK (set by `day
# launch` itself), `--locked` everywhere, emulator boot handled by the runner action's polling.
name: ci

on:
  push:
    branches: [main]
    # Semantic-release tags run a lean release lane: fmt/msrv → the 3×2 day-CLI release
    # builds → the per-combo framework jobs → the `release` job, which publishes the GitHub
    # release (CLI binaries, installers, attestations) → the `publish` job, which uploads the
    # crates to crates.io via Trusted Publishing (OIDC, so no API-key secret). The `release` job
    # also runs on every push/PR, where it only verifies publishability with
    # `cargo publish --dry-run`. The `showcase` job is branch/PR only: a tagged commit was
    # already validated on main, and the app releases from its own repository.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
    inputs:
      day-verbose:
        description: >-
          Run the day CLI verbose (DAY_VERBOSE=1): every `day build`/`launch`/`pack` forwards
          its sub-commands' raw output — the cargo/gradle/xcodebuild/hvigor command lines and
          logs. On by default; un-check to get the quiet status-line output back.
        type: boolean
        default: true

permissions:
  contents: read

#concurrency:
#  group: ci-${{ github.ref }}
#  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: full
  # Verbose day CLI (docs/environment.md): every `day build`/`launch`/`pack` of the showcase
  # and the scaffold canaries forwards the underlying cargo/gradle/xcodebuild/hvigor commands
  # and their raw logs. Builds of day-cli itself go through cargo directly and stay as they
  # are. Default on; a manual dispatch can un-check the day-verbose input to run quiet.
  DAY_VERBOSE: ${{ github.event_name == 'workflow_dispatch' && inputs.day-verbose == false && '0' || '1' }}
  # The macOS runner images ship with third-party taps (aws/tap) that Homebrew's tap-trust
  # check warns about on every `brew install`. Runners are ephemeral, so trust checks buy
  # nothing here; this silences the warning in every job. NOTE the flag is deprecated
  # upstream ("will be removed in a later release"); when it stops working, replace it
  # with a `brew untap aws/tap` step next to the brew installs.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  # Which ref of daybrite/Day-Showcase every job builds (.github/actions/showcase). Resolved here
  # because a composite action cannot read the `vars` context; unset is the normal case and means
  # `main`. Set the repository variable to point a whole run at an app branch.
  DAY_SHOWCASE_REF: ${{ vars.DAY_SHOWCASE_REF }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (host-portable crates, CLI, mock backend)
        run: |
          cargo clippy --locked --all-targets
          # day-pieces' `dyn-registry` feature is named explicitly because no workspace member
          # turns it on: its consumer, day-lite, lives in its own repository
          # (daybrite/day-lite). Without it no CI job compiles the dynamic piece registry, and a
          # change that breaks the registry would first surface there.
          cargo clippy --locked -p day-cli -p day-script -p day-pieces --features day-pieces/dyn-registry --all-targets

  # Spelling + the American-English rule (STYLE_GUIDE.md), enforced by `typos` over the whole
  # tree: prose, doc comments, and code comments alike. It is a spelling gate and a dialect gate
  # at once: typos.toml sets `locale = "en-us"`, which is what makes a British variant a finding
  # rather than a matter of taste. The mixed state this replaced had 355 of them, and the reason
  # was drift rather than disagreement; nobody decides a dialect one comment at a time.
  #
  # Every exception is a named entry in typos.toml with a reason beside it, so the allow-list
  # reads as decisions rather than as noise someone silenced. Run `typos` locally to reproduce
  # this job exactly; `typos --write-changes` applies what it can fix on its own.
  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned rather than floating on @master: the dictionary ships inside the action, so an
      # unpinned bump turns this job red on a commit that changed nothing. Keep it in step with
      # whatever `typos --version` reports locally, or the two disagree about what a word is.
      - uses: crate-ci/typos@v1.50.1

  duty-matrix-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Toolkit-duty conformance table (docs/duty-matrix.md) is generated; a Toolkit-trait
      # or backend change that forgets to regenerate it is drift, and drift is a red build.
      - name: Duty-matrix drift check
        run: |
          scripts/ci/duty-matrix.sh
          git diff --exit-code docs/duty-matrix.md
      # docs/coverage-matrix.md is the same contract for the piece vocabulary: which kinds each
      # backend realizes, which piece ships which arm, and what every Cap answers. Adding a
      # renderer without regenerating it is drift; the walkthrough's assert_no_placeholders
      # allow-lists are the runtime half of the same fact.
      - name: Coverage-matrix drift check
        run: |
          scripts/ci/coverage-matrix.sh
          git diff --exit-code docs/coverage-matrix.md
      # docs/recorder-matrix.md is the same contract for the dayscript recorder: what it writes for
      # every Event an app can receive. `event_to_step` ends in a catch-all, so an unmapped event
      # is silent (a control that replays but never records), and this puts every new variant in a
      # diff as "dropped", where someone has to agree with it (§14.6).
      - name: Recorder-matrix drift check
        run: |
          scripts/ci/recorder-matrix.sh
          git diff --exit-code docs/recorder-matrix.md

  # ===========================================================================
  # Per-combo FRAMEWORK jobs: one job per <platform>-<toolkit>. Each installs the toolkit's deps
  # and runs the checks that need that host — above all the scaffold check, which proves `day new`
  # output still builds, lints, packs and rebuilds against this commit. Gated on the fast checks
  # (fmt/msrv). Per-combo clippy runs inside these jobs: each combo lints its backend feature (a
  # `--workspace` clippy cannot compile: feature unification would enable several `day` backends at
  # once and trip the one-backend-per-binary compile_error! guard, §3); the toolkit-independent
  # lints run in the first-pass `clippy` job.
  #
  # What is NOT here: building, driving, capturing or packing Day-Showcase. That is the `showcase`
  # job above, which hands the app to daybrite/actions' dayapp.yml — the same pipeline every Day
  # app gets — with this run's CLI artifact and `day patch --local` pointing the app's day
  # dependencies at this commit. Three jobs still check the app out (toolkit, harmony-arkui,
  # web-dom) to lint a backend as the app's dependency graph resolves it, which is a framework
  # check that happens to need an app on disk.
  # ===========================================================================

  # --- day CLI: release builds, shared as artifacts -------------------------
  # Runs right after the fast checks (fmt/msrv). Six parallel jobs, one per (OS, arch), because
  # this is the first phase everything else waits on, and one runner per architecture halves its
  # wall-clock against building both in sequence on one runner. Linux and Windows legs each run
  # on hardware matching their arch (ubuntu-24.04-arm / windows-11-arm for aarch64); macOS
  # x86_64 is the one remaining cross build, since GitHub retired its Intel runners. Each leg
  # builds one target and uploads it as `day-<os>-<arch>` (e.g. day-macos-x86_64,
  # day-linux-aarch64). Three job IDs with a two-arch matrix each, so the `needs:` below still
  # name day-cli-macos / -linux / -windows and wait on both of that OS's legs. (The job keys
  # keep the day-cli- prefix for those needs: edges; the displayed names are day-<os> because
  # the legs test the framework as well as building the CLI.)
  #
  # `fail-fast: false`: a broken build on one architecture should not cancel the other, whose
  # binary the per-platform jobs are waiting on.
  #
  # scripts/ci/scaffold-check.sh no longer runs here: it moved into the per-platform jobs below,
  # where each combo scaffolds, lints, packs, and rebuilds (`day rebuild --from-dir`) a fresh
  # 21-locale project, and the desktop combos drive the rebuilt copy's demo dayscript too.
  #
  # The host-portable test run (scripts/ci/host-test.sh: the whole workspace minus the toolkit
  # crates, not bare `cargo test`, whose default-members are the small quick-iteration set) rides
  # every leg whose runner matches its arch (both Linux legs, both Windows legs, and macOS
  # aarch64; the macOS x86_64 cross leg cannot run the binaries it builds). It runs before the
  # release build, so a red test fails the leg, and skips every job downstream of its artifact,
  # without paying for the build first. The tag lane skips the test step (the tagged commit was
  # already validated on main).
  day-cli-macos:
    name: day-macos (${{ matrix.arch }})
    needs: [fmt, msrv]
    runs-on: xcode-27 # Apple silicon: aarch64 is the host arch, x86_64 the cross build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, target: aarch64-apple-darwin }
          - { arch: x86_64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (host-portable crates)
        if: ${{ matrix.arch == 'aarch64' && !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: scripts/ci/host-test.sh
      - name: Build the day CLI (release, ${{ matrix.target }})
        run: cargo build --locked --release -p day-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: day-macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/day
          if-no-files-found: error

  day-cli-linux:
    name: day-linux (${{ matrix.arch }})
    needs: [fmt, msrv]
    runs-on: ${{ matrix.runner }} # each arch on matching hardware: both legs build and test natively
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { arch: aarch64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }} # two runner arches share this job id; keep their caches apart
      - name: Test (host-portable crates)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: scripts/ci/host-test.sh
      - name: Build the day CLI (release, ${{ matrix.target }})
        run: cargo build --locked --release -p day-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: day-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/day
          if-no-files-found: error

  day-cli-windows:
    name: day-windows (${{ matrix.arch }})
    needs: [fmt, msrv]
    runs-on: ${{ matrix.runner }} # each arch on matching hardware: both legs build and test natively
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-pc-windows-msvc, runner: windows-2025 }
          - { arch: aarch64, target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }} # two runner arches share this job id; keep their caches apart
      - name: Test (host-portable crates)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: scripts/ci/host-test.sh
      - name: Build the day CLI (release, ${{ matrix.target }})
        run: cargo build --locked --release -p day-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: day-windows-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/day.exe
          if-no-files-found: error

  # --- Release: verify publishability always; publish the GitHub release on a semantic tag ---------
  # Runs on every push / PR / tag. It always runs `cargo publish --workspace --dry-run` to prove the
  # whole workspace could be published (versions, MPL-2.0 license, metadata, packaging). On a
  # semantic-release tag (`vX.Y.Z`) it additionally: checks the tag matches the workspace version;
  # downloads the six day-<os>-<arch> CLI binaries from the 3×2 release builds; repackages them as
  # target-triple archives; renders installer scripts + Homebrew formula from scripts/release/templates
  # (cargo-dist style: version/URLs/sizes/checksums baked in); pulls in the per-combo app packages
  # (release-signed on tags when the DAY_* secrets are set, dev-signed otherwise); writes one
  # SHA256SUMS; attests build provenance for every file; and attaches the lot to a published GitHub
  # release. The actual crates.io upload is the separate `publish` job (Trusted Publishing).
  # `!cancelled()`: the dry-run is independent of the matrix, so a flaky leg still lets the gate report.
  #
  # The dry-run verifies (it does not pass `--no-verify`): cargo unpacks each .crate and builds it,
  # which is the only check that catches a package that is not self-contained. `include_str!` reaching
  # outside its package compiles in-tree and fails for every `cargo install day-cli` user; that
  # shipped in 0.0.15 (the web-dom host trio). Verification is cheap here because all four publishable
  # crates (day-build, day-cli, day-fonts, day-toolchain) are host-only tooling; the per-platform
  # toolkit crates that can't share a runner are all publish=false and are never packaged.
  release:
    name: release
    if: ${{ !cancelled() }}
    needs: [toolkit, day-cli-macos, day-cli-linux, day-cli-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # A semantic-release tag (`vX.Y.Z…`) vs any other ref: the step-level `if:`s gate the tag-only
      # GitHub-release steps; the dry-run below runs on every ref.
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publishability gate: verify the workspace could publish on every push/PR/tag (a green gate on
      # the tagged commit precedes the real upload in the `publish` job).
      - name: Verify publishability (cargo publish --workspace --dry-run)
        run: cargo publish --workspace --dry-run --locked
      # The dry-run leaves each unpacked package in target/package. rust-cache's post-job cleanup
      # reads any `tests/` directory there as trybuild output and logs ENOENT errors for day-cli
      # and day-build. The unpacked sources are not worth caching; the verification build's
      # compiled output stays in the workspace's own build directories.
      - name: Drop the unpacked packages before the cache is saved
        if: ${{ always() }}
        run: rm -rf target/package

      # --- GitHub release (semantic tags only) ---
      - name: Check the tag matches the workspace version
        if: ${{ env.IS_TAG == 'true' }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match [workspace.package] version $crate — bump Cargo.toml before tagging"
            exit 1
          fi
      - name: Download the day CLI artifacts (all six os/arch builds)
        if: ${{ env.IS_TAG == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: day-*
          path: cli-artifacts
      - name: Package target-triple archives
        if: ${{ env.IS_TAG == 'true' }}
        run: bash scripts/release/package-cli.sh cli-artifacts dist
      - name: Render installers (shell + PowerShell + Homebrew formula)
        if: ${{ env.IS_TAG == 'true' }}
        run: |
          python3 scripts/release/render-installers.py \
            --version "${GITHUB_REF_NAME#v}" --dist dist --out dist
      - name: Validate the rendered installers
        if: ${{ env.IS_TAG == 'true' }}
        run: |
          sh -n dist/day-installer.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw dist/day-installer.ps1)); "ps1 parses"'
          ruby -c dist/day.rb
      # No app packages here any more: the showcase is its own repository (daybrite/Day-Showcase)
      # and publishes its own releases, which is what the website's /showcase/ page reads. This
      # release is the day CLI: six binaries, the installers, and the Homebrew formula.
      - name: Checksums (one manifest for every release file)
        if: ${{ env.IS_TAG == 'true' }}
        working-directory: dist
        run: |
          # render-installers' CLI-only manifest is superseded by the full one.
          rm -f day-SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # Build provenance for every file attached to the release (archives, installers,
      # formula, app packages, checksums), verifiable with
      # `gh attestation verify <file> -R daybrite/day`.
      - name: Attest build provenance
        if: ${{ env.IS_TAG == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish the GitHub release
        if: ${{ env.IS_TAG == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create as a draft, attach every artifact, then un-draft, so the release is never
          # publicly visible in a half-uploaded state. view-or-create + --clobber + --draft=false
          # keep re-runs idempotent (a re-run re-uploads and re-publishes without error).
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                 --title "Day $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  # --- crates.io publish (semantic tags only) via Trusted Publishing --------------------------------
  # No API-key secret. crates.io Trusted Publishing exchanges this job's GitHub OIDC token (minted by
  # rust-lang/crates-io-auth-action) for a short-lived, publish-scoped token. The job runs in the
  # `release` GitHub environment the crates.io Trusted Publisher config is bound to, so only this
  # job, on a semantic tag, can mint that token. It publishes the four publishable crates in
  # dependency order (day-fonts, day-toolchain → day-build → day-cli; every other member is
  # publish=false); --no-verify because the `release` job's dry-run already unpacked and built
  # each package from this
  # same commit, and re-verifying mid-upload would risk failing with some crates already published.
  # `needs: [release]` orders it after the version-match check + GitHub release, and only runs if the
  # publishability dry-run passed.
  publish:
    name: publish (crates.io)
    needs: [release]
    # `!cancelled()` is required here, and its absence is why v0.1.5 and v0.2.0 never reached
    # crates.io: a job whose `if` carries no status function gets an implicit `success()`, and that
    # is false when any ancestor was skipped. `toolkit` skips itself on tags (the lean tag lane), so
    # `publish` was skipped too, even though `release` ran and succeeded on its own `!cancelled()`.
    # Overriding the propagation here means the gate has to be spelled out: publish only when
    # `release` succeeded, on a semantic tag.
    if: ${{ !cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Exchange the GitHub OIDC token for a temporary crates.io token (no stored API key).
      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --no-verify --locked

  # --- Canary: the same reusable workflow the app repositories use ------------------------------
  # day's own CI and daybrite/actions' dayapp.yml are the same pipeline written twice, and
  # this is the first half of collapsing them. It builds one target through the shared workflow,
  # with `day-source: artifact` so the CLI under test is the one this run just built rather than a
  # published release, the property day's inline jobs have and app repos previously could not get.
  #
  # The app it builds is a fresh scaffold, not Day-Showcase. What a red check here means is that
  # the shared workflow's contract with the CLI broke (that `day build` / `pack` / `launch
  # --script` stopped answering to the flags, paths, and artifact names dayapp.yml passes
  # them), and `day new app` exercises that contract as well as a real app does, without a second
  # repository to clone, a second full Showcase build beside the inline `linux` job's, or a
  # 400-step walkthrough that job already runs across eight theme/locale variants. Showcase still
  # goes through this same workflow every night in its own CI, across eight targets.
  dayapp:
    # Named for the workflow under test, because that is what a red check here means: the shared
    # pipeline broke, not this repository's build. `(canary)` says the single target is
    # an early-warning signal, not the coverage build.
    name: dayapp (canary)
    needs: [day-cli-linux]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    with:
      targets: linux-gtk
      # Under a directory whose name holds a space, so the shared workflow's build, pack, and
      # launch steps, and the tools under them, run against a project path containing one.
      project-path: Day Project Root/canary-app
      # The project is generated rather than checked out, and `setup-command` is the shared
      # workflow's hook for exactly that (a reusable workflow only checks out the caller's
      # repository). `day patch` then points the scaffold's day dependencies at this commit, so
      # the canary builds the CLI and the crates from this run against each other.
      # (Setting it also skips the pristine assertion, which is right: the project is generated
      # here, and `day patch` writes a config file into it.)
      setup-command: |
        mkdir -p "Day Project Root"
        (cd "Day Project Root" && "$DAY_BIN" new app canary-app --toolkit linux-gtk \
          --appid dev.daybrite.canary --git --no-input)
        "$DAY_BIN" --project "Day Project Root/canary-app" patch --local "$GITHUB_WORKSPACE" --check
      day-source: artifact
      artifact-prefix: canary-
      app-id: dev.daybrite.canary
      # scripts / themes / locales stay at their defaults: the scaffold ships one dayscript
      # (dayscript/demo.yaml), which `auto` runs once in the app's own theme and locale. Driving
      # the runner at all is the check; how many variants it drives is the inline job's business.
      #
      # Off for the canary: the inline linux job already runs the scaffold rebuild check for this
      # target (scripts/ci/scaffold-check.sh), and running both would double a full build for no
      # extra signal.
      validate-rebuild: false

  # --- Day-Showcase, through the shared app workflow -------------------------------------------
  # The reference app's build, walkthrough, packaging and capture legs are NOT written here any
  # more: they are the same legs every Day app gets from daybrite/actions' dayapp.yml, and keeping
  # a second copy in this repository meant every app-pipeline change had to be made twice and the
  # two drifted anyway. What this job contributes is the framework under test: the CLI comes from
  # this run's own `day-cli-*` artifacts, and `day patch --local` points the showcase's day
  # dependencies at THIS checkout, so the app is built and driven against the commit that
  # triggered the run rather than against whatever is published.
  #
  # `setup-command` is how a reusable workflow gets an app that is not the caller's own
  # repository: it clones the showcase and patches it. That marks the project generated, which
  # skips the preflight checks and the pristine assertion — both right here, since the tree is
  # fetched rather than committed and `day patch` writes a config file into it.
  #
  # What stays in this repository's own jobs: the scaffold checks (`day new` output must keep
  # building), the per-backend clippy, `day doctor`, and the toolchain each target needs. Those
  # are framework checks that happen to use an app, not app checks.
  showcase:
    name: showcase
    needs: [day-cli-macos, day-cli-linux, day-cli-windows]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    secrets: inherit
    with:
      targets: macos-appkit, ios-uikit, android-mdc, linux-gtk, linux-qt, windows-xaml, harmony-arkui, web-dom
      # This run's CLI, not a published one: `day-cli-macos`/`-linux`/`-windows` upload the
      # `day-<os>-<arch>` artifact each leg downloads.
      day-source: artifact
      project-path: showcase-src
      artifact-prefix: showcase-
      # `day rebuild` compares a pack against a second build of the same tree; the scaffold check
      # in this repository's own jobs already exercises it, and the pack matrix does not run
      # `setup-command`, so there would be no project there to rebuild.
      validate-rebuild: false
      setup-command: |
        git clone --depth 1 --branch "${{ vars.DAY_SHOWCASE_REF || 'main' }}" \
          https://github.com/daybrite/Day-Showcase.git showcase-src
        "$DAY_BIN" --project showcase-src patch --local "$GITHUB_WORKSPACE" --check
      # Spelled out rather than read from this workflow's `env`: a reusable-workflow `with:`
      # block cannot see the `env` context. These are the gallery's variant ids.
      themes: light dark
      locales: en fr ar zh-CN
      # Which dayscripts each target runs, mirroring what the inline legs ran. `auto` is not
      # usable here: the showcase ships 37 dayscripts, most of them written for one platform's
      # feature, and running the directory on every target would fail on the other 36.
      target-scripts: |
        macos-appkit: dayscript/walkthrough.yaml dayscript/windows.yaml dayscript/speech.yaml dayscript/clipboard-roundtrip.yaml dayscript/crash.yaml dayscript/crash-report.yaml
        ios-uikit: dayscript/walkthrough.yaml dayscript/speech.yaml
        android-mdc: dayscript/walkthrough.yaml dayscript/clipboard-roundtrip.yaml dayscript/speech.yaml
        web-dom: dayscript/walkthrough.yaml dayscript/speech.yaml
        linux-gtk, linux-qt, windows-xaml, harmony-arkui: dayscript/walkthrough.yaml
      # The crash pair runs ONCE rather than across the eight theme/locale variants: `crash.yaml`
      # crashes the app to leave a report and `crash-report.yaml` asserts it is there and taps
      # Clear, so a second run finds nothing — the first variant passed and the other seven failed
      # on state the first had cleared. The inline leg this replaced ran the pair exactly once,
      # without --themes/--locales; this restores that.
      scripts-once: dayscript/crash.yaml dayscript/crash-report.yaml
      # The device matrix, and the floor probes. A row with `optional=true` reports without
      # failing the run: these ask "does the app still build and run at the version it claims to
      # support?", which nothing else asks — every other leg runs the newest simulator or
      # emulator its image ships. The OS joins the capture slug automatically, so a floor row and
      # a current row on the same device keep separate artifacts and gallery columns.
      #
      # No iOS floor row, and it is not an oversight. The runner carries only the runtimes its
      # Xcode ships — iOS 27.0 here — and Apple will not sell an older one back: measured against
      # Xcode 27.0, `xcodebuild -downloadPlatform iOS -buildVersion <v>` answers "iOS <v> is not
      # available for download" for 16.4, 17.0, 17.5 AND 18.0, so there is nothing to download for
      # any version worth probing. (`-importPlatform` would take a runtime DMG, but that means
      # hosting several gigabytes of Apple's redistributable ourselves.) Xcode 27 can RUN an iOS 16
      # simulator — a laptop with the runtime left over from an older Xcode does it — so the way to
      # get this coverage is to provision the runtime onto the runner image once, not per run.
      # Until then the floor is checked by the Android row below and by hand.
      #
      # `os` tracks the runner's Xcode and nothing else: an image carries exactly the runtimes its
      # Xcode ships, so this has to move with the `xcode-NN` label above (26 → 27 when the label
      # did). `device` is matched as a prefix and needs no such care — `iPhone * Pro Max` finds
      # whatever the newest Pro Max is, and `iPad Pro 13-inch` matches the `(M5)` the image names.
      ios-devices: |
        device=iPhone * Pro Max, os=iOS 27, orientation=portrait,  slug=iphone
        device=iPad Pro 13-inch, os=iOS 27, orientation=landscape, slug=ipad
      # `pixel_5` rather than the workflow's generic `medium_phone`, for the load ceiling the
      # showcase's own CI documents: a headless runner rasterizes in software and the Web view
      # page tips a 2.59 Mpx panel over. API 24 is the showcase's `minSdk`; verified locally.
      android-devices: |
        device=pixel_5,       os=36, orientation=portrait,  slug=phone
        device=medium_tablet, os=36, orientation=landscape, slug=tablet
        device=pixel_5,       os=24, optional=true
      app-id: dev.daybrite.showcase

  # --- Framework checks lifted out of the per-target jobs ---------------------------------------
  # `toolkit` varies the backend crate (§1: the crate implementing day-spec for one native
  # toolkit), which is the axis a `--workspace` clippy cannot cover: feature unification would
  # link several backends into one binary and trip the one-backend-per-binary guard. Each leg
  # lints the app against its backend feature and scaffolds a piece/part/app for it, so the
  # compile-level checks that must run once per backend sit in one job instead of riding six
  # device-bound ones. These check the framework, not the app; inside the per-combo build jobs
  # they made every build job framework-shaped and unusable as the generic app pipeline
  # (daybrite/actions' dayapp.yml). The other framework check, the host-portable
  # test run (scripts/ci/host-test.sh), rides every arch-matching leg of the day-cli-<os>
  # jobs above, gating that OS's CLI artifacts and everything downstream of them.
  toolkit:
    name: toolkit (${{ matrix.toolkit }})
    runs-on: ${{ matrix.os }}
    needs: [day-cli-macos, day-cli-linux, day-cli-windows]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolkit: appkit, combo: macos-appkit,  os: xcode-27,    rust_target: "",                        clippy: "--all-targets" }
          - { toolkit: uikit,  combo: ios-uikit,     os: xcode-27,    rust_target: aarch64-apple-ios-sim,     clippy: "--lib" }
          - { toolkit: gtk,    combo: linux-gtk,     os: ubuntu-24.04, rust_target: "",                        clippy: "--all-targets" }
          - { toolkit: qt,     combo: linux-qt,      os: ubuntu-24.04, rust_target: "",                        clippy: "--all-targets" }
          - { toolkit: mdc,    combo: android-mdc,   os: ubuntu-24.04, rust_target: aarch64-linux-android,     clippy: "--lib" }
          - { toolkit: xaml,   combo: windows-xaml,  os: windows-2025, rust_target: "",                      clippy: "--all-targets" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - name: Toolkit deps
        if: matrix.toolkit == 'gtk' || matrix.toolkit == 'qt'
        run: |
          sudo apt-get update
          if [ "${{ matrix.toolkit }}" = gtk ]; then
            sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
          else
            sudo apt-get install -y qt6-base-dev qt6-webengine-dev
          fi
      # The android backend links through the NDK, so the cross-clippy and the scaffold build need
      # cargo-ndk, but not Gradle, which only the packaging step uses.
      - uses: taiki-e/install-action@v2
        if: matrix.toolkit == 'mdc'
        with:
          tool: cargo-ndk
      - name: Android NDK env
        if: matrix.toolkit == 'mdc'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          # bundled SQLite (day-persistence, in the showcase's non-wasm graph) compiles C, and
          # cc-rs never finds the NDK's API-suffixed clang on its own: the plain
          # `aarch64-linux-android-clang` name does not exist in modern NDKs. minSdk 24, the
          # scaffold's own floor (templates/app/platform/android/build.gradle.kts).
          NDK_BIN="$(echo "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin)"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        run: |
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
      # The app checkout the lint below and the scaffold test both need. `day patch` (inside the
      # action) points its day dependencies at this commit, so clippy lints the framework under
      # test rather than a published release.
      # `day new` + build, against this checkout (`--local`), so a template that stopped compiling
      # fails here rather than in a user's first five minutes.
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Clippy (${{ matrix.toolkit }} backend)
        # In the app's checkout, not this workspace: the showcase is its own repository now, and
        # `day patch` (in the checkout step above) points its day dependencies at this commit.
        working-directory: showcase-src
        run: |
          set -euo pipefail
          TARGET=""
          if [ -n "${{ matrix.rust_target }}" ]; then TARGET="--target ${{ matrix.rust_target }}"; fi
          # shellcheck disable=SC2086 # $TARGET is a two-token flag or empty
          cargo clippy $TARGET ${{ matrix.clippy }} \
            --no-default-features --features ${{ matrix.toolkit }}
      - name: Native AppKit link activation
        if: matrix.toolkit == 'appkit'
        run: cargo test --locked -p day-appkit --test native_links
      # The Windows implementation of this part compiles only here, so its lint rides the xaml
      # row rather than needing a Windows job of its own. (day-part-speech's C++ arm against SAPI
      # used to ride here too; it lives in its own repository now, whose CI has a Windows host leg.)
      - name: Clippy (day-part-battery — Windows impl)
        if: matrix.toolkit == 'xaml'
        run: cargo clippy --locked -p day-part-battery --all-targets
      - name: Scaffold check (${{ matrix.combo }})
        run: |
          set -euo pipefail
          DAY=$DAY_BIN
          # Under a directory whose name holds a space, so the scaffolds, cargo, and every build
          # script below (cc, bindgen, the Qt and XAML shims) run against a path containing one.
          WORK="$RUNNER_TEMP/Day Project Root"
          rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"
          TARGET=""
          LIB=""
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET="--target ${{ matrix.rust_target }}"
            LIB="--lib"   # the mobile hosts build the app as a library
          fi
          # One target directory for the four builds below: they compile the same day crates from
          # this checkout, and the piece's demo would otherwise build all of them a second time.
          export CARGO_TARGET_DIR="$WORK/scratch-target"
          "$DAY" new piece scratch-piece --toolkits ${{ matrix.toolkit }} --local "$GITHUB_WORKSPACE"
          "$DAY" new part  scratch-part  --local "$GITHUB_WORKSPACE"
          "$DAY" new app   scratch-app   --toolkit ${{ matrix.combo }} --appid com.example.scratchapp --local "$GITHUB_WORKSPACE"
          # shellcheck disable=SC2086 # $TARGET is a two-token flag or empty
          ( cd scratch-piece && cargo build --features ${{ matrix.toolkit }} $TARGET )
          # The piece's demo/ is an app, built the way scratch-app is below.
          # shellcheck disable=SC2086
          ( cd scratch-piece/demo && cargo build $LIB --no-default-features --features ${{ matrix.toolkit }} $TARGET )
          # shellcheck disable=SC2086
          ( cd scratch-part  && cargo build $TARGET )
          # `--no-default-features` is what `day build` passes for the app crate, and what an app
          # requires: the scaffold defaults to `mock` so a bare `cargo build` and rust-analyzer
          # compile with no backend flag, and day accepts exactly one backend, so adding `appkit`
          # on top of the default is two, and the `enable exactly one backend feature`
          # compile_error fires. Pieces and parts carry no default backend, so their builds above
          # take the plain additive form.
          # shellcheck disable=SC2086
          ( cd scratch-app   && cargo build $LIB --no-default-features --features ${{ matrix.toolkit }} $TARGET )
          # Structural check of the default (no --local) output: it must reference the remote git dep.
          "$DAY" new app remote-check --toolkit ${{ matrix.combo }} --no-input >/dev/null
          grep -q 'git = "https://github.com/daybrite/day.git"' remote-check/Cargo.toml

  # --- macOS desktop: appkit / qt / gtk -------------------------------------
  macos:
    name: day-${{ matrix.combo }}
    # xcode-27 is the floor for every macOS job in these repos, Apple Silicon with the newest
    # Xcode. Not only for speed: `devicectl` can drive a simulator only from the CoreDevice
    # framework Xcode 27 installs (26.6 ships one that cannot see simulators at all), which is
    # what lets a walkthrough capture in a chosen orientation.
    runs-on: xcode-27
    needs: [day-cli-macos]
    strategy:
      fail-fast: false
      # Tag pushes trim the matrix to appkit, the only leg that packs a release artifact
      # (the .dmg); the qt/gtk legs exist for walkthrough coverage, which tag runs skip.
      matrix: >-
        ${{ startsWith(github.ref, 'refs/tags/')
            && fromJSON('{"include":[{"combo":"macos-appkit","toolkit":"appkit"}]}')
            || fromJSON('{"include":[{"combo":"macos-appkit","toolkit":"appkit"},{"combo":"macos-qt","toolkit":"qt"},{"combo":"macos-gtk","toolkit":"gtk"}]}') }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # No signing secrets reach this job on any ref (§20.2). It builds arbitrary repo code
      # (cargo, every dependency's build.rs, dayscript walkthroughs), so it packs at the dev tier
      # (ad-hoc) even on tags, and the result JSON says so loudly. The Developer ID identity and
      # the notary key live in daybrite/actions' `sign-macos` job, which runs no repo code at all.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install toolkit deps
        run: |
          case "${{ matrix.toolkit }}" in
            # The full `qt` formula includes Qt WebEngine (the Qt web view). macos-gtk gets no
            # WebKitGTK: Homebrew's has no bottle and vends the GTK3 API, and WebKitGTK isn't viable
            # on macOS-quartz, so the GTK web view is Linux/Windows only (day-piece-webview).
            qt) brew install qt pkg-config ;;
            gtk) brew install gtk4 libadwaita pkg-config ;;
          esac
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, not the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold → lint → pack → `day rebuild --from-dir` → launch the rebuilt copy, per
      # combo (scripts/ci/scaffold-check.sh). The qt/gtk legs stop after the lint: `day pack`
      # supports neither combo yet.
      - name: Scaffold check (new + lint + pack + rebuild + launch)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" ${{ matrix.combo }}
  ios-uikit:
    name: day-ios-uikit
    # xcode-27: see the macos job note. It also gives the walkthrough a current iOS Simulator
    # runtime, and the devicectl that can turn it.
    runs-on: xcode-27
    needs: [day-cli-macos]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The uikit backend cross-compiles via the Xcode script phase (§17.4). The device
          # target is for tag pushes, where pack builds the .ipa when the ASC secrets are set.
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, not the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold → lint → pack → `day rebuild --from-dir` (scripts/ci/scaffold-check.sh). No
      # trial launch: the packed .ipa is a device build a runner cannot install.
      - name: Scaffold check (new + lint + pack + rebuild)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" ios-uikit
  linux:
    name: day-${{ matrix.combo }}
    # Runs on tag pushes too (pack-only mode): both legs pack a release .flatpak.
    runs-on: ubuntu-24.04
    needs: [day-cli-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { combo: linux-qt, toolkit: qt }
          - { combo: linux-gtk, toolkit: gtk }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install toolkit deps
        run: |
          sudo apt-get update
          # day-piece-webview needs Qt WebEngine (Qt) / WebKitGTK 6 (GTK) on top of the base libs.
          # fonts-noto-cjk: the runner image ships no CJK-capable font (only Noto Color Emoji +
          # the base DejaVu set, which covers Arabic but not Han), so without it the zh-CN
          # walkthrough variants render every Chinese glyph as a tofu box on both toolkits.
          case "${{ matrix.toolkit }}" in
            qt) sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-webengine-dev pkg-config fonts-noto-cjk ;;
            # dbus supplies `dbus-run-session`: GTK's file dialogs are portal-backed and a
            # runner has no session bus, so `day launch` starts a private one. Without it GTK
            # reaches the portal through a NULL GDBusConnection and segfaults on the 2nd dialog.
            gtk) sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev pkg-config xvfb imagemagick fonts-noto-cjk dbus ;;
          esac
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, not the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Before the scaffold check, whose pack stage builds both Linux formats. ubuntu-24.04
      # runners preinstall neither flatpak-builder nor linuxdeploy.
      - name: Install flatpak tooling
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      # linuxdeploy + its toolkit plugin build the .appimage (§16.5). They ship as downloaded
      # AppImages, so they go to $RUNNER_TEMP (never the workspace, which is the checkout the
      # pristine assert covers) and are named through DAY_LINUXDEPLOY* rather than PATH.
      - name: Install linuxdeploy tooling
        env:
          TOOLKIT: ${{ matrix.toolkit }}
        run: |
          set -euo pipefail
          # appimagetool needs FUSE, which a runner does not have; APPIMAGE_EXTRACT_AND_RUN is the
          # documented way round it. xvfb is for the AppImage launch check below.
          sudo apt-get install -y --no-install-recommends xvfb
          sudo apt-get install -y --no-install-recommends fuse3 libfuse2t64 || \
            sudo apt-get install -y --no-install-recommends fuse libfuse2 || true
          # dpkg-dev supplies dpkg-architecture, which the GTK plugin exits on when missing
          # ("Install dpkg-dev then re-run the plugin"). Runners normally have it via
          # build-essential; asking for it explicitly costs nothing and removes the assumption.
          sudo apt-get install -y --no-install-recommends dpkg-dev
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          # The two plugins are not distributed the same way, which is what broke this step:
          #
          #   qt   ships an AppImage on a rolling `continuous` release.
          #   gtk  has no releases at all; it is a shell script in its repository. The
          #        `continuous` download URL therefore 404s, and `curl -f` exits 22.
          #
          # linuxdeploy finds a plugin by globbing `linuxdeploy-plugin-<name>*` next to its own
          # binary and along PATH, so the `.sh` suffix is fine as long as both files land in the
          # same directory. day-cli only checks the file exists (pack/appimage.rs `tool()`), then
          # passes `--plugin <name>`; linuxdeploy does the lookup.
          case "$TOOLKIT" in
            qt)
              PLUGIN="$RUNNER_TEMP/linuxdeploy-plugin-qt"
              curl -fsSL --retry 3 -o "$PLUGIN" \
                "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
              ;;
            gtk)
              # Pinned to a commit rather than `master`: with no releases to track, an unpinned
              # branch is a third party editing this job's behavior without a pull request.
              PLUGIN="$RUNNER_TEMP/linuxdeploy-plugin-gtk.sh"
              curl -fsSL --retry 3 -o "$PLUGIN" \
                "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh"
              ;;
            *)
              echo "::error::no linuxdeploy plugin known for toolkit '$TOOLKIT'"; exit 1 ;;
          esac
          chmod +x "$RUNNER_TEMP/linuxdeploy" "$PLUGIN"
          {
            echo "DAY_LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy"
            echo "DAY_LINUXDEPLOY_PLUGIN_${TOOLKIT^^}=$PLUGIN"
            echo "APPIMAGE_EXTRACT_AND_RUN=1"
          } >> "$GITHUB_ENV"
      # Scaffold → lint → pack → `day rebuild --from-dir` → launch the rebuilt copy
      # (scripts/ci/scaffold-check.sh). No xvfb wrapper, same as the walkthrough below: the CLI
      # supplies the headless plumbing itself (both toolkits under xvfb, qt on the xcb platform,
      # falling back to offscreen only where xvfb-run is missing).
      - name: Scaffold check (new + lint + pack + rebuild + launch)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" ${{ matrix.combo }}
  android-mdc:
    name: day-android-mdc
    runs-on: ubuntu-24.04
    needs: [day-cli-linux]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No setup-java: Gradle runs on the runner's default preinstalled JDK (Day accepts 17+;
      # Gradle 9.7 supports 17…26). setup-gradle pins the Gradle version; the JDK is the runner's.
      # Keep this in step with the scaffold's gradle-wrapper.properties (the template comment
      # names this pin) so a scaffolded app and the framework agree on one Gradle.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
          add-job-summary: "never"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Set up the Android cross-compile targets
        run: |
          # x86_64 for the emulator walkthrough, aarch64 for the arm64-v8a pack.
          rustup target add x86_64-linux-android aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, not the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold → lint → pack → `day rebuild --from-dir` (scripts/ci/scaffold-check.sh). No
      # trial launch: the emulator boots later, only for the walkthrough.
      - name: Scaffold check (new + lint + pack + rebuild)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" android-mdc
  harmony-arkui:
    # Experimental (continue-on-error at the job level): the whole HarmonyOS job runs on one
    # x86_64 Linux runner so the x86_64 Oniro guest can run KVM-accelerated (same-arch guest +
    # /dev/kvm) instead of TCG software emulation; the boot + 8-variant walkthrough was ~25 min
    # under TCG on macOS. `day ohos emulator launch` auto-selects `-accel kvm` when /dev/kvm
    # exists (else TCG). The job is marked experimental so a HarmonyOS regression, or an emulator
    # that still won't boot under KVM, never blocks the release jobs that `need` it.
    #
    # (History: this ran on macos-14 because under pure TCG only fast Apple-Silicon cores booted
    # the guest reliably; ubuntu-under-TCG never rendered the first-boot keyguard. KVM removes the
    # TCG bottleneck, so x86_64 Linux should now be both far faster and reliable. If KVM turns out
    # unavailable, set `DAY_OHOS_ACCEL=tcg,thread=multi` to force software emulation.)
    name: day-harmony-arkui
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: [day-cli-linux]
    timeout-minutes: 90
    env:
      # hvigor + ohpm are not in the public SDK; they come from the OpenHarmony
      # command-line-tools. The bundle is Linux-packaged but hvigor/ohpm are pure JS, so they run
      # under the runner's node via two-line wrappers (docs/harmonyos.md), and the same cached
      # zip serves both host OSes. Release signing material ships in setup-ohos-sdk's
      # toolchains/lib.
      CLT_VERSION: "5.1.0.840"
      CLT_URL: https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Tier-2 OHOS std targets: emulator (x86_64) + device (arm64). rustup provides the std.
          targets: aarch64-unknown-linux-ohos,x86_64-unknown-linux-ohos
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        # java for sign-hap.mjs (signs the provision profile + the .hap via hap-sign-tool).
        with:
          distribution: temurin
          java-version: "21"
      # The host OpenHarmony SDK (Linux, from setup-ohos-sdk): the NDK for the Rust cross-compile,
      # hdc for the emulator, and the full component set (ets/js/toolchains/previewer) hvigor builds
      # against. 5.1.0 is API 18, matching build-profile's compile/compatibleSdkVersion. hvigor
      # spawns SDK tools (syscap_tool, restool, es2abc) directly, so they must be host-native, which
      # the Linux SDK provides natively (on the old macOS runner this had to be the darwin SDK to
      # avoid `spawn ENOEXEC`; on Linux the ELF tools run directly).
      - uses: openharmony-rs/setup-ohos-sdk@v1
        id: ohos-sdk
        with:
          version: "5.1.0"
      - name: Put the OHOS toolchains on PATH + point OHOS_NDK_HOME at the NDK
        run: |
          # setup-ohos-sdk's OHOS_NDK_HOME is the per-OS SDK root; the NDK (the llvm cross-compilers
          # day-arkui-sys's build.rs and the cargo linkers need) is its `native` component, exposed as
          # the `ohos_sdk_native` output (…/native, a sibling of …/toolchains). Pin OHOS_NDK_HOME to it.
          NATIVE="${{ steps.ohos-sdk.outputs.ohos_sdk_native }}"
          echo "$(dirname "$NATIVE")/toolchains" >> "$GITHUB_PATH"
          echo "OHOS_NDK_HOME=$NATIVE" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_OHOS_LINKER=$NATIVE/llvm/bin/x86_64-unknown-linux-ohos-clang" >> "$GITHUB_ENV"
          # cc-rs never finds the NDK's wrapper clang on its own (not on PATH; scripts/ci/lint.sh
          # derives the same trio); bundled SQLite (day-persistence) compiles C in the arkui
          # clippy graph.
          echo "CC_aarch64_unknown_linux_ohos=$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_ohos=$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_ohos=$NATIVE/llvm/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Cache the OpenHarmony command-line-tools (hvigor / ohpm)
        uses: actions/cache@v6
        with:
          path: ~/ohos-clt
          key: ohos-clt-${{ env.CLT_VERSION }}
      - name: Install hvigor/ohpm from the (Linux) command-line-tools via node wrappers
        run: |
          set -euo pipefail
          C="$HOME/ohos-clt/command-line-tools"
          if [ ! -f "$C/hvigor/bin/hvigorw.js" ]; then
            mkdir -p ~/ohos-clt && cd ~/ohos-clt
            curl -fSL -o clt.zip "$CLT_URL"
            unzip -q -o clt.zip && rm -f clt.zip
          fi
          # hvigor/ohpm are pure JS; run them with the runner's node (docs/harmonyos.md),
          # which stays identical to the local macOS dev recipe and is host-OS-agnostic.
          mkdir -p "$HOME/ohos-bin"
          printf '#!/usr/bin/env bash\nexec node "%s/hvigor/bin/hvigorw.js" "$@"\n' "$C" > "$HOME/ohos-bin/hvigorw"
          printf '#!/usr/bin/env bash\nexec node "%s/ohpm/bin/pm-cli.js" "$@"\n' "$C" > "$HOME/ohos-bin/ohpm"
          chmod +x "$HOME/ohos-bin/hvigorw" "$HOME/ohos-bin/ohpm"
          echo "$HOME/ohos-bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=$C/sdk" >> "$GITHUB_ENV"
      - name: Assemble a versioned OpenHarmony SDK for hvigor (OHOS_BASE_SDK_HOME)
        run: |
          set -euo pipefail
          # hvigor's OpenHarmony mode (runtimeOS: "OpenHarmony") reads OHOS_BASE_SDK_HOME and
          # requires the new versioned layout (<base>/<api>/{ets,native,toolchains,…}). Build a
          # versioned view over the host API-18 SDK from setup-ohos-sdk. Mirrors the validated
          # local setup (docs/harmonyos.md).
          OH="$(dirname "${{ steps.ohos-sdk.outputs.ohos_sdk_native }}")"
          BASE="$HOME/ohos-ohsdk"
          mkdir -p "$BASE"
          ln -sfn "$OH" "$BASE/18"
          echo "OHOS_BASE_SDK_HOME=$BASE" >> "$GITHUB_ENV"
      # The one framework check still living in a target job: the arkui cross-clippy needs the whole
      # OpenHarmony SDK, already set up above. Lifting it into `toolkit` would mean a second copy of
      # six setup steps; it belongs in a composite action, not in a duplicate.
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, not the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold → lint → pack → `day rebuild --from-dir` (scripts/ci/scaffold-check.sh). No
      # trial launch: the Oniro emulator boots later, only for the walkthrough.
      - name: Scaffold check (new + lint + pack + rebuild)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" harmony-arkui
      # The backend cross-check below lints this crate as the APP's dependency graph resolves it
      # (every piece and part the showcase pulls in), which is a framework check that happens to
      # need an app on disk. The showcase's build, walkthrough and packaging legs live in the
      # `showcase` job, which drives the shared app workflow.
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Clippy (arkui backend, cross-check)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        # `--lib` like the iOS/Android cross-checks: a mobile/embedded backend has no `day::launch`
        # (that's desktop-only), so the app is a cdylib; the desktop `src/main.rs` bin isn't built.
        # `-A missing_const_for_thread_local`: clippy 1.97 false-positives it on this cross-target
        # (flags `thread_local!`s already using `const { … }`); the host clippy job enforces it.
        working-directory: showcase-src
        run: cargo clippy --target aarch64-unknown-linux-ohos --lib --no-default-features --features arkui -- -D warnings -A clippy::missing_const_for_thread_local
  windows-xaml:
    name: day-windows-xaml
    runs-on: windows-2025
    needs: [day-cli-windows]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, not the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Before the scaffold check, whose pack stage builds the NSIS -setup.exe too.
      # windows-2025 runners don't preinstall NSIS.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # `choco` edits the machine PATH, which does not reach later steps: Actions hands every
          # step the environment captured when the job started. So locate makensis.exe now and hand
          # it to `day pack` explicitly. Doing it here also fails in seconds if the package moved,
          # instead of after the six-minute release build that packs the installer.
          $roots = @("$env:ProgramFiles\NSIS", "${env:ProgramFiles(x86)}\NSIS", "$env:ChocolateyInstall\bin", "$env:ChocolateyInstall\lib\nsis") | Where-Object { $_ -and (Test-Path $_) }
          $exe = Get-ChildItem -Path $roots -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "makensis.exe not found after 'choco install nsis' (looked in: $($roots -join '; '))" }
          "DAY_MAKENSIS=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "makensis: $($exe.FullName)"
      # Scaffold → lint → pack → `day rebuild --from-dir` → launch the rebuilt copy
      # (scripts/ci/scaffold-check.sh).
      - name: Scaffold check (new + lint + pack + rebuild + launch)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" windows-xaml
  windows-msys2:
    name: day-${{ matrix.combo }}
    if: ${{ !startsWith(github.ref, 'refs/tags/') }} # experimental + packs no release artifact; skip on tags
    runs-on: windows-2025
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # mingw-w64-x86_64-gcc provides the mingw gcc/g++ the pin step below points the linker
          # (and the cc crate) at; the runner has no MSYS2 mingw compiler otherwise, only the libs.
          # Neither web view has an MSYS2/MINGW64 package: no Qt6 WebEngine and no WebKitGTK 6 (both
          # embed a browser engine, Chromium or WebKit, that won't build with MinGW GCC). So
          # day-piece-webview degrades on both: the Qt view to a URL label (build.rs probes pkg-config
          # for Qt6WebEngineWidgets), the GTK view to day's placeholder leaf (webkit6 is gated off
          # Windows in Cargo.toml, exactly like macOS).
          - combo: windows-qt
            toolkit: qt
            msys_pkgs: mingw-w64-x86_64-gcc mingw-w64-x86_64-qt6-base mingw-w64-x86_64-pkgconf
          - combo: windows-gtk
            toolkit: gtk
            msys_pkgs: mingw-w64-x86_64-gcc mingw-w64-x86_64-gtk4 mingw-w64-x86_64-libadwaita mingw-w64-x86_64-pkgconf
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set up MSYS2 (qt/gtk)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: ${{ matrix.msys_pkgs }}
      # rustup's windows-gnu toolchain links via whatever `x86_64-w64-mingw32-gcc` is first on
      # PATH; on the runner that resolves to a different mingw (C:\mingw64) which lacks the
      # MSYS2 Qt6/GTK4/glib import libs, so `-lQt6Widgets` / `-lglib-2.0` fail to link. Force
      # MSYS2's mingw to the front of PATH and pin the linker + the `cc` crate's compiler (for the
      # C++ shims) to MSYS2's gcc, so /mingw64/lib is searched. Forward-slash paths link cleanly.
      - name: Pin the MSYS2 mingw toolchain (finds MSYS2 Qt6/GTK4 libs)
        run: |
          cygpath -w "$MINGW_PREFIX/bin" >> "$GITHUB_PATH"
          GCC="$(cygpath -m "$MINGW_PREFIX/bin/gcc.exe")"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$GCC" >> "$GITHUB_ENV"
          echo "CC=$GCC" >> "$GITHUB_ENV"
          echo "CXX=$(cygpath -m "$MINGW_PREFIX/bin/g++.exe")" >> "$GITHUB_ENV"
      # Kept here rather than lifted into `test`: this runs under MSYS2's mingw toolchain, so it
      # covers windows-gnu, which the msvc row of `test` does not.
      - name: Test host-portable crates
        run: scripts/ci/host-test.sh
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build at MSRV
        run: cargo build --locked

  # ---------------------------------------------------------------------------
  # deny: dependency advisories + duplicate-version bans (§20.5). Runs as its own
  # check; the build combos gate on [fmt, msrv] only: clippy and deny are
  # independent required checks, so a lint error or a newly published RUSTSEC
  # advisory shouldn't suppress the platform matrix's build/test signal. Add
  # either to each combo's `needs:` to make it a hard gate.
  # ---------------------------------------------------------------------------
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans

  # ---------------------------------------------------------------------------
  # api-docs: generate the Rust API reference (rustdoc) for the public-facing Day crates. This is the
  # does-rustdoc-still-build check on every change to the crates: a broken doc link or an intra-doc
  # path that stopped resolving fails here, on the change that caused it. The published bundle is
  # built again by website.yml, which is the workflow that deploys (Pages takes one artifact), and
  # that workflow does not run on a crates-only change. The build is portable (the core crates need
  # no features and the `day` umbrella uses its headless `mock` backend), so no native toolkit is
  # installed and it runs on a stock runner. Crate list + `cargo doc` invocations live in
  # scripts/build-api-docs.sh, driven by website/src/data/api-crates.json (the same file /docs/api
  # reads).
  # ---------------------------------------------------------------------------
  api-docs:
    name: rustdoc
    if: ${{ !startsWith(github.ref, 'refs/tags/') }} # a validation leg; the tag lane skips it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate rustdoc for the public crates
        run: scripts/build-api-docs.sh

  # ---------------------------------------------------------------------------
  # web-dom: build the showcase for the web-dom backend (docs/web.md), a wasm32 cdylib plus
  # the day-dom host page, assembled by `day build` into a fully static dist/. The dist is built
  # here as the wasm build test and to drive the walkthrough, but it is not published: the app
  # deploys its web build to showcase.daybrite.dev/webapp from its own repository, and this
  # site links there. Then the same walkthrough script the
  # native combos run drives the page in headless Chromium (day-cli's bundled page-driver,
  # `day web driver`, is the DAY_WEB_DRIVER browser; the dayscript engine runs in the wasm over the launch server's
  # WebSocket bridge) and uploads gallery screenshots like every other combo. Chromium, not
  # WebKit, because Playwright's Linux WebKit (the WPE port) ships no OPFS and day-part-fs is
  # OPFS-only (docs/fs.md); the sensors step below stays on WebKit, which it works fine on.
  # ---------------------------------------------------------------------------
  web-dom:
    name: day-web-dom
    if: ${{ !startsWith(github.ref, 'refs/tags/') }} # a walkthrough leg; the tag lane skips it
    needs: [day-cli-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Clipboard promise ordering regression
        run: node --test scripts/ci/webdom-clipboard-test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Reuse the day CLI day-cli-linux already built (like every other combo) instead of a from-source
      # `cargo run -p day-cli`. The wasm32 toolchain above is still required: `day build` shells out
      # to `cargo rustc --target wasm32-unknown-unknown` on this runner to compile the app.
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day); take its absolute path so every step
          # can invoke it as $DAY_BIN regardless of working directory. On Windows $RUNNER_TEMP is a
          # DOS path; cygpath turns it into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold + lint (scripts/ci/scaffold-check.sh). `day pack` does not support web-dom yet,
      # so the script stops after the lint for this combo.
      - name: Scaffold check (new + lint + pack + rebuild)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" web-dom
      # The backend cross-check below lints this crate as the APP's dependency graph resolves it
      # (every piece and part the showcase pulls in), which is a framework check that happens to
      # need an app on disk. The showcase's build, walkthrough and packaging legs live in the
      # `showcase` job, which drives the shared app workflow.
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Clippy (dom backend)
        # `--lib` like the other non-desktop backends: wasm has no `day::launch` (desktop-only), so
        # `src/main.rs` is not part of this build. The cargo feature is `dom`; `web-dom` is the
        # platform name `day build` takes (Cargo.toml [features], §9). The getrandom_backend cfg
        # mirrors what `day build` sets for every web app (crates/day-cli/web.rs): day-dom carries
        # getrandom's custom-backend hook, and getrandom refuses to compile for raw wasm until a
        # backend is chosen.
        working-directory: showcase-src
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="custom"
        run: cargo clippy --target wasm32-unknown-unknown --lib --no-default-features --features dom
