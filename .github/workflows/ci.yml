# CI (DESIGN.md §20.1) — per-OS jobs, patterns lifted from pane's per-OS matrix and hop's
# screenshot pipeline. Banked toolchain knowledge encoded here from day one: the Gradle/AGP
# builds use the runner's DEFAULT preinstalled JDK (Day accepts 17+; Gradle 9.6 runs on 17…26 —
# the old "pin 21, never newer" rule was an AGP-8-era jdk-image-transform quirk that no longer
# holds), rustup toolchains for cross-std, GSK_RENDERER=cairo for headless GTK (set by `day
# launch` itself), `--locked` everywhere, emulator boot handled by the runner action's polling.
name: ci

on:
  push:
    branches: [main]
    # Semantic-release tags run a lean release lane: fmt/msrv → the 3×2 day-CLI release
    # builds → the per-combo jobs in PACK-ONLY mode (tests, walkthroughs, and emulators are
    # skipped — the tagged commit was already validated on main; the packaging steps run
    # release-signed when the DAY_* secrets are set) → the `release` job, which publishes the GitHub
    # release (CLI binaries, installers, app packages, attestations) → the `publish` job, which uploads
    # the crates to crates.io via Trusted Publishing (OIDC — no API-key secret). The `release` job also
    # runs on every push/PR — there it only verifies publishability with `cargo publish --dry-run`.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
    inputs:
      day-verbose:
        description: >-
          Run the day CLI verbose (DAY_VERBOSE=1): every `day build`/`launch`/`pack` forwards
          its sub-commands' raw output — the cargo/gradle/xcodebuild/hvigor command lines and
          logs. On by default; un-check to get the quiet status-line output back.
        type: boolean
        default: true

permissions:
  contents: read

#concurrency:
#  group: ci-${{ github.ref }}
#  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: full
  # Verbose day CLI (docs/environment.md): every `day build`/`launch`/`pack` of the showcase
  # and the scaffold canaries forwards the underlying cargo/gradle/xcodebuild/hvigor commands
  # and their raw logs. Builds of day-cli itself go through cargo directly and stay as they
  # are. Default on; a manual dispatch can un-check the day-verbose input to run quiet.
  DAY_VERBOSE: ${{ github.event_name == 'workflow_dispatch' && inputs.day-verbose == false && '0' || '1' }}
  # The macOS runner images ship with third-party taps (aws/tap) that Homebrew's tap-trust
  # check warns about on every `brew install`. Runners are ephemeral, so trust checks buy
  # nothing here; this silences the warning in every job. NOTE the flag is deprecated
  # upstream ("will be removed in a later release") — when it stops working, replace it
  # with a `brew untap aws/tap` step next to the brew installs.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  # The walkthrough capture matrix — themes × locales, space-separated (the shell word-splits
  # them). ONE place to grow: every screenshot leg (macOS, iOS, Linux, Android, HarmonyOS,
  # Windows, web-dom) loops over these; the gallery variant ids in website/gallery.config.mjs
  # (`<theme>` / `<theme>-<locale>`) must list any addition too.
  WALKTHROUGH_THEMES: light dark
  WALKTHROUGH_LOCALES: en fr ar zh-CN
  # Which ref of daybrite/Day-Showcase every job builds (.github/actions/showcase). Resolved here
  # because a composite action cannot read the `vars` context; unset is the normal case and means
  # `main`. Set the repository variable to point a whole run at an app branch.
  DAY_SHOWCASE_REF: ${{ vars.DAY_SHOWCASE_REF }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (host-portable crates, CLI, mock backend)
        run: |
          cargo clippy --locked --all-targets
          # day-lite is named explicitly because it is a workspace member but NOT a
          # default-member (its oxc tree is heavy enough to keep out of every bare `cargo
          # check`), so the line above never compiles it. Without this it is a crate no CI job
          # builds — which is how a dependabot bump that split the oxc family across two minor
          # versions sat on main for four days, breaking only `--workspace` builds.
          cargo clippy --locked -p day-cli -p day-script -p day-lite --all-targets

  # Spelling + the American-English rule (STYLE_GUIDE.md), enforced by `typos` over the whole
  # tree — prose, doc comments, and code comments alike. It is a spelling gate and a dialect gate
  # at once: typos.toml sets `locale = "en-us"`, which is what makes a British variant a finding
  # rather than a matter of taste. The mixed state this replaced had 355 of them, and the reason
  # was drift rather than disagreement — nobody decides a dialect one comment at a time.
  #
  # Every exception is a named entry in typos.toml with a reason beside it, so the allow-list
  # reads as decisions rather than as noise someone silenced. Run `typos` locally to reproduce
  # this job exactly; `typos --write-changes` applies what it can fix on its own.
  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned rather than floating on @master: the dictionary ships inside the action, so an
      # unpinned bump turns this job red on a commit that changed nothing. Keep it in step with
      # whatever `typos --version` reports locally, or the two disagree about what a word is.
      - uses: crate-ci/typos@v1.49.0

  duty-matrix-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Toolkit-duty conformance table (docs/duty-matrix.md) is generated; a Toolkit-trait
      # or backend change that forgets to regenerate it is drift, and drift is a red build.
      - name: Duty-matrix drift check
        run: |
          scripts/ci/duty-matrix.sh
          git diff --exit-code docs/duty-matrix.md
      # docs/coverage-matrix.md is the same contract for the piece VOCABULARY: which kinds each
      # backend realizes, which piece ships which arm, and what every Cap answers. Adding a
      # renderer without regenerating it is drift; the walkthrough's assert_no_placeholders
      # allow-lists are the runtime half of the same fact.
      - name: Coverage-matrix drift check
        run: |
          scripts/ci/coverage-matrix.sh
          git diff --exit-code docs/coverage-matrix.md
      # docs/recorder-matrix.md is the same contract for the dayscript RECORDER: what it writes for
      # every Event an app can receive. `event_to_step` ends in a catch-all, so an unmapped event
      # is silent — a control that replays but never records — and this puts every new variant in a
      # diff as "dropped", where someone has to agree with it (§14.6).
      - name: Recorder-matrix drift check
        run: |
          scripts/ci/recorder-matrix.sh
          git diff --exit-code docs/recorder-matrix.md

  # ===========================================================================
  # Per-combo build+test+walkthrough jobs — one job per <platform>-<toolkit>.
  # Each: installs the toolkit's deps, tests the host-portable crates, builds and
  # launches the showcase for the combo, drives the dayscript walkthrough, and
  # uploads that combo's screenshots (screenshots-<combo>). Gated on the fast
  # checks (fmt/msrv). Per-combo clippy runs inside the build jobs: each combo
  # lints its own backend feature (a `--workspace` clippy cannot compile — feature
  # unification would enable several `day` backends at once and trip the
  # one-backend-per-binary compile_error! guard, §3); the toolkit-independent
  # lints run in the first-pass `clippy` job.
  # ===========================================================================

  # --- day CLI: cross-compiled release builds, shared as artifacts ----------
  # Runs right after the fast checks (fmt/msrv). SIX parallel jobs — one per (OS, arch) — because
  # this is the first phase everything else waits on, and one runner per architecture halves its
  # wall-clock against building both in sequence on one runner. Each leg builds a single target
  # (the non-native one cross-compiled) and uploads it as `day-<os>-<arch>` (e.g. day-macos-x86_64,
  # day-linux-aarch64). Three job IDs with a two-arch matrix each, so the `needs:` below still name
  # day-cli-macos / -linux / -windows and wait on both of that OS's legs.
  #
  # `fail-fast: false`: a broken cross-link on one architecture should not cancel the other, whose
  # binary the per-platform jobs are waiting on.
  #
  # scripts/ci/scaffold-check.sh no longer runs here: it moved into the per-platform jobs below,
  # where each combo scaffolds, lints, packs, and rebuilds (`day rebuild --from-dir`) a fresh
  # 21-locale project — and the desktop combos drive the rebuilt copy's demo dayscript too.
  #
  # The host-portable `cargo test` rides the NATIVE-arch leg of each job (one run per OS — the
  # same count the standalone `test (<os>)` jobs had, minus three runners' worth of checkout,
  # toolchain, and queueing). It runs BEFORE the release build, so a red test fails the leg —
  # and skips every job downstream of its artifact — without paying for the build first. The
  # tag lane skips the test step (the tagged commit was already validated on main); the cross
  # legs never run it (same OS, nothing new to learn).
  day-cli-macos:
    name: day-cli-macos (${{ matrix.arch }})
    needs: [fmt, msrv]
    runs-on: macos-latest # Apple silicon: aarch64 is the host arch, x86_64 the cross build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, target: aarch64-apple-darwin }
          - { arch: x86_64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (host-portable crates)
        if: ${{ matrix.arch == 'aarch64' && !startsWith(github.ref, 'refs/tags/') }}
        run: cargo test --locked
      - name: Build the day CLI (release, ${{ matrix.target }})
        run: cargo build --locked --release -p day-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: day-macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/day
          if-no-files-found: error

  day-cli-linux:
    name: day-cli-linux (${{ matrix.arch }})
    needs: [fmt, msrv]
    runs-on: ubuntu-latest # x86_64 host; aarch64 is the cross build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { arch: aarch64, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (host-portable crates)
        if: ${{ matrix.arch == 'x86_64' && !startsWith(github.ref, 'refs/tags/') }}
        run: cargo test --locked
      # Cross to aarch64 needs a cross-linker (+ C cross-compiler for any build-script C) AND the
      # aarch64 libc dev files — gcc-aarch64-linux-gnu ships the compiler/linker but NOT the target
      # CRT startup objects (Scrt1.o/crti.o/crtn.o) + libc that the final link needs; those live in
      # libc6-dev-arm64-cross. x86_64 is native to the ubuntu runner and skips all of it.
      - name: Install the aarch64 cross-toolchain
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - name: Build the day CLI (release, ${{ matrix.target }})
        run: cargo build --locked --release -p day-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: day-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/day
          if-no-files-found: error

  day-cli-windows:
    name: day-cli-windows (${{ matrix.arch }})
    needs: [fmt, msrv]
    runs-on: windows-latest # x86_64 host; aarch64 is the cross build (MSVC ships the cross linker)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-pc-windows-msvc }
          - { arch: aarch64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (host-portable crates)
        if: ${{ matrix.arch == 'x86_64' && !startsWith(github.ref, 'refs/tags/') }}
        run: cargo test --locked
      - name: Build the day CLI (release, ${{ matrix.target }})
        run: cargo build --locked --release -p day-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: day-windows-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/day.exe
          if-no-files-found: error

  # --- Release: verify publishability always; publish the GitHub release on a semantic tag ---------
  # Runs on EVERY push / PR / tag. It ALWAYS runs `cargo publish --workspace --dry-run` to prove the
  # whole workspace could be published (versions, MPL-2.0 license, metadata, packaging). On a
  # semantic-release tag (`vX.Y.Z`) it additionally: checks the tag matches the workspace version;
  # downloads the six day-<os>-<arch> CLI binaries from the 3×2 release builds; repackages them as
  # target-triple archives; renders installer scripts + Homebrew formula from scripts/release/templates
  # (cargo-dist style: version/URLs/sizes/checksums baked in); pulls in the per-combo app packages
  # (release-signed on tags when the DAY_* secrets are set, dev-signed otherwise); writes one
  # SHA256SUMS; attests build provenance for every file; and attaches the lot to a published GitHub
  # release. The actual crates.io upload is the separate `publish` job (Trusted Publishing).
  # `!cancelled()`: the dry-run is independent of the matrix, so a flaky leg still lets the gate report.
  #
  # The dry-run VERIFIES (it does not pass `--no-verify`): cargo unpacks each .crate and builds it,
  # which is the only check that catches a package that is not self-contained. `include_str!` reaching
  # outside its package compiles in-tree and fails for every `cargo install day-cli` user — that
  # shipped in 0.0.15 (the web-dom host trio). Verification is cheap here because all four publishable
  # crates (day-build, day-cli, day-fonts, day-toolchain) are host-only tooling; the per-platform
  # toolkit crates that can't share a runner are all publish=false and are never packaged.
  release:
    name: release
    if: ${{ !cancelled() }}
    needs: [toolkit, day-cli-macos, day-cli-linux, day-cli-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # A semantic-release tag (`vX.Y.Z…`) vs any other ref — the step-level `if:`s gate the tag-only
      # GitHub-release steps; the dry-run below runs on every ref.
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publishability gate — verify the workspace could publish on every push/PR/tag (a green gate on
      # the tagged commit precedes the real upload in the `publish` job).
      - name: Verify publishability (cargo publish --workspace --dry-run)
        run: cargo publish --workspace --dry-run --locked

      # --- GitHub release (semantic tags only) ---
      - name: Check the tag matches the workspace version
        if: ${{ env.IS_TAG == 'true' }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match [workspace.package] version $crate — bump Cargo.toml before tagging"
            exit 1
          fi
      - name: Download the day CLI artifacts (all six os/arch builds)
        if: ${{ env.IS_TAG == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: day-*
          path: cli-artifacts
      - name: Package target-triple archives
        if: ${{ env.IS_TAG == 'true' }}
        run: bash scripts/release/package-cli.sh cli-artifacts dist
      - name: Render installers (shell + PowerShell + Homebrew formula)
        if: ${{ env.IS_TAG == 'true' }}
        run: |
          python3 scripts/release/render-installers.py \
            --version "${GITHUB_REF_NAME#v}" --dist dist --out dist
      - name: Validate the rendered installers
        if: ${{ env.IS_TAG == 'true' }}
        run: |
          sh -n dist/day-installer.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw dist/day-installer.ps1)); "ps1 parses"'
          ruby -c dist/day.rb
      # No app packages here any more: the showcase is its own repository (daybrite/Day-Showcase)
      # and publishes its own releases, which is what the website's /showcase/ page reads. This
      # release is the day CLI — six binaries, the installers, and the Homebrew formula.
      - name: Checksums (one manifest for every release file)
        if: ${{ env.IS_TAG == 'true' }}
        working-directory: dist
        run: |
          # render-installers' CLI-only manifest is superseded by the full one.
          rm -f day-SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # Build provenance for EVERY file attached to the release (archives, installers,
      # formula, app packages, checksums) — verifiable with
      # `gh attestation verify <file> -R daybrite/day`.
      - name: Attest build provenance
        if: ${{ env.IS_TAG == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish the GitHub release
        if: ${{ env.IS_TAG == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create as a draft, attach every artifact, THEN un-draft — so the release is never
          # publicly visible in a half-uploaded state. view-or-create + --clobber + --draft=false
          # keep re-runs idempotent (a re-run re-uploads and re-publishes without error).
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                 --title "Day $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  # --- crates.io publish (semantic tags only) via Trusted Publishing --------------------------------
  # No API-key secret. crates.io Trusted Publishing exchanges this job's GitHub OIDC token (minted by
  # rust-lang/crates-io-auth-action) for a short-lived, publish-scoped token. The job runs in the
  # `release` GitHub environment the crates.io Trusted Publisher config is bound to, so only this job —
  # on a semantic tag — can mint that token. It publishes the four publishable crates in dependency
  # order (day-fonts, day-toolchain → day-build → day-cli; every other member is publish=false);
  # --no-verify because the `release` job's dry-run already unpacked and BUILT each package from this
  # same commit, and re-verifying mid-upload would risk failing with some crates already published.
  # `needs: [release]` orders it after the version-match check + GitHub release, and only runs if the
  # publishability dry-run passed.
  publish:
    name: publish (crates.io)
    needs: [release]
    # `!cancelled()` is load-bearing, and the reason v0.1.5 and v0.2.0 never reached crates.io: a
    # job whose `if` carries no status function gets an implicit `success()`, and that is false when
    # ANY ancestor was skipped — `toolkit` skips itself on tags (the lean tag lane), so `publish`
    # was skipped too, even though `release` ran and succeeded on its own `!cancelled()`. Overriding
    # the propagation here means the real gate has to be spelled out: publish only when `release`
    # actually succeeded, on a semantic tag.
    if: ${{ !cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Exchange the GitHub OIDC token for a temporary crates.io token (no stored API key).
      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --no-verify --locked

  # --- Canary: the SAME reusable workflow the app repositories use ------------------------------
  # day's own CI and daybrite/actions' build-day-app.yml are the same pipeline written twice, and
  # this is the first half of collapsing them. It builds ONE target through the shared workflow,
  # with `day-source: artifact` so the CLI under test is the one this run just built rather than a
  # published release — the property day's inline jobs have and app repos previously could not get.
  #
  # The app it builds is a FRESH SCAFFOLD, not Day-Showcase. What a red check here means is that
  # the shared workflow's contract with the CLI broke — that `day build` / `pack` / `launch
  # --script` stopped answering to the flags, paths, and artifact names build-day-app.yml passes
  # them — and `day new app` exercises that contract as well as a real app does, without a second
  # repository to clone, a second full Showcase build beside the inline `linux` job's, or a
  # 400-step walkthrough that job already runs across eight theme/locale variants. Showcase still
  # goes through this same workflow every night in its own CI, across eight targets.
  build-day-app:
    # Named for the workflow under test, because that is what a red check here means: the shared
    # pipeline broke, not this repository's own build. `(canary)` says the single target is
    # deliberate — it is an early-warning signal, not the coverage build.
    name: build-day-app (canary)
    needs: [day-cli-linux]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    uses: daybrite/actions/.github/workflows/build-day-app.yml@main
    with:
      targets: linux-gtk
      project-path: canary-app
      # The project is generated rather than checked out, and `setup-command` is the shared
      # workflow's hook for exactly that (a reusable workflow only checks out the caller's
      # repository). `day patch` then points the scaffold's day dependencies at THIS commit, so
      # the canary builds the CLI and the crates from this run against each other.
      # (Setting it also skips the pristine assertion, which is right: the project is generated
      # here, and `day patch` writes a config file into it.)
      setup-command: |
        "$DAY_BIN" new app canary-app --toolkit linux-gtk \
          --appid dev.daybrite.canary --git --no-input
        "$DAY_BIN" --project canary-app patch --local "$GITHUB_WORKSPACE" --check
      day-source: artifact
      artifact-prefix: canary-
      app-id: dev.daybrite.canary
      # scripts / themes / locales stay at their defaults: the scaffold ships one dayscript
      # (dayscript/demo.yaml), which `auto` runs once in the app's own theme and locale. Driving
      # the runner at all is the check; how many variants it drives is the inline job's business.
      #
      # Off for the canary: the inline linux job already runs the scaffold rebuild check for this
      # target (scripts/ci/scaffold-check.sh), and running both would double a full build for no
      # extra signal.
      validate-rebuild: false

  # --- Framework checks lifted out of the per-target jobs ---------------------------------------
  # `toolkit` varies the BACKEND CRATE (§1: the crate implementing day-spec for one native
  # toolkit), which is the axis a `--workspace` clippy cannot cover — feature unification would
  # link several backends into one binary and trip the one-backend-per-binary guard. Each leg
  # lints the app against its backend feature and scaffolds a piece/part/app for it, so the
  # compile-level checks that must run once per backend sit in one job instead of riding six
  # device-bound ones. These check the FRAMEWORK, not the app — inside the per-combo build jobs
  # they made every build job framework-shaped and unusable as the generic app pipeline
  # (daybrite/actions' build-day-app.yml). The OTHER framework check, the host-portable
  # `cargo test`, rides the native-arch leg of each day-cli-<os> job above: one run per
  # operating system, gating that OS's CLI artifact and everything downstream of it.
  toolkit:
    name: toolkit (${{ matrix.toolkit }})
    runs-on: ${{ matrix.os }}
    needs: [day-cli-macos, day-cli-linux, day-cli-windows]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolkit: appkit, combo: macos-appkit,  os: macos-26,     rust_target: "",                        clippy: "--all-targets" }
          - { toolkit: uikit,  combo: ios-uikit,     os: macos-26,     rust_target: aarch64-apple-ios-sim,     clippy: "--lib" }
          - { toolkit: gtk,    combo: linux-gtk,     os: ubuntu-24.04, rust_target: "",                        clippy: "--all-targets" }
          - { toolkit: qt,     combo: linux-qt,      os: ubuntu-24.04, rust_target: "",                        clippy: "--all-targets" }
          - { toolkit: mdc,    combo: android-mdc,   os: ubuntu-24.04, rust_target: aarch64-linux-android,     clippy: "--lib" }
          - { toolkit: xaml,   combo: windows-xaml,  os: windows-latest, rust_target: "",                      clippy: "--all-targets" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - name: Toolkit deps
        if: matrix.toolkit == 'gtk' || matrix.toolkit == 'qt'
        run: |
          sudo apt-get update
          if [ "${{ matrix.toolkit }}" = gtk ]; then
            sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
          else
            sudo apt-get install -y qt6-base-dev qt6-webengine-dev
          fi
      # The android backend links through the NDK, so the cross-clippy and the scaffold build need
      # cargo-ndk — but not Gradle, which only the packaging step uses.
      - uses: taiki-e/install-action@v2
        if: matrix.toolkit == 'mdc'
        with:
          tool: cargo-ndk
      - name: Android NDK env
        if: matrix.toolkit == 'mdc'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          # bundled SQLite (day-persistence, in the showcase's non-wasm graph) compiles C, and
          # cc-rs never finds the NDK's API-suffixed clang on its own — the plain
          # `aarch64-linux-android-clang` name does not exist in modern NDKs. minSdk 24, the
          # scaffold's own floor (templates/app/platform/android/build.gradle.kts).
          NDK_BIN="$(echo "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin)"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        run: |
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
      # The app checkout the lint below and the scaffold test both need. `day patch` (inside the
      # action) points its day dependencies at THIS commit, so clippy lints the framework under
      # test rather than a published release.
      # `day new` + build, against THIS checkout (`--local`), so a template that stopped compiling
      # fails here rather than in a user's first five minutes.
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Clippy (${{ matrix.toolkit }} backend)
        # In the app's checkout, not this workspace: the showcase is its own repository now, and
        # `day patch` (in the checkout step above) points its day dependencies at this commit.
        working-directory: showcase-src
        run: |
          set -euo pipefail
          TARGET=""
          if [ -n "${{ matrix.rust_target }}" ]; then TARGET="--target ${{ matrix.rust_target }}"; fi
          # shellcheck disable=SC2086 # TARGET is an intentional two-token flag or empty
          cargo clippy $TARGET ${{ matrix.clippy }} \
            --no-default-features --features ${{ matrix.toolkit }}
      # The Windows implementations of these parts compile only here, so their lint rides the xaml
      # row rather than needing a Windows job of its own. day-part-speech's arm is C++ against SAPI
      # (docs/bridge.md), which means this leg is also where that translation unit is first built.
      - name: Clippy (day-part-battery, day-part-speech — Windows impls)
        if: matrix.toolkit == 'xaml'
        run: cargo clippy --locked -p day-part-battery -p day-part-speech --all-targets
      - name: Scaffold check (${{ matrix.combo }})
        run: |
          set -euo pipefail
          DAY=$DAY_BIN
          cd "$RUNNER_TEMP" && rm -rf scratch-piece scratch-part scratch-app remote-check
          TARGET=""
          LIB=""
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET="--target ${{ matrix.rust_target }}"
            LIB="--lib"   # the mobile hosts build the app as a library
          fi
          "$DAY" new piece scratch-piece --toolkits ${{ matrix.toolkit }} --local "$GITHUB_WORKSPACE"
          "$DAY" new part  scratch-part  --local "$GITHUB_WORKSPACE"
          "$DAY" new app   scratch-app   --toolkit ${{ matrix.combo }} --appid com.example.scratchapp --local "$GITHUB_WORKSPACE"
          # shellcheck disable=SC2086 # TARGET is an intentional two-token flag or empty
          ( cd scratch-piece && cargo build --features ${{ matrix.toolkit }} $TARGET )
          # shellcheck disable=SC2086
          ( cd scratch-part  && cargo build $TARGET )
          # `--no-default-features` is what `day build` passes for the app crate, and what an app
          # requires: the scaffold defaults to `mock` so a bare `cargo build` and rust-analyzer
          # compile with no backend flag, and day accepts exactly ONE backend — so adding `appkit`
          # on top of the default is two, and the `enable exactly one backend feature`
          # compile_error fires. Pieces and parts carry no default backend, so their builds above
          # take the plain additive form.
          # shellcheck disable=SC2086
          ( cd scratch-app   && cargo build $LIB --no-default-features --features ${{ matrix.toolkit }} $TARGET )
          # Structural check of the DEFAULT (no --local) output: it must reference the remote git dep.
          "$DAY" new app remote-check --toolkit ${{ matrix.combo }} --no-input >/dev/null
          grep -q 'git = "https://github.com/daybrite/day.git"' remote-check/Cargo.toml

  # --- macOS desktop: appkit / qt / gtk -------------------------------------
  macos:
    name: ${{ matrix.combo }}
    # macos-26 (Tahoe image): the newest Apple Silicon runner generation with current Xcode;
    # bumped from macos-15 for build speed and to track the toolchain Day users actually run.
    runs-on: macos-26
    needs: [day-cli-macos]
    strategy:
      fail-fast: false
      # Tag pushes trim the matrix to appkit — the only leg that packs a release artifact
      # (the .dmg); the qt/gtk legs exist for walkthrough coverage, which tag runs skip.
      matrix: >-
        ${{ startsWith(github.ref, 'refs/tags/')
            && fromJSON('{"include":[{"combo":"macos-appkit","toolkit":"appkit"}]}')
            || fromJSON('{"include":[{"combo":"macos-appkit","toolkit":"appkit"},{"combo":"macos-qt","toolkit":"qt"},{"combo":"macos-gtk","toolkit":"gtk"}]}') }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # NO signing secrets reach this job on any ref (§20.2). It builds arbitrary repo code —
      # cargo, every dependency's build.rs, dayscript walkthroughs — so it packs at the DEV tier
      # (ad-hoc) even on tags, and the result JSON says so loudly. The Developer ID identity and
      # the notary key live in daybrite/actions' `sign-macos` job, which runs no repo code at all.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install toolkit deps
        run: |
          case "${{ matrix.toolkit }}" in
            # The full `qt` formula includes Qt WebEngine (the Qt web view). macos-gtk gets NO
            # WebKitGTK — Homebrew's has no bottle and vends the GTK3 API, and WebKitGTK isn't viable
            # on macOS-quartz, so the GTK web view is Linux/Windows only (day-piece-webview).
            qt) brew install qt pkg-config ;;
            gtk) brew install gtk4 libadwaita pkg-config ;;
          esac
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, NOT the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold → lint → pack → `day rebuild --from-dir` → launch the rebuilt copy, per
      # combo (scripts/ci/scaffold-check.sh). The qt/gtk legs stop after the lint: `day pack`
      # supports neither combo yet.
      - name: Scaffold check (new + lint + pack + rebuild + launch)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" ${{ matrix.combo }}
      # Validate this toolkit's build environment up front — fails the job with setup instructions
      # if a required tool/SDK is missing, rather than deep inside the build.
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Doctor (${{ matrix.toolkit }})
        shell: bash
        run: $DAY_BIN doctor --toolkit ${{ matrix.toolkit }}
      # Scaffold a piece + a part + a full app with `day new`, redirect their day deps to THIS
      # checkout with --local, and build each for this combo — so `day new` output keeps compiling
      # against the day tree under test (the desktop piece + app link the toolkit; the part is headless).
      - name: Walkthrough (${{ matrix.combo }} × light/dark/fr)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: showcase-src
        # The theme × locale expansion, variant naming, and build-once-reuse live in the CLI now
        # (`day launch --themes/--locales`) — one copy instead of a loop per job per workflow.
        run: |
          $DAY_BIN launch -p ${{ matrix.combo }} --script dayscript/walkthrough.yaml \
            --themes "$WALKTHROUGH_THEMES" --locales "$WALKTHROUGH_LOCALES"
      # Secondary windows (docs/windows.md): New Window + the preferences singleton on
      # every native-tier desktop combo; the theme-flip leg additionally needs
      # Cap::Appearance (qt has none). The walkthrough's preferences leg covers the
      # cover-fallback tier elsewhere.
      - name: Windows (${{ matrix.combo }})
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: showcase-src
        run: |
          $DAY_BIN launch -p ${{ matrix.combo }} --script dayscript/windows.yaml --skip-build
          if [ "${{ matrix.toolkit }}" != qt ]; then
            $DAY_BIN launch -p ${{ matrix.combo }} --script dayscript/windows-theme.yaml --skip-build
          fi
      # Text to speech (docs/speech.md): the daybridge reference part, driven on every combo. The
      # script asserts the section's own state rather than the audio — a v1 bridge call reports
      # nothing about the engine after it accepts (docs/bridge.md) — so a CI box with no voice
      # installed still gates what it can: the arm is linked, the call runs, the UI survives it.
      - name: Speech (${{ matrix.combo }})
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: showcase-src
        run: $DAY_BIN launch -p ${{ matrix.combo }} --script dayscript/speech.yaml --skip-build
      # NSPasteboard is display-independent, so the real clipboard round-trip runs on every macOS
      # combo (headless Linux has no system clipboard — see dayscript/clipboard-roundtrip.yaml).
      - name: Clipboard round-trip (${{ matrix.combo }})
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: showcase-src
        run: $DAY_BIN launch -p ${{ matrix.combo }} --script dayscript/clipboard-roundtrip.yaml
      # Crash reporting (day-break, docs/break.md): crash the app intentionally, then confirm the
      # report shows on the NEXT launch. Two invocations against the SAME app-data dir — the crash
      # run exits cleanly via `expect_exit`, the report run reads the persisted report and clears
      # it. macOS is the representative desktop leg (the signal handlers are exercised here; the
      # showcase page's on-device paths — Android UEH, iOS/OHOS signals — run in those legs' manual
      # trial run). Runs AFTER the walkthrough so the empty-state `crash` screenshot stays deterministic.
      - name: Crash reporting round-trip (${{ matrix.combo }})
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: showcase-src
        run: |
          $DAY_BIN launch -p ${{ matrix.combo }} --script dayscript/crash.yaml
          $DAY_BIN launch -p ${{ matrix.combo }} --script dayscript/crash-report.yaml
      # Distribution packaging (§16.5): appkit → .dmg, at the dev tier (ad-hoc). Nothing here is
      # ever distributed — this proves packing works. The signed, notarized .dmg is built by
      # daybrite/Day-Showcase's own release, in a job that runs no repository code (§20.2,
      # daybrite/actions `sign-macos`).
      # The commit in the SBOM only describes the artifact if the tree it was built from
      # matches that commit exactly — see the script.
      - name: Assert the checkout is pristine
        run: bash scripts/ci/assert-pristine.sh showcase-src
      - name: Pack (${{ matrix.combo }} → dmg)
        if: matrix.toolkit == 'appkit'
        working-directory: showcase-src
        run: |
          $DAY_BIN pack -p ${{ matrix.combo }} --no-version-in-name --format json | tee "$RUNNER_TEMP/pack.json"
          codesign -vvv --deep --strict build/day/pack/macos-appkit/*.app
          hdiutil verify build/day/dist/*.dmg
      # For manual verification (`day rebuild` on the downloaded dist) and post-mortems.
      # day publishes no app packages: the showcase releases from its own repository.
      - name: Upload packages
        if: ${{ matrix.toolkit == 'appkit' }}
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist-${{ matrix.combo }}
          path: showcase-src/build/day/dist/
          if-no-files-found: error
      - name: Upload screenshots
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }} # tag runs skip the walkthroughs
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.combo }}
          path: showcase-src/build/day/screenshots/${{ matrix.combo }}
          if-no-files-found: warn

  ios-uikit:
    name: ios-uikit
    # macos-26: see the macos job note — also gives the walkthrough a current iOS Simulator runtime.
    runs-on: macos-26
    needs: [day-cli-macos]
    env:
      # Release signing (§20), active on tag pushes only: the distribution cert + App Store
      # Connect API key light up the device .ipa; without them (and on every branch/PR run)
      # pack builds an UNSIGNED device .ipa instead (sideloadable via AltStore/SideStore,
      # or signed by the developer). Empty secrets degrade to that same unsigned tier.
      DAY_APPLE_TEAM: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_APPLE_TEAM || '' }}
      DAY_ASC_KEY_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_ASC_KEY_ID || '' }}
      DAY_ASC_ISSUER: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_ASC_ISSUER || '' }}
      HAS_APPLE_CERT: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_APPLE_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The uikit backend cross-compiles via the Xcode script phase (§17.4). The device
          # target is for tag pushes, where pack builds the .ipa when the ASC secrets are set.
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, NOT the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold → lint → pack → `day rebuild --from-dir` (scripts/ci/scaffold-check.sh). No
      # trial launch: the packed .ipa is a device build a runner cannot install.
      - name: Scaffold check (new + lint + pack + rebuild)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" ios-uikit
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Doctor (uikit)
        shell: bash
        run: $DAY_BIN doctor --toolkit uikit
      # Scaffold a uikit piece + a part + a full app (deps redirected to this checkout) and
      # cross-compile each for the iOS Simulator — a lib build, so no device/simulator needed here.
      # The app builds `--lib` (its `day::launch` desktop bin is not part of the iOS pipeline).
      - name: Boot an iOS Simulator
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[] | .[] | select(.name | test("^iPhone"))][0].udid')
          echo "booting $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Walkthrough (ios-uikit)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: showcase-src
        # The simulator's app-death flake ("engine connection lost" with zero failed steps) is
        # retried ONCE inside the CLI now — the same signal this step used to grep logs for. One
        # xcodebuild for all eight variants: theme/locale are runtime inputs, so `--skip-build`
        # reuses the .app (xcodebuild's fixed overhead used to be paid per variant).
        run: |
          "$DAY_BIN" build -p ios-uikit
          "$DAY_BIN" launch -p ios-uikit --skip-build --script dayscript/walkthrough.yaml \
            --themes "$WALKTHROUGH_THEMES" --locales "$WALKTHROUGH_LOCALES"
      # Text to speech (docs/speech.md): AVSpeechSynthesizer through the Swift bridge arm, reusing
      # the .app the walkthrough just built.
      - name: Speech (ios-uikit)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: showcase-src
        run: |
          "$DAY_BIN" launch -p ios-uikit --skip-build --script dayscript/speech.yaml
      - name: Dump the most recent crash report (walkthrough failed)
        if: ${{ failure() }}
        run: |
          ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1 \
            | xargs -I{} sh -c 'echo "--- most recent crash report: {} ---"; head -60 "{}"' || true
      # No iPad leg (2026-08). It was the same walkthrough on a booted iPad, and it had stopped
      # earning its ~19 minutes a run: the gallery dropped its column because the leg was
      # delivering no screenshots to put in it. Bring a tablet back as its own parallel job rather
      # than as extra minutes on the phone job, and re-add `ios-uikit-ipad` to
      # website/gallery.config.mjs's `platforms` when it carries shots again.
      # Release-signing material, tag pushes only: distribution cert + ASC API key. Without
      # the secrets these no-op and pack produces the unsigned device .ipa (dev tier, §20).
      - name: Import the distribution certificate
        if: env.HAS_APPLE_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.DAY_APPLE_CERT_P12 }}
          p12-password: ${{ secrets.DAY_APPLE_CERT_PASSWORD }}
      - name: Materialize the ASC API key (.p8)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ASC_KEY_B64: ${{ secrets.DAY_ASC_KEY_B64 }}
        run: |
          if [ -n "$ASC_KEY_B64" ]; then
            echo "$ASC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
            echo "DAY_ASC_KEY=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
          fi
      # The commit in the SBOM only describes the artifact if the tree it was built from
      # matches that commit exactly — see the script.
      - name: Assert the checkout is pristine
        run: bash scripts/ci/assert-pristine.sh showcase-src
      # Distribution packaging (§16.5): without signing.ios (ASC API key) this is the zipped
      # unsigned device .ipa — a SIGNED .ipa lights up when the ASC secrets are configured (§20).
      - name: Pack (ios-uikit)
        working-directory: showcase-src
        run: $DAY_BIN pack -p ios-uikit --no-version-in-name --format json
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist-ios-uikit
          path: showcase-src/build/day/dist/
          if-no-files-found: error
      - name: Upload screenshots
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }} # tag runs skip the walkthroughs
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-ios-uikit
          path: showcase-src/build/day/screenshots/ios-uikit
          if-no-files-found: warn

  # --- Linux desktop: qt / gtk ----------------------------------------------
  linux:
    name: ${{ matrix.combo }}
    # Runs on tag pushes too (pack-only mode) — both legs pack a release .flatpak.
    runs-on: ubuntu-24.04
    needs: [day-cli-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { combo: linux-qt, toolkit: qt }
          - { combo: linux-gtk, toolkit: gtk }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install toolkit deps
        run: |
          sudo apt-get update
          # day-piece-webview needs Qt WebEngine (Qt) / WebKitGTK 6 (GTK) on top of the base libs.
          # fonts-noto-cjk: the runner image ships no CJK-capable font (only Noto Color Emoji +
          # the base DejaVu set, which covers Arabic but not Han), so without it the zh-CN
          # walkthrough variants render every Chinese glyph as a tofu box on both toolkits.
          case "${{ matrix.toolkit }}" in
            qt) sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-webengine-dev pkg-config fonts-noto-cjk ;;
            # dbus supplies `dbus-run-session`: GTK's file dialogs are portal-backed and a
            # runner has no session bus, so `day launch` starts a private one. Without it GTK
            # reaches the portal through a NULL GDBusConnection and segfaults on the 2nd dialog.
            gtk) sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev pkg-config xvfb imagemagick fonts-noto-cjk dbus ;;
          esac
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, NOT the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Before the scaffold check, whose pack stage builds both Linux formats. ubuntu-24.04
      # runners preinstall neither flatpak-builder nor linuxdeploy.
      - name: Install flatpak tooling
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      # linuxdeploy + its toolkit plugin build the .appimage (§16.5). They ship as downloaded
      # AppImages, so they go to $RUNNER_TEMP — never the workspace, which IS the checkout the
      # pristine assert covers — and are named through DAY_LINUXDEPLOY* rather than PATH.
      - name: Install linuxdeploy tooling
        env:
          TOOLKIT: ${{ matrix.toolkit }}
        run: |
          set -euo pipefail
          # appimagetool needs FUSE, which a runner does not have; APPIMAGE_EXTRACT_AND_RUN is the
          # documented way round it. xvfb is for the AppImage launch check below.
          sudo apt-get install -y --no-install-recommends xvfb
          sudo apt-get install -y --no-install-recommends fuse3 libfuse2t64 || \
            sudo apt-get install -y --no-install-recommends fuse libfuse2 || true
          # dpkg-dev supplies dpkg-architecture, which the GTK plugin exits on when missing
          # ("Install dpkg-dev then re-run the plugin"). Runners normally have it via
          # build-essential; asking for it explicitly costs nothing and removes the assumption.
          sudo apt-get install -y --no-install-recommends dpkg-dev
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          # The two plugins are NOT distributed the same way, which is what broke this step:
          #
          #   qt   ships an AppImage on a rolling `continuous` release.
          #   gtk  has no releases at all — it is a shell script in its repository. The
          #        `continuous` download URL therefore 404s, and `curl -f` exits 22.
          #
          # linuxdeploy finds a plugin by globbing `linuxdeploy-plugin-<name>*` next to its own
          # binary and along PATH, so the `.sh` suffix is fine as long as both files land in the
          # same directory. day-cli only checks the file exists (pack/appimage.rs `tool()`), then
          # passes `--plugin <name>`; linuxdeploy does the real lookup.
          case "$TOOLKIT" in
            qt)
              PLUGIN="$RUNNER_TEMP/linuxdeploy-plugin-qt"
              curl -fsSL --retry 3 -o "$PLUGIN" \
                "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
              ;;
            gtk)
              # Pinned to a commit rather than `master`: with no releases to track, an unpinned
              # branch is a third party editing this job's behaviour without a pull request.
              PLUGIN="$RUNNER_TEMP/linuxdeploy-plugin-gtk.sh"
              curl -fsSL --retry 3 -o "$PLUGIN" \
                "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh"
              ;;
            *)
              echo "::error::no linuxdeploy plugin known for toolkit '$TOOLKIT'"; exit 1 ;;
          esac
          chmod +x "$RUNNER_TEMP/linuxdeploy" "$PLUGIN"
          {
            echo "DAY_LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy"
            echo "DAY_LINUXDEPLOY_PLUGIN_${TOOLKIT^^}=$PLUGIN"
            echo "APPIMAGE_EXTRACT_AND_RUN=1"
          } >> "$GITHUB_ENV"
      # Scaffold → lint → pack → `day rebuild --from-dir` → launch the rebuilt copy
      # (scripts/ci/scaffold-check.sh). No xvfb wrapper, same as the walkthrough below: the CLI
      # supplies the headless plumbing itself (both toolkits under xvfb — qt on the xcb platform,
      # falling back to offscreen only where xvfb-run is missing).
      - name: Scaffold check (new + lint + pack + rebuild + launch)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" ${{ matrix.combo }}
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Doctor (${{ matrix.toolkit }})
        shell: bash
        run: $DAY_BIN doctor --toolkit ${{ matrix.toolkit }}
      # Scaffold a piece + a part + a full app with `day new` (deps redirected to this checkout via
      # --local) and build each for this combo, so `day new` output keeps compiling against the day
      # tree under test.
      - name: Walkthrough (${{ matrix.combo }} × light/dark/fr)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: showcase-src
        # Headless plumbing is the CLI's now: no DISPLAY on this runner, so both toolkits run
        # under an xvfb sized from Day.toml [window] (the root-capture fallback frames exactly
        # the app) — linux-gtk with the WebKit flags, linux-qt on the xcb platform (a real
        # display server, so the system clipboard works).
        run: |
          $DAY_BIN launch -p ${{ matrix.combo }} --script dayscript/walkthrough.yaml \
            --themes "$WALKTHROUGH_THEMES" --locales "$WALKTHROUGH_LOCALES"
      # Distribution packaging (§16.5): both Linux formats. The .flatpak takes its toolkit from a
      # runtime that resolves from Flathub at install time (--runtime-repo), so the bundle stays
      # app-only; the .appimage carries its toolkit inside, so it runs on a machine with nothing
      # installed. Both toolchains were installed above, before the scaffold check.
      # The commit in the SBOM only describes the artifact if the tree it was built from
      # matches that commit exactly — see the script.
      - name: Assert the checkout is pristine
        run: bash scripts/ci/assert-pristine.sh showcase-src
      - name: Pack (${{ matrix.combo }} → flatpak + appimage)
        working-directory: showcase-src
        run: $DAY_BIN pack -p ${{ matrix.combo }} --no-version-in-name --format json
      # The pre-bundle payload, kept for manual diffoscope runs (§20.3). A `.flatpak` is an OSTree bundle that no
      # ordinary archiver can open, so comparing the bundle alone could never say whether the CODE
      # matched — and a check that cannot answer must not report success. flatpak.rs stages the
      # real ELF at stage/bin/<name>-bin before bundling; that is what gets compared.
      - name: Upload the staged payload (reproducibility)
        uses: actions/upload-artifact@v7
        with:
          name: showcase-payload-${{ matrix.combo }}
          path: showcase-src/build/day/flatpak/${{ matrix.combo }}/stage/bin/
          if-no-files-found: error
      - name: Install + inspect the bundle
        working-directory: showcase-src
        run: |
          flatpak install --user -y ./build/day/dist/*.flatpak
          flatpak info dev.daybrite.showcase
      # The AppImage's claim is "runs where nothing is installed", and only running it checks that.
      # A missing GTK/Qt module the bundling failed to carry crashes on launch, so `timeout`
      # having to kill a still-running app (124) is the PASS here.
      - name: Run the AppImage
        working-directory: showcase-src
        run: |
          set -euo pipefail
          APP="$(realpath "$(find build/day/dist -maxdepth 1 -name '*.appimage' | head -1)")"
          [ -n "$APP" ] || { echo "::error::no .appimage in build/day/dist"; exit 1; }
          chmod +x "$APP"
          ( cd "$RUNNER_TEMP" && rm -rf squashfs-root && "$APP" --appimage-extract >/dev/null )
          for required in AppRun usr/bin; do
            [ -e "$RUNNER_TEMP/squashfs-root/$required" ] \
              || { echo "::error::the AppImage has no $required"; exit 1; }
          done
          ls "$RUNNER_TEMP/squashfs-root"/*.desktop >/dev/null \
            || { echo "::error::the AppImage has no .desktop at its root"; exit 1; }
          echo "bundled libraries: $(find "$RUNNER_TEMP/squashfs-root/usr/lib" -name '*.so*' 2>/dev/null | wc -l)"
          set +e
          xvfb-run -a timeout 20s "$APP" > "$RUNNER_TEMP/appimage-run.log" 2>&1
          code=$?
          set -e
          if [ "$code" != 124 ] && [ "$code" != 0 ]; then
            echo "::error::the AppImage exited $code instead of staying up"
            tail -40 "$RUNNER_TEMP/appimage-run.log"
            exit 1
          fi
          echo "the AppImage stayed up for 20s"
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist-${{ matrix.combo }}
          path: showcase-src/build/day/dist/
          if-no-files-found: error
      - name: Upload screenshots
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }} # tag runs skip the walkthroughs
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.combo }}
          path: showcase-src/build/day/screenshots/${{ matrix.combo }}
          if-no-files-found: warn

  # --- Android emulator: mdc ------------------------------------------------
  # Real emulator via KVM (reactivecircus). The Linux emulator is x86_64-only, so
  # the .so cross-builds for x86_64 via DAY_ANDROID_ABI. continue-on-error while
  # the known postMain flake (intermittent "main thread did not respond") is chased.
  android-mdc:
    name: android-mdc
    runs-on: ubuntu-24.04
    needs: [day-cli-linux]
    # Best-effort on branch/PR runs while the postMain emulator flake is chased; on tag
    # pushes the emulator never runs and the job gates the release HARD (a failed pack
    # must block the release job, not silently ship without the Android packages).
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
    env:
      # Release signing (§20), active on tag pushes only: the Play upload keystore.
      # Empty secrets (and every branch/PR run) degrade to a CI-generated dev keystore.
      DAY_ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_ANDROID_KEY_ALIAS || '' }}
      DAY_KS_PASS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_KS_PASS || '' }}
      DAY_KEY_PASS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_KEY_PASS || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No setup-java — Gradle runs on the runner's default preinstalled JDK (Day accepts 17+;
      # Gradle 9.6 supports 17…26). setup-gradle pins the Gradle version; the JDK is the runner's.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
          add-job-summary: "never"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Enable KVM group perms
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up the Android cross-compile targets
        run: |
          # x86_64 for the emulator walkthrough, aarch64 for the arm64-v8a pack.
          rustup target add x86_64-linux-android aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, NOT the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold → lint → pack → `day rebuild --from-dir` (scripts/ci/scaffold-check.sh). No
      # trial launch: the emulator boots later, only for the walkthrough.
      - name: Scaffold check (new + lint + pack + rebuild)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" android-mdc
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Doctor (android)
        shell: bash
        run: $DAY_BIN doctor --toolkit android
      # Scaffold an mdc piece + a part + a full app (deps redirected to this checkout) and
      # cross-compile each for Android — a lib build (rlib), so no NDK linker or emulator is needed
      # here. The app builds `--lib` (its `day::launch` desktop bin is not part of the Android pipeline).
      - name: Materialize the upload keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.DAY_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
            echo "DAY_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          fi
      # Distribution packaging (§16.5): release .apk + .aab carrying BOTH device (arm64-v8a) and
      # emulator/desktop (x86_64) native libs — DAY_ANDROID_ABI takes a comma-separated ABI list,
      # and both rustup targets are installed above. Without signing.android secrets the keystore
      # is a CI-generated dev key — installable, marked dev-signed, never distributable (§20).
      # apksigner verify runs inside pack. Runs BEFORE the emulator walkthrough so the dist
      # artifacts survive an emulator flake.
      # The commit in the SBOM only describes the artifact if the tree it was built from
      # matches that commit exactly — see the script.
      - name: Assert the checkout is pristine
        run: bash scripts/ci/assert-pristine.sh showcase-src
      - name: Pack (android-mdc → apk + aab)
        working-directory: showcase-src
        env:
          DAY_ANDROID_ABI: arm64-v8a,x86_64
        run: $DAY_BIN pack -p android-mdc --no-version-in-name --format json
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist-android-mdc
          path: showcase-src/build/day/dist/
          if-no-files-found: error
      - name: Emulator walkthrough (android-mdc)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DAY_ANDROID_ABI: x86_64
        with:
          api-level: 34
          arch: x86_64
          # Without a profile avdmanager creates a legacy 320×640 device — every screenshot
          # then reads comically oversized next to the ~400pt iPhone shots in the gallery.
          # pixel_5 is 393×851dp: the closest stock profile to the iOS simulator form factor.
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The action runs each script line as its own `sh -c`, so `cd` must share the line.
          # Screenshot variants: light/dark × en/fr/ar/zh-CN (DAY_THEME rides the intent extras).
          script: cd showcase-src && $DAY_BIN launch -p android-mdc --script dayscript/walkthrough.yaml --themes "$WALKTHROUGH_THEMES" --locales "$WALKTHROUGH_LOCALES" && $DAY_BIN launch -p android-mdc --script dayscript/clipboard-roundtrip.yaml && $DAY_BIN launch -p android-mdc --script dayscript/speech.yaml
      # No tablet leg (2026-08), for the iPad leg's reasons plus one of its own: a second emulator
      # boot per run, for screenshots the gallery has no column for, and the leg that wedges. A
      # hung pixel_tablet emulator is what left this job sitting until the six-hour timeout — `day
      # launch` now gives up on a device that stopped answering, but the cheapest fix is not to
      # boot a second emulator for nothing. Same restoration path as iOS: its own parallel job,
      # and `android-mdc-tablet` back in website/gallery.config.mjs's `platforms`.
      - name: Upload screenshots
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }} # tag runs skip the walkthroughs
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-android-mdc
          path: showcase-src/build/day/screenshots/android-mdc
          if-no-files-found: warn

  # --- HarmonyOS Next / OpenHarmony ArkUI emulator -------------------------
  # Brings harmony-arkui to parity with the other mobile targets: `day launch -p harmony-arkui --script …`
  # cross-compiles the app to libentry.so, packages + signs the .hap, then installs + launches + drives
  # it on an emulator over hdc, capturing screenshots for the gallery — exactly the Android/iOS flow.
  # The OpenHarmony SDK (NDK + hdc + RELEASE signing material) comes from openharmony-rs/setup-ohos-sdk;
  # the Oniro QEMU emulator boots via Day's own launcher; hvigor + ohpm (absent from the public SDK)
  # come from the command-line-tools, run under the runner's node.
  harmony-arkui:
    # EXPERIMENTAL (continue-on-error at the JOB level): the whole HarmonyOS job runs on ONE
    # x86_64 Linux runner so the x86_64 Oniro guest can run KVM-accelerated (same-arch guest +
    # /dev/kvm) instead of TCG software emulation — the boot + 8-variant walkthrough was ~25 min
    # under TCG on macOS. `day ohos emulator launch` auto-selects `-accel kvm` when /dev/kvm
    # exists (else TCG). The job is marked experimental so a HarmonyOS regression — or an emulator
    # that still won't boot under KVM — never blocks the website/release jobs that `need` it.
    #
    # (History: this ran on macos-14 because under pure TCG only fast Apple-Silicon cores booted
    # the guest reliably — ubuntu-under-TCG never rendered the first-boot keyguard. KVM removes the
    # TCG bottleneck, so x86_64 Linux should now be both far faster AND reliable. If KVM turns out
    # unavailable, set `DAY_OHOS_ACCEL=tcg,thread=multi` to force software emulation.)
    name: harmony-arkui
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [day-cli-linux]
    timeout-minutes: 90
    env:
      # hvigor + ohpm are NOT in the public SDK; they come from the OpenHarmony
      # command-line-tools. The bundle is Linux-packaged but hvigor/ohpm are pure JS — they run
      # under the runner's node via two-line wrappers (docs/harmonyos.md), so the same cached
      # zip serves both host OSes. RELEASE signing material ships in setup-ohos-sdk's
      # toolchains/lib.
      CLT_VERSION: "5.1.0.840"
      CLT_URL: https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip
      HARMONY: showcase-src/platform/ohos
      # Release signing (§20), active on tag pushes only: OHOS keystore/cert/profile.
      # Empty secrets (and every branch/PR run) degrade to the public dev cert.
      DAY_OHOS_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_OHOS_KEY_ALIAS || '' }}
      DAY_OHOS_KS_PASS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_OHOS_KS_PASS || '' }}
      DAY_OHOS_KEY_PASS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DAY_OHOS_KEY_PASS || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Tier-2 OHOS std targets: emulator (x86_64) + device (arm64). rustup provides the std.
          targets: aarch64-unknown-linux-ohos,x86_64-unknown-linux-ohos
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        # java for sign-hap.mjs (signs the provision profile + the .hap via hap-sign-tool).
        with:
          distribution: temurin
          java-version: "21"
      # The host OpenHarmony SDK (Linux, from setup-ohos-sdk) — the NDK for the Rust cross-compile,
      # hdc for the emulator, AND the full component set (ets/js/toolchains/previewer) hvigor builds
      # against. 5.1.0 is API 18, matching build-profile's compile/compatibleSdkVersion. hvigor
      # spawns SDK tools (syscap_tool, restool, es2abc) directly, so they must be host-native — which
      # the Linux SDK provides natively (on the old macOS runner this had to be the darwin SDK to
      # avoid `spawn ENOEXEC`; on Linux the ELF tools run directly).
      - uses: openharmony-rs/setup-ohos-sdk@v1
        id: ohos-sdk
        with:
          version: "5.1.0"
      - name: Put the OHOS toolchains on PATH + point OHOS_NDK_HOME at the NDK
        run: |
          # setup-ohos-sdk's own OHOS_NDK_HOME is the per-OS SDK ROOT; the NDK (the llvm cross-compilers
          # day-arkui-sys's build.rs and the cargo linkers need) is its `native` component, exposed as
          # the `ohos_sdk_native` output (…/native, a sibling of …/toolchains). Pin OHOS_NDK_HOME to it.
          NATIVE="${{ steps.ohos-sdk.outputs.ohos_sdk_native }}"
          echo "$(dirname "$NATIVE")/toolchains" >> "$GITHUB_PATH"
          echo "OHOS_NDK_HOME=$NATIVE" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_OHOS_LINKER=$NATIVE/llvm/bin/x86_64-unknown-linux-ohos-clang" >> "$GITHUB_ENV"
          # cc-rs never finds the NDK's wrapper clang on its own (not on PATH; scripts/ci/lint.sh
          # derives the same trio) — bundled SQLite (day-persistence) compiles C in the arkui
          # clippy graph.
          echo "CC_aarch64_unknown_linux_ohos=$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_ohos=$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_ohos=$NATIVE/llvm/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Cache the OpenHarmony command-line-tools (hvigor / ohpm)
        uses: actions/cache@v6
        with:
          path: ~/ohos-clt
          key: ohos-clt-${{ env.CLT_VERSION }}
      - name: Install hvigor/ohpm from the (Linux) command-line-tools via node wrappers
        run: |
          set -euo pipefail
          C="$HOME/ohos-clt/command-line-tools"
          if [ ! -f "$C/hvigor/bin/hvigorw.js" ]; then
            mkdir -p ~/ohos-clt && cd ~/ohos-clt
            curl -fSL -o clt.zip "$CLT_URL"
            unzip -q -o clt.zip && rm -f clt.zip
          fi
          # hvigor/ohpm are pure JS — run them with the runner's own node (docs/harmonyos.md),
          # which stays identical to the local macOS dev recipe and is host-OS-agnostic.
          mkdir -p "$HOME/ohos-bin"
          printf '#!/usr/bin/env bash\nexec node "%s/hvigor/bin/hvigorw.js" "$@"\n' "$C" > "$HOME/ohos-bin/hvigorw"
          printf '#!/usr/bin/env bash\nexec node "%s/ohpm/bin/pm-cli.js" "$@"\n' "$C" > "$HOME/ohos-bin/ohpm"
          chmod +x "$HOME/ohos-bin/hvigorw" "$HOME/ohos-bin/ohpm"
          echo "$HOME/ohos-bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=$C/sdk" >> "$GITHUB_ENV"
      - name: Assemble a versioned OpenHarmony SDK for hvigor (OHOS_BASE_SDK_HOME)
        run: |
          set -euo pipefail
          # hvigor's OpenHarmony mode (runtimeOS: "OpenHarmony") reads OHOS_BASE_SDK_HOME and
          # requires the NEW versioned layout (<base>/<api>/{ets,native,toolchains,…}). Build a
          # versioned view over the host API-18 SDK from setup-ohos-sdk. Mirrors the validated
          # local setup (docs/harmonyos.md).
          OH="$(dirname "${{ steps.ohos-sdk.outputs.ohos_sdk_native }}")"
          BASE="$HOME/ohos-ohsdk"
          mkdir -p "$BASE"
          ln -sfn "$OH" "$BASE/18"
          echo "OHOS_BASE_SDK_HOME=$BASE" >> "$GITHUB_ENV"
      # The one framework check still living in a target job: the arkui cross-clippy needs the whole
      # OpenHarmony SDK, already set up above. Lifting it into `toolkit` would mean a second copy of
      # six setup steps — it belongs in a composite action, not in a duplicate.
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, NOT the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold → lint → pack → `day rebuild --from-dir` (scripts/ci/scaffold-check.sh). No
      # trial launch: the Oniro emulator boots later, only for the walkthrough.
      - name: Scaffold check (new + lint + pack + rebuild)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" harmony-arkui
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Clippy (arkui backend, cross-check)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        # `--lib` like the iOS/Android cross-checks: a mobile/embedded backend has no `day::launch`
        # (that's desktop-only), so the app is a cdylib — the desktop `src/main.rs` bin isn't built.
        # `-A missing_const_for_thread_local`: clippy 1.97 false-positives it on this cross-target
        # (flags `thread_local!`s already using `const { … }`); the host clippy job enforces it.
        working-directory: showcase-src
        run: cargo clippy --target aarch64-unknown-linux-ohos --lib --no-default-features --features arkui -- -D warnings -A clippy::missing_const_for_thread_local
      - name: Doctor (harmonyos)
        shell: bash
        run: $DAY_BIN doctor --toolkit harmonyos
      # ---- Emulator screenshots (best-effort from here to the walkthrough): the TCG guest is
      # slow and occasionally flaky, so these steps never fail the job — the build gates above
      # and the pack below stay hard. ----
      - name: Enable KVM group perms
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        # Same recipe as the android job: make /dev/kvm world-accessible so `qemu -accel kvm`
        # (auto-selected by `day ohos emulator launch` when /dev/kvm exists) can open it.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Cache the Oniro emulator image
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/oniro-emulator/v6.1
          key: oniro-emulator-v6.1-oniro_emulator.zip
      - name: Boot the Oniro emulator (day ohos emulator launch --headless)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ZIP="$HOME/.cache/oniro-emulator/v6.1/oniro_emulator.zip"
          if [ ! -f "$ZIP" ]; then
            mkdir -p "$(dirname "$ZIP")"
            curl -fL -o "$ZIP" \
              "https://github.com/eclipse-oniro4openharmony/device_board_oniro/releases/download/v6.1/oniro_emulator.zip"
          fi
          rm -rf "$RUNNER_TEMP/oniro-emulator" && mkdir -p "$RUNNER_TEMP/oniro-emulator"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/oniro-emulator"
          IMAGES="$(dirname "$(find "$RUNNER_TEMP/oniro-emulator" -name bzImage -print -quit)")"
          echo "DAY_OHOS_EMULATOR=$IMAGES" >> "$GITHUB_ENV"
          DAY_OHOS_EMULATOR="$IMAGES" $DAY_BIN ohos emulator launch --headless
      # The same walkthrough as every other target (`day launch` force-stops the singleton app
      # per cycle so each run's engine port takes effect — docs/harmonyos.md). Two variants
      # (light/dark) rather than the full eight: each TCG pass is minutes long, and the
      # gallery's OHOS column falls back per shot for the locale variants.
      - name: Emulator walkthrough (harmony-arkui × light/dark × en/fr/ar/zh-CN)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        working-directory: showcase-src
        # The same theme × locale matrix as the other walkthrough legs (the gallery's non-English
        # ohos tiles fell back to the English captures before these variants existed). Every
        # variant is individually best-effort — one TCG flake must not skip the remaining runs.
        env:
          # Per-screenshot compositor settle before capture (script.rs, default 4000 ms). The
          # walkthrough takes ~29 shots × 8 variants, so this wait IS most of the step's time;
          # 2500 ms matches the measured 2-3 s TCG compositor lag, and the byte-identical
          # stale-frame retry (+3 s, up to 3 more attempts) still catches the stragglers.
          DAY_OHOS_SHOT_SETTLE_MS: 2500
        run: |
          # One hvigor+sign build for all eight variants (theme/locale are runtime inputs).
          # The CLI's matrix continues past a variant whose engine dies (the TCG emulator's
          # specialty) and reports the failure count at the end; the `||` keeps this leg
          # advisory exactly as the old per-variant `|| warning` did.
          $DAY_BIN build -p harmony-arkui
          $DAY_BIN launch -p harmony-arkui --skip-build --script dayscript/walkthrough.yaml \
            --themes "$WALKTHROUGH_THEMES" --locales "$WALKTHROUGH_LOCALES" \
            || echo "::warning::ohos walkthrough reported failures (see the log per variant)"
      # Release-signing material, tag pushes only: OHOS keystore + cert + provision profile on
      # disk. Without the secrets these no-op and pack signs with the public dev cert (§20).
      - name: Materialize OHOS signing material
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.DAY_OHOS_KEYSTORE_B64 }}
          CERT_B64: ${{ secrets.DAY_OHOS_CERT_B64 }}
          PROFILE_B64: ${{ secrets.DAY_OHOS_PROFILE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ohos.p12"
            echo "DAY_OHOS_KEYSTORE=$RUNNER_TEMP/ohos.p12" >> "$GITHUB_ENV"
          fi
          if [ -n "$CERT_B64" ]; then
            echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/ohos.cer"
            echo "DAY_OHOS_CERT=$RUNNER_TEMP/ohos.cer" >> "$GITHUB_ENV"
          fi
          if [ -n "$PROFILE_B64" ]; then
            echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/ohos.p7b"
            echo "DAY_OHOS_PROFILE=$RUNNER_TEMP/ohos.p7b" >> "$GITHUB_ENV"
          fi
      # Distribution packaging (§16.5): the .hap, release-signed when signing.ohos material is
      # configured; the public-cert dev signature otherwise (emulator installs only, dev tier).
      # DAY_OHOS_ARCH pins the packaged .so to arm64 (devices); the emulator runs x86_64.
      # The commit in the SBOM only describes the artifact if the tree it was built from
      # matches that commit exactly — see the script.
      - name: Assert the checkout is pristine
        run: bash scripts/ci/assert-pristine.sh showcase-src
      - name: Pack (harmony-arkui → hap)
        working-directory: showcase-src
        env:
          DAY_OHOS_ARCH: arm64
        run: $DAY_BIN pack -p harmony-arkui --no-version-in-name --format json
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist-harmony-arkui
          path: showcase-src/build/day/dist/
          if-no-files-found: error
      - name: Upload screenshots
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }} # tag runs skip the walkthroughs
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-harmony-arkui
          path: showcase-src/build/day/screenshots/harmony-arkui
          if-no-files-found: warn
      - name: Upload the .hap (post-mortem)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harmony-arkui-artifacts
          path: showcase-src/platform/ohos/entry/build/**/*.hap
          if-no-files-found: ignore

  # --- Windows desktop: xaml (MSVC) ----------------------------------------
  # xaml uses MSVC + the Windows SDK cppwinrt headers (on windows-latest) and
  # captures via RenderTargetBitmap. It runs on the default `bash` shell. It is a
  # SEPARATE job from windows-qt / windows-gtk because those need the msys2 shell:
  # the `matrix` context is not available in a step's `shell:` field, so a single
  # matrix cannot switch shells per combo — the toolchains are split into two jobs.
  windows-xaml:
    name: windows-xaml
    runs-on: windows-latest
    needs: [day-cli-windows]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, NOT the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Before the scaffold check, whose pack stage builds the NSIS -setup.exe too.
      # windows-2025 runners don't preinstall NSIS.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # `choco` edits the MACHINE PATH, which does not reach later steps: Actions hands every
          # step the environment captured when the job started. So locate makensis.exe now and hand
          # it to `day pack` explicitly. Doing it here also fails in seconds if the package moved,
          # instead of after the six-minute release build that packs the installer.
          $roots = @("$env:ProgramFiles\NSIS", "${env:ProgramFiles(x86)}\NSIS", "$env:ChocolateyInstall\bin", "$env:ChocolateyInstall\lib\nsis") | Where-Object { $_ -and (Test-Path $_) }
          $exe = Get-ChildItem -Path $roots -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "makensis.exe not found after 'choco install nsis' (looked in: $($roots -join '; '))" }
          "DAY_MAKENSIS=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "makensis: $($exe.FullName)"
      # Scaffold → lint → pack → `day rebuild --from-dir` → launch the rebuilt copy
      # (scripts/ci/scaffold-check.sh).
      - name: Scaffold check (new + lint + pack + rebuild + launch)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" windows-xaml
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Doctor (xaml)
        shell: bash
        run: $DAY_BIN doctor --toolkit xaml
      # The only CI job that can compile `day new`'s xaml template branch: scaffold a xaml piece +
      # a part + a full app (deps redirected to this checkout) and build each. xaml is a desktop
      # day::launch backend, so the app builds fully (its C++/WinRT shim is built on this Windows host).
      - name: Walkthrough (windows-xaml × light/dark/fr)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: showcase-src
        run: |
          $DAY_BIN launch -p windows-xaml --script dayscript/walkthrough.yaml \
            --themes "$WALKTHROUGH_THEMES" --locales "$WALKTHROUGH_LOCALES"
      # Distribution packaging (§16.5): .msix (makeappx + signtool, self-signed dev cert without
      # signing.windows secrets) + NSIS -setup.exe (NSIS was installed above, before the scaffold
      # check).
      # The commit in the SBOM only describes the artifact if the tree it was built from
      # matches that commit exactly — see the script.
      - name: Assert the checkout is pristine
        run: bash scripts/ci/assert-pristine.sh showcase-src
      - name: Pack (windows-xaml → msix + setup.exe)
        working-directory: showcase-src
        run: $DAY_BIN pack -p windows-xaml --no-version-in-name --format json
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist-windows-xaml
          path: showcase-src/build/day/dist/
          if-no-files-found: error
      # The pre-container payload, kept for manual diffoscope runs (§20.3). The NSIS `-setup.exe` is a
      # self-extracting installer nothing in the check can open, so comparing containers alone
      # could only ever return "unverified". msix.rs stages the exe + assets here before either
      # container is built, and both are built from it — so this is the thing worth comparing.
      - name: Upload the staged payload (reproducibility)
        uses: actions/upload-artifact@v7
        with:
          name: showcase-payload-windows-xaml
          path: showcase-src/build/day/pack/windows-payload/
          if-no-files-found: error
      - name: Upload screenshots
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }} # tag runs skip the walkthroughs
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-windows-xaml
          path: showcase-src/build/day/screenshots/windows-xaml
          if-no-files-found: warn

  # --- Windows desktop: qt / gtk (gnu toolchain + MSYS2) --------------------
  # windows-qt / windows-gtk use the gnu toolchain + MSYS2's MINGW64 GTK4/Qt6 +
  # pkgconf, built and run inside the msys2 shell (so pkg-config and the runtime
  # DLLs resolve). The whole job defaults to `msys2 {0}` — every `run:` step here is
  # a cargo build/test that must see MINGW64's pkgconf; the action-only setup steps
  # (checkout/toolchain/cache/setup-msys2) don't use the job shell, and setup-msys2
  # runs before the first `run:` step, so the shell exists when it's first needed.
  # `path-type: inherit` keeps the Windows PATH (rustup's cargo, the built day.exe)
  # visible while adding /mingw64/bin. windows-gtk's Rust build was confirmed locally
  # against MSYS2 GTK 4.22 (clangarm64/gnullvm); both stay experimental
  # (continue-on-error) until a full CI walkthrough is green on a real Windows host.
  windows-msys2:
    name: ${{ matrix.combo }}
    if: ${{ !startsWith(github.ref, 'refs/tags/') }} # experimental + packs no release artifact — skip on tags
    runs-on: windows-latest
    needs: [day-cli-windows]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # mingw-w64-x86_64-gcc provides the mingw gcc/g++ the pin step below points the linker
          # (and the cc crate) at — the runner has no MSYS2 mingw compiler otherwise, only the libs.
          # Neither web view has an MSYS2/MINGW64 package: no Qt6 WebEngine and no WebKitGTK 6 (both
          # embed a browser engine — Chromium / WebKit — that won't build with MinGW GCC). So
          # day-piece-webview degrades on both: the Qt view to a URL label (build.rs probes pkg-config
          # for Qt6WebEngineWidgets), the GTK view to day's placeholder leaf (webkit6 is gated off
          # Windows in Cargo.toml, exactly like macOS).
          - combo: windows-qt
            toolkit: qt
            msys_pkgs: mingw-w64-x86_64-gcc mingw-w64-x86_64-qt6-base mingw-w64-x86_64-pkgconf
          - combo: windows-gtk
            toolkit: gtk
            msys_pkgs: mingw-w64-x86_64-gcc mingw-w64-x86_64-gtk4 mingw-w64-x86_64-libadwaita mingw-w64-x86_64-pkgconf
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set up MSYS2 (qt/gtk)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: ${{ matrix.msys_pkgs }}
      # rustup's windows-gnu toolchain links via whatever `x86_64-w64-mingw32-gcc` is first on
      # PATH — on the runner that resolves to a *different* mingw (C:\mingw64) which lacks the
      # MSYS2 Qt6/GTK4/glib import libs, so `-lQt6Widgets` / `-lglib-2.0` fail to link. Force
      # MSYS2's mingw to the front of PATH and pin the linker + the `cc` crate's compiler (for the
      # C++ shims) to MSYS2's own gcc, so /mingw64/lib is searched. Forward-slash paths link cleanly.
      - name: Pin the MSYS2 mingw toolchain (finds MSYS2 Qt6/GTK4 libs)
        run: |
          cygpath -w "$MINGW_PREFIX/bin" >> "$GITHUB_PATH"
          GCC="$(cygpath -m "$MINGW_PREFIX/bin/gcc.exe")"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$GCC" >> "$GITHUB_ENV"
          echo "CC=$GCC" >> "$GITHUB_ENV"
          echo "CXX=$(cygpath -m "$MINGW_PREFIX/bin/g++.exe")" >> "$GITHUB_ENV"
      # Kept here rather than lifted into `test`: this runs under MSYS2's mingw toolchain, so it
      # covers windows-gnu, which the msvc row of `test` does not.
      - name: Test host-portable crates
        run: cargo test --locked
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day / day.exe); take its absolute path so every
          # step can invoke it as $DAY_BIN regardless of working directory. It lives in the runner's
          # temp dir, NOT the workspace: the workspace is the checkout, and an untracked directory in
          # it makes `day pack` record a dirty tree (§20.3). On Windows $RUNNER_TEMP is a DOS path,
          # which cygpath turns into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      - name: Doctor (${{ matrix.toolkit }})
        shell: bash
        run: $DAY_BIN doctor --toolkit ${{ matrix.toolkit }}
      # WEBKIT_DISABLE_COMPOSITING_MODE is a harmless no-op on Windows now (neither combo has a real
      # web engine — Qt degrades to a label, GTK to a placeholder); kept so the invocation matches the
      # Linux GTK job, where the same var is load-bearing for the real WebKitGTK view.
      - name: Walkthrough (${{ matrix.combo }} × light/dark/fr)
        working-directory: showcase-src
        run: |
          $DAY_BIN launch -p ${{ matrix.combo }} --script dayscript/walkthrough.yaml \
            --themes "$WALKTHROUGH_THEMES" --locales "$WALKTHROUGH_LOCALES" \
            --env WEBKIT_DISABLE_COMPOSITING_MODE=1
      - name: Upload screenshots
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }} # tag runs skip the walkthroughs
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.combo }}
          path: showcase-src/build/day/screenshots/${{ matrix.combo }}
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # msrv: the declared minimum supported Rust (workspace rust-version) still
  # builds the host-portable crates (§20.5).
  # ---------------------------------------------------------------------------
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build at MSRV
        run: cargo build --locked

  # ---------------------------------------------------------------------------
  # deny: dependency advisories + duplicate-version bans (§20.5). Runs as its own
  # check; the build combos gate on [fmt, msrv] only — clippy and deny are
  # independent required checks, so a lint error or a newly published RUSTSEC
  # advisory shouldn't suppress the platform matrix's build/test signal. Add
  # either to each combo's `needs:` to make it a hard gate.
  # ---------------------------------------------------------------------------
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans

  # ---------------------------------------------------------------------------
  # api-docs: generate the Rust API reference (rustdoc) for the public-facing Day crates and share it
  # as an artifact the website job drops into dist/api (linked from /docs/api). The build is PORTABLE —
  # the core crates need no features and the `day` umbrella uses its headless `mock` backend — so no
  # native toolkit is installed and it runs on a stock runner. Crate list + `cargo doc` invocations
  # live in scripts/build-api-docs.sh, driven by website/src/data/api-crates.json (same file the bridge
  # page reads). Runs in parallel with the platform jobs; a failure degrades gracefully (the website
  # still deploys — the API pages 404 until the next green run) rather than blocking the site.
  # ---------------------------------------------------------------------------
  api-docs:
    name: rustdoc
    if: ${{ !startsWith(github.ref, 'refs/tags/') }} # feeds the website, which tag pushes skip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate rustdoc for the public crates
        run: scripts/build-api-docs.sh
      - name: Upload the API reference
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: target/doc
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # web-dom: build the showcase for the web-dom backend (docs/web.md) — a wasm32 cdylib plus
  # the day-dom host page, assembled by `day build` into a fully static dist/. The dist is built
  # here as the wasm build test and to drive the walkthrough, but it is NOT published: the app
  # deploys its own web build to showcase.daybrite.dev/webapp from its own repository, and this
  # site links there. Then the SAME walkthrough script the
  # native combos run drives the page in headless CHROMIUM (day-cli's bundled page-driver,
  # `day web driver`, is the DAY_WEB_DRIVER browser; the dayscript engine runs in the wasm over the launch server's
  # WebSocket bridge) and uploads gallery screenshots like every other combo. Chromium, not
  # WebKit, because Playwright's Linux WebKit (the WPE port) ships no OPFS and day-part-fs is
  # OPFS-only (docs/fs.md); the sensors step below stays on WebKit, which it works fine on.
  # ---------------------------------------------------------------------------
  web-dom:
    name: web-dom
    if: ${{ !startsWith(github.ref, 'refs/tags/') }} # feeds the website, which tag pushes skip
    needs: [day-cli-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Reuse the day CLI day-cli-linux already built (like every other combo) instead of a from-source
      # `cargo run -p day-cli`. The wasm32 toolchain above is still required: `day build` shells out
      # to `cargo rustc --target wasm32-unknown-unknown` on this runner to compile the app.
      - name: Download the day CLI (release, matching this runner's os+arch)
        uses: actions/download-artifact@v8
        with:
          name: day-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/day-cli
      - name: Locate the day CLI (exports DAY_BIN)
        shell: bash
        run: |
          # The artifact holds exactly the one binary (day); take its absolute path so every step
          # can invoke it as $DAY_BIN regardless of working directory. On Windows $RUNNER_TEMP is a
          # DOS path; cygpath turns it into one `find` can walk.
          TMP="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          BIN="$(find "$TMP/day-cli" -maxdepth 1 -type f | head -1)"
          chmod +x "$BIN" 2>/dev/null || true
          echo "DAY_BIN=$BIN" >> "$GITHUB_ENV"
          echo "day CLI: $BIN"
      # Scaffold + lint (scripts/ci/scaffold-check.sh). `day pack` does not support web-dom yet,
      # so the script stops after the lint for this combo.
      - name: Scaffold check (new + lint + pack + rebuild)
        shell: bash
        run: scripts/ci/scaffold-check.sh "$DAY_BIN" web-dom
      - name: Check out the showcase app
        uses: ./.github/actions/showcase
        with:
          day-bin: ${{ env.DAY_BIN }}
      # The last backend without a showcase lint. Six run in `toolkit`, arkui runs in its own job
      # (it needs the OpenHarmony SDK set up there) — web-dom only ever *built* the app, so a lint
      # clippy catches but rustc does not could reach main through this combo alone.
      - name: Clippy (dom backend)
        # `--lib` like the other non-desktop backends: wasm has no `day::launch` (desktop-only), so
        # `src/main.rs` is not part of this build. The cargo feature is `dom`; `web-dom` is the
        # platform name `day build` takes (Cargo.toml [features], §9). The getrandom_backend cfg
        # mirrors what `day build` sets for every web app (crates/day-cli/web.rs): day-dom carries
        # getrandom's custom-backend hook, and getrandom refuses to compile for raw wasm until a
        # backend is chosen.
        working-directory: showcase-src
        env:
          RUSTFLAGS: -D warnings --cfg getrandom_backend="custom"
        run: cargo clippy --target wasm32-unknown-unknown --lib --no-default-features --features dom
      - name: Build the showcase web-dom dist (release)
        working-directory: showcase-src
        run: $DAY_BIN build --platform web-dom --profile release
      - name: Install walkthrough tools
        # ubuntu-latest preinstalls neither: ImageMagick's `identify` is the validation
        # script's Linux path, and without Noto CJK the zh-CN captures render tofu boxes
        # (the same pair the linux-gtk leg installs).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fonts-noto-cjk
      - name: Install the walkthrough browsers (Playwright Chromium + WebKit)
        run: |
          mkdir -p "$RUNNER_TEMP/webdriver" && cd "$RUNNER_TEMP/webdriver"
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium webkit
          # The page-driver ships inside day-cli (`day web driver` materializes it), so the
          # DAY_WEB_DRIVER command below always matches the CLI's driver protocol.
          echo "DAY_WEB_DRIVER_SCRIPT=$($DAY_BIN web driver)" >> "$GITHUB_ENV"
      - name: Walkthrough (web-dom × light/dark × en/fr/ar/zh-CN)
        working-directory: showcase-src
        env:
          DAY_WEB_DRIVER: node ${{ env.DAY_WEB_DRIVER_SCRIPT }}
          DAY_WEB_DRIVER_PLAYWRIGHT: ${{ runner.temp }}/webdriver
          # Linux WebKit has no OPFS — the fs steps need Chromium (see the job comment).
          DAY_WEB_DRIVER_BROWSER: chromium
        run: |
          $DAY_BIN launch -p web-dom --script dayscript/walkthrough.yaml \
            --themes "$WALKTHROUGH_THEMES" --locales "$WALKTHROUGH_LOCALES"
      # Text to speech (docs/speech.md): the JavaScript arm, staged as this crate's own ES module
      # and merged into the wasm import table — the leg that proves per-crate JS staging works.
      - name: Speech (web-dom)
        working-directory: showcase-src
        env:
          DAY_WEB_DRIVER: node ${{ env.DAY_WEB_DRIVER_SCRIPT }}
          DAY_WEB_DRIVER_PLAYWRIGHT: ${{ runner.temp }}/webdriver
          DAY_WEB_DRIVER_BROWSER: chromium
        run: $DAY_BIN launch -p web-dom --script dayscript/speech.yaml
      # Headless WebKit has no motion hardware, so the walkthrough above can only prove the
      # "unavailable" path. Serve the built page, dispatch a synthetic `devicemotion` with known
      # values, and assert the CONVERTED numbers — the deg/s → rad/s conversion and the
      # beta/gamma/alpha → x/y/z mapping are where a browser sensor arm actually goes wrong
      # (docs/sensors.md).
      - name: Sensors (synthetic devicemotion)
        working-directory: showcase-src
        env:
          DAY_WEB_DRIVER_PLAYWRIGHT: ${{ runner.temp }}/webdriver
        run: |
          $DAY_BIN launch -p web-dom --keep-alive >"$RUNNER_TEMP/weblaunch.log" 2>&1 &
          for _ in $(seq 1 90); do
            URL=$(grep -o 'http://127.0.0.1:[0-9]*' "$RUNNER_TEMP/weblaunch.log" 2>/dev/null | head -1)
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo "the web server never reported a URL:"; cat "$RUNNER_TEMP/weblaunch.log"; exit 1
          fi
          node "$GITHUB_WORKSPACE/scripts/ci/webdom-sensor-test.mjs" "$URL/"
      - name: Validate screenshot content
        run: scripts/ci/validate-screenshots.sh showcase-src/build/day/screenshots/web-dom
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-web-dom
          path: showcase-src/build/day/screenshots/web-dom
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # website: build the Astro site (website/) and deploy it to GitHub Pages at the custom
  # domain https://daybrite.dev (public/CNAME pins it). Runs AFTER every screenshot-producing job so
  # it can download their `screenshots-<combo>` artifacts and assemble the gallery
  # from the latest captures. `!cancelled()` (not `success()`) means a platform
  # that failed to produce screenshots does not block the deploy — the gallery
  # simply shows whatever platforms succeeded (the assembly emits placeholders for
  # the rest). Builds on every push/PR (validation); a separate job deploys only
  # from main so PRs never publish. Enable Pages via Settings → Pages → Source:
  # "GitHub Actions".
  # ---------------------------------------------------------------------------
  website:
    name: website (build)
    needs: [macos, ios-uikit, linux, android-mdc, harmony-arkui, windows-xaml, windows-msys2, api-docs, web-dom]
    # Runs even when some platform legs fail (!cancelled), but not on tag pushes (those run
    # the release pipeline instead).
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every internal doc is published
        # The same script scripts/ci/lint.sh runs, so this drift is caught in the pre-flight on
        # the machine that caused it rather than ten minutes later here. `--fix` repairs it.
        run: scripts/ci/docs-symlinks.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Download every platform's screenshots
        # Each screenshot job uploads `screenshots-<combo>`; grab them all into
        # website/artifacts/screenshots-<combo>/… where the assembly expects them.
        # continue-on-error: a run where no platform produced screenshots still deploys.
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: screenshots-*
          path: website/artifacts
      # No `showcase-dist-*` download: /showcase/ links the packages attached to the latest RELEASE
      # of daybrite/Day-Showcase, not this run's. Only that release lane's macOS build is signed and
      # notarized, and an unsigned .dmg is the one download here that macOS refuses to open.
      # scripts/assemble-downloads.mjs reads that release over the API (DAY_RELEASE_REPO below).
      - name: Build the site (assembles the gallery from the artifacts)
        working-directory: website
        env:
          # Raises the API rate limit for the release lookup above the shared-IP anonymous one.
          GITHUB_TOKEN: ${{ github.token }}
          # /showcase/ offers the app's own releases now that it is its own repository.
          DAY_RELEASE_REPO: daybrite/Day-Showcase
        run: |
          npm ci
          npm run build
      - name: Add the Rust API reference (dist/api)
        # Drop the api-docs job's rustdoc bundle into the built site at /api (linked from /docs/api).
        # continue-on-error: a run where the doc build failed still deploys — the API pages 404 until
        # the next green run rather than blocking the whole site (matches the gallery's resilience).
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: api-docs
          path: website/dist/api
      - name: Check for broken links
        working-directory: website
        run: npm run linkcheck
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy-website:
    name: website (deploy)
    needs: website
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
