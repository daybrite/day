[package]
name = "day-tweak-tooltip"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Tweak: a native hover/long-press tooltip on any piece — AppKit, GTK, and Android, one modifier across three access tiers."

[dependencies]
day-core = { workspace = true }
day-pieces = { workspace = true }
day-appkit = { workspace = true, optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString"] }
day-gtk = { workspace = true, optional = true }
gtk4 = { version = "0.11", optional = true, features = ["v4_10"] }
day-android = { workspace = true, optional = true }

[features]
appkit = ["dep:day-appkit", "dep:objc2-app-kit", "dep:objc2-foundation"]
gtk = ["dep:day-gtk", "dep:gtk4"]
mdc = ["dep:day-android"]

# Tweak crates reuse the piece backends table so `day build` unions `<pkg>/<backend>`
# features into the app automatically (Tier A.2 — crates/day-cli/src/pieces.rs).
[package.metadata.day.piece]
backends = ["appkit", "gtk", "mdc"]
