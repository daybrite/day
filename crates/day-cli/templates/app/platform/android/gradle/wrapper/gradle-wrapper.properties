# Which Gradle builds this app. `day build` runs the `gradle` on your PATH, but an IDE reads this
# file — and with no file here, Android Studio writes one itself, pinned to the Android Gradle
# Plugin's DECLARED MINIMUM, which is a milestone build that Studio then refuses to sync against
# ("Minimum supported Gradle version is …"). Pinning it is what stops that.
#
# 9.7.1 is the version day's own CI builds Android with (.github/workflows/ci.yml, setup-gradle),
# so a scaffolded app and the framework agree on one Gradle.
#
# Only the properties are shipped, not `gradlew` and its jar: Studio resolves the distribution
# from this file alone, and Day apps build through `day build`, so there is no wrapper script to
# keep current or binary jar to carry. Run `gradle wrapper` here if you want one.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
