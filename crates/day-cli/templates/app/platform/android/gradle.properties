org.gradle.jvmargs=-Xmx2g
# Day's Gradle plugin reads what `day build` generates under `build/day/android/` (piece
# contributions, Day.toml identity, release signing) at configuration time, through
# `providers.fileContents`. The configuration cache tracks those reads, so a changed file discards
# the cached configuration and a newly added or removed piece always reaches the build.
org.gradle.configuration-cache=true
# AndroidX is required by many third-party libraries pulled in by pieces (e.g. Airbnb's Lottie, whose
# LottieAnimationView extends androidx.appcompat.widget.AppCompatImageView).
android.useAndroidX=true
