# A portable round trip through the starter. No seed data or platform-specific steps.
# The typed name is synthetic test input; UI assertions use localization keys.
# Run with: day launch -t <target> --script dayscript/demo.yaml
flow:
  - wait_for: { id: nav }
  - navigate: { route: welcome }
  - assert_visible: { id: welcome_mark }
  - assert_text: { id: welcome_title, key: welcome_title }
  - assert_visible: { id: welcome_body }
  - a11y_audit: {}
  - screenshot: welcome

  - navigate: { route: items }
  - assert_route: { route: items }
  - wait_for: { id: item_list }
  - screenshot: list

  - toolbar: { item: tb-add }
  - wait_for: { id: field_name }
  - input: { id: field_name, text: "Written by the demo" }
  - assert_text: { id: field_name, text: "Written by the demo" }
  - toggle: { id: field_done, value: true }
  - assert_value: { id: field_done, value: true }
  - a11y_audit: {}
  - screenshot: editor

  # Remove only the item this run created, leaving existing items alone.
  - toolbar: { item: tb-delete }
  - wait_for: { id: item_list }
  - assert_missing: { id: field_name }

  # Settings: the window on desktop, the section on a phone; the language row exists everywhere.
  # A plain screenshot captures the primary window, so the desktop panel is captured by its key.
  - navigate: { route: settings }
  - wait_for: { id: language_picker }
  - screenshot: settings
  - screenshot: { name: settings-window, window: day.preferences, skip_on: [uikit, mdc, arkui, dom] }
