# A page-declared command's live enablement (https://daybrite.dev/docs/guide-desktop).
#
# `enabled_when` is seeded at build time, before anything is selected, and patched live after.
# That patch once reached a per-chrome copy of the model while the toolkit drew the window's,
# so on a window that never re-composed (a tiled Android tablet) Done stayed disabled.
flow:
  - wait_for: { id: nav }
  - navigate: { route: navigate }
  - wait_idle:
  - select: { id: item-list, index: 1 }
  - wait_idle:
  - pause: 1
  # With a row open, the command must be enabled and must dispatch.
  - toolbar: { item: tb-done }
  - wait_idle:
  - toolbar: { item: tb-done }
