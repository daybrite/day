# The stores' rules, as data: what each storefront is called, which targets publish to it, the
# fastlane layout its listing takes, its fields with their names and limits, how it spells each
# locale, and what it takes for a listing screenshot per device kind. `day store stage`, `day store
# screenshots`, `day lint` and `day store export` read this file; `--rules FILE` or DAY_STORE_RULES
# names another, and a project's `store/rules.toml` takes over when present, so a store changing
# what it accepts is a data edit, not a CLI release. `day store export` carries the rules in force,
# so a consumer of the export holds captures to the same limits without a copy of its own.
#
# A store with a `layout` is one the CLI stages (`deliver` writes App Store Connect's tree,
# `supply` Google Play's); the rest are storefronts the CLI knows by name, whose declarations ride
# through gallery.json and the export for whatever publishes there. A store key outside this file
# is a `day lint` warning.

[apple-app-store]
label = "the App Store"
targets = ["ios-uikit"]
layout = "deliver"
default-kind = "iphone"                 # a capture from a profile-less run counts as this kind
required = ["name", "description", "privacy-url"]

# The listing's fields: deliver's file name and the store's limit, in characters. Keywords are
# counted joined by commas.
[apple-app-store.fields]
name = { file = "name.txt", limit = 30 }
subtitle = { file = "subtitle.txt", limit = 30 }
description = { file = "description.txt", limit = 4000 }
keywords = { file = "keywords.txt", limit = 100 }
release-notes = { file = "release_notes.txt", limit = 4000 }
promo = { file = "promotional_text.txt", limit = 170 }
marketing-url = { file = "marketing_url.txt", limit = 255 }
support-url = { file = "support_url.txt", limit = 255 }
privacy-url = { file = "privacy_url.txt", limit = 255 }

# Day locale tag → the store's spelling. A tag missing here is a lint finding rather than a
# guess: a listing uploaded under a locale the store does not know is dropped without an error.
# The region-qualified spellings `day new app` scaffolds are listed beside the short tags, so a
# project that spells its locales either way still stages.
[apple-app-store.locales]
"en" = "en-US"
"en-GB" = "en-GB"
"fr" = "fr-FR"
"fr-CA" = "fr-CA"
"de" = "de-DE"
