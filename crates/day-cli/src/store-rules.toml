# The 6.9" iPhone and 13" iPad sizes, which the default CI profiles `iPhone * Pro Max` and
# `iPad Pro 13-inch` produce. `required` kinds need at least one capture in every locale the
# index carries (App Store Connect refuses a version whose localization has none); `max` is the
# store's ceiling per locale; Apple takes exact `sizes`.
[apple-app-store.screenshots.iphone]
label = "iPhone"
required = true
max = 10
sizes = [[1320, 2868], [2868, 1320], [1290, 2796], [2796, 1290], [1260, 2736], [2736, 1260]]

[apple-app-store.screenshots.ipad]
label = "iPad"
required = true
max = 10
sizes = [[2064, 2752], [2752, 2064], [2048, 2732], [2732, 2048]]

[google-play-store]
label = "Google Play"
targets = ["android-mdc"]
layout = "supply"
default-kind = "phone"
required = ["name", "description", "short"]

# supply's file names. The release notes go to `changelogs/<versionCode>.txt`, keyed by Day.toml's
# `[app] build`; Play's 500 characters is the limit that binds for an app shipping to both
# stores. Play takes no marketing URL through the API (its `video.txt` is a YouTube promo video;
# the website is a Play Console setting), and no keywords, subtitle or promotional text.
[google-play-store.fields]
name = { file = "title.txt", limit = 30 }
short = { file = "short_description.txt", limit = 80 }
description = { file = "full_description.txt", limit = 4000 }
release-notes = { file = "changelog", limit = 500 }

# Google still spells Hebrew with the pre-1989 code `iw`, and takes `es-419` for Latin America.
[google-play-store.locales]
"en" = "en-US"
"en-GB" = "en-GB"
"fr" = "fr-FR"
