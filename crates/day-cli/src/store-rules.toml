[f-droid]
label = "F-Droid"
targets = ["android-mdc"]

[flathub]
label = "Flathub"
targets = ["linux-gtk", "linux-qt"]

[microsoft-store]
label = "the Microsoft Store"
targets = ["windows-xaml"]

[appgallery]
label = "AppGallery"
targets = ["harmony-arkui"]
