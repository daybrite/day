[package]
name = "day-cli"
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["cli", "cross-platform", "mobile", "native", "gui"]
categories = ["command-line-utilities", "development-tools", "gui"]

[[bin]]
name = "day"
path = "src/main.rs"

[dependencies]
# Read Mach-O registration symbols without depending on Xcode's LLVM bitcode version.
object = { version = "0.37", default-features = false, features = ["read", "std"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
# Terminal styling for the CLI's own human output (src/term.rs). `anstyle` is the styling
# vocabulary clap already uses (so our output shares its color system); `anstream`'s print macros
# strip the escapes when stdout/stderr isn't a color terminal (NO_COLOR, pipes, files, dumb/legacy
# consoles). Both are already in the tree via clap, so naming them adds no new compiled crates.
anstyle = { workspace = true }
anstream = { workspace = true }
# `day new app` templates (templates/app/, embedded so a fresh `cargo install day-cli` scaffolds
# offline): handlebars renders {{name}}/{{id}}/… in both file contents and paths; include_dir bakes
# the template tree into the binary.
handlebars = "6"
include_dir = "0.7"
# Interactive `day new` prompts (src/interactive.rs): text input, single-select, and checkbox
# multi-select (arrow keys / space to toggle / type-to-filter). inquire renders to stderr, so
# stdout stays clean for `--format json` result events.
inquire = "0.9"
# Day.toml (the project manifest): `toml` parses it via serde; `toml_edit` (the library under
# cargo-edit/cargo itself) performs format- and comment-preserving edits (`day project add-target`).
toml = { workspace = true }
toml_edit = "0.25"
serde = { workspace = true, features = ["derive"] }
serde_norway = { workspace = true }
serde_json = { workspace = true }
# Shared dayscript types and YAML grammar, without the embedded engine/runtime graph.
day-script-proto = { workspace = true }
# Merge generated App Sandbox entitlements with custom XML or binary property lists.
plist = "1"
# HarmonyOS JSON5: round-trip parsing retains comments and whitespace during manifest edits.
json-five = "=0.3.1"
# Xcode 27 JSON5 project model and comment-preserving edits (marcprux/ycode).
ycode-project = "0.1.2"
sha2 = { workspace = true }
# The screenshot bundle (`day screenshot pack` / `unpack`, src/screenshot.rs): a `.tar.xz` of
# uncompressed PNG files, which an xz window of hundreds of megabytes compresses across captures
# to a tenth of what the PNG files compress to alone. `png` decodes captures and writes them
# back (it is already compiled for day-vector's rasterizer); `liblzma` is the xz implementation,
# linked statically, so a site build or a store queue unpacks with the CLI alone. The tar
# layer is a hundred lines of its own, since ustar is simple and the archive needs no more.
png = { workspace = true }
liblzma = { version = "0.4", default-features = false, features = ["static"] }
# The vector engine behind `day icon build` and resource/vectors staging (docs/icons.md,
# docs/vectors.md): SVG parse/raster + the platform icon-format writers.
day-vector = { workspace = true }
# Normalizing artifact timestamps before archiving (pack/ios.rs, §20.3). std cannot do this: its
# `File::set_times` follows symlinks, and on Windows a directory cannot be opened at all without
# `FILE_FLAG_BACKUP_SEMANTICS`. filetime handles both, and it is small and dependency-free.
filetime = "0.2"
# Background "is a newer day-cli on crates.io?" check (update.rs). ureq is a small synchronous HTTP
# client with bundled roots: no OS cert-store dependency, so it works on a fresh machine.
ureq = "3"
# Shared host-toolchain/SDK discovery (docs/environment.md), the same code the build scripts use.
day-toolchain = { workspace = true }
# Font name-table parsing + family→ident rules (§18.4): the same leaf crate the runtimes use (via
# `day_spec::fonts`), so the names the stagers derive always match what the backends look up.
day-fonts = { workspace = true }
# Resource name → identifier rules (§18.5): the same leaf crate an app's `build.rs` uses to generate
# the typed `res::…` constants, so the name a stager writes into a backend's native store is exactly
# the string baked into the constant. `sanitize_ident` re-exported from here.
day-build = { workspace = true }


# Ctrl-C child cleanup uses POSIX signals only (Windows relies on console propagation).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
