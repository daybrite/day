<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The home-screen head (docs/web.md "Home screen and offline"), filled in by the assemble
       step: title, description, the web app manifest, theme colors, and the icon links. -->
  <!--day:head-->
  <link rel="stylesheet" href="day.css">
</head>
<body>
  <div id="day-root"></div>
  <!-- The bundled vector-glyph names (docs/vectors.md), filled in by the assemble step; the
       shim answers day-dom's `vector:` env keys from this list so vector names resolve to
       their staged .svg files. -->
  <script>window.__DAY_VECTORS = [/*day:vectors*/];</script>
  <!-- Web modules (docs/web.md): the daybridge web arms (docs/bridge.md) and the modules crates
       declare in [package.metadata.day.web], imported by shim.js before instantiation. Empty
       in an app whose crates ship no browser half. -->
  <script>window.__DAY_MODULES = [/*day:modules*/];</script>
  <script type="module">
    import { start } from './shim.js';
    start('app.wasm');
  </script>
  <!-- The offline shell (docs/web.md "Home screen and offline"): sw.js, generated beside this
       page with every file of the dist, serves the app when the network is away. Registered
       after the app starts so it never competes with the first load; browsers only allow a
       worker on https: and loopback, which is where `day launch` serves from. -->
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
