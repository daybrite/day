[package]
name = "day-script"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
log = { workspace = true }
day-core = { workspace = true }
day-fluent = { workspace = true }
day-reactive = { workspace = true }
day-spec = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
day-script-proto = { workspace = true }

[dev-dependencies]
day-mock = { workspace = true }
# Only to write the PNGs the in-engine reader (src/png.rs) is tested against; the engine itself
# reads them with its own few hundred lines, since it is linked into every app.
png = "0.18"
day-pieces = { workspace = true, features = ["conformance"] }
