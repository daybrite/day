[package]
name = "day-toolkit-gtk"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[[test]]
name = "native_canvas_layout"
harness = false # GTK on macOS requires the process's main thread.

[[test]]
name = "native_list_selection"
harness = false # GTK on macOS requires the process's main thread.

[[test]]
name = "native_focus_removal"
harness = false # GTK must run on the process's main thread.

[dependencies]
day-reactive = { workspace = true }
log = { workspace = true }
day-spec = { workspace = true }
# Tweaks (docs/tweaks.md): the ext module reads the realized tree (day-core) and
# extends Decorate (day-pieces) with this toolkit\'s tweak modifier.
day-core = { workspace = true }
day-pieces = { workspace = true }
linkme = { workspace = true }
gtk4 = { workspace = true, features = ["v4_10"] }
# Canvas text (docs/fonts.md, DESIGN §11): a Pango layout drawn through cairo — family, weight,
# slant, shaping and BiDi, where cairo's own "toy" text API has none. The C library is already
# linked (gtk4.pc requires pangocairo); this is only the binding, from the same gtk-rs release.
pangocairo = "0.22"
# Canvas export (docs/canvas.md "Exporting"): cairo's PDF surface. gtk4 re-exports cairo-rs
# without its `pdf` feature, so this names the same crate at the same version to turn it on; the
# feature only declares the `cairo_pdf_*` symbols, which libcairo itself exports wherever its PDF
# backend is built (Homebrew, Debian/Ubuntu and MSYS2's mingw-w64-cairo all build it). v1_16 is
# for `cairo_pdf_surface_set_metadata` (title, author); cairo 1.16 predates every GTK 4.10 distro.
cairo-rs = { version = "0.22", features = ["pdf", "v1_16"] }
# libadwaita: the desktop navigation paradigm (AdwNavigationSplitView / AdwNavigationView),
# AdwApplicationWindow + AdwToolbarView chrome, AdwViewStack/AdwViewSwitcher tabs, and
# AdwAlertDialog. v1_5 gates AdwAlertDialog; it is the version shipped by Ubuntu 24.04, so CI
# stays green (AdwSpinner would need v1_7, which 24.04 lacks — GtkSpinner is kept instead).
libadwaita = { version = "0.9", features = ["v1_5"] }

# Dock icon (§18.2): GTK4 has no NSApplication integration, so on macOS the app icon is applied
# straight through AppKit (an unbundled binary otherwise shows the generic exe icon in the Dock).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true, default-features = true }
objc2-core-graphics = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSString"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSImage"] }

[target.'cfg(windows)'.dependencies]
day-platform-windows = { workspace = true }

# `dlsym` for GTK 4.14's `gtk_accessible_announce` (docs/accessibility.md): the binding is pinned
# at its v4_10 level, so the library on the machine decides at run time whether the call exists.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The Linux status item and launcher entry (docs/status-item.md): StatusNotifierItem + dbusmenu
# and Unity LauncherEntry over the session bus, std-only.
[target.'cfg(target_os = "linux")'.dependencies]
day-platform-linux = { workspace = true }

[build-dependencies]
pkg-config = "0.3"
