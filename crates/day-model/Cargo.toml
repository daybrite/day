[package]
name = "day-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Property observable store."
repository.workspace = true
license.workspace = true

[dependencies]
day-reactive = { workspace = true }
# The Uuid key type (decided 2026-08-23): type-only here, so the raw-wasm web pipeline (no
# getrandom backend yet) still carries wide keys; generation (v7) joins on native targets
# below, where getrandom has an OS source.
uuid = { workspace = true, default-features = false }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
uuid = { workspace = true, default-features = false, features = ["std", "rng", "v4", "v7"] }

[dev-dependencies]
day-macros = { path = "../day-macros" }
day-core = { path = "../day-core" }
day-pieces = { path = "../day-pieces" }
day-spec = { path = "../day-spec" }
day-mock = { path = "../day-mock" }
