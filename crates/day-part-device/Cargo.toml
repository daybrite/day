[package]
name = "day-part-device"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

# A headless day-ecosystem crate (no UI Piece): a shared cross-platform API for a snapshot of the
# device's identity (model, OS name/version, simulator flag) via each platform's native API. Any
# Rust code can depend on it and call `day_part_device::info::get()`. Platform selection is by
# `#[cfg(target_os)]`/`#[cfg(target_env)]` (device identity is an OS concern, not a widget-toolkit
# one), so there are no backend features; it "just works" per target:
#   macOS:     ProcessInfo.operatingSystemVersion (objc2-foundation) + sysctl hw.model (libc)
#   iOS:       UIDevice model/systemName/systemVersion (objc2-ui-kit); simulator via target_abi/env
#   Windows:   RtlGetVersion (ntdll, raw FFI)
#   Linux:     /etc/os-release + DMI product_name (std only)
#   HarmonyOS: native libdeviceinfo_ndk.so (deviceinfo.h), gated on target_env = "ohos"
#   Android:   Build.* via the inline Java arm in src/android.rs (docs/bridge.md)
# See docs/deviceinfo.md + docs/extending.md.

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSProcessInfo", "NSString"] }
libc = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-ui-kit = { workspace = true, features = ["UIDevice"] }
objc2-foundation = { workspace = true, features = ["NSString"] }

# Android reads Build.* through a Java shim + day-platform-android's re-exported JVM. Build fields are static
# (no Context needed), but the crate still rides the Day runtime for its attached JNIEnv.
[target.'cfg(target_os = "android")'.dependencies]
day-platform-android = { workspace = true }
# daybridge (docs/bridge.md): the Java arm and its declaration live in src/android.rs, so the
# dependency is Android-only too; every other target compiles exactly as it did before.
day-bridge = { workspace = true }

[build-dependencies]
day-build = { workspace = true }
