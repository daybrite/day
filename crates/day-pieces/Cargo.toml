[package]
name = "day-pieces"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
log = { workspace = true }
day-geometry = { workspace = true }
day-reactive = { workspace = true }
day-model = { workspace = true, optional = true }
day-spec = { workspace = true }
day-core = { workspace = true }
# The core localization engine + built-in UI-string catalog (dialog buttons, menu-role labels).
day-localization = { workspace = true }
# Re-exported so external pieces register per-backend renderers through the `renderer!` macro
# without depending on linkme (or day-spec's Renderer) directly.
linkme = { workspace = true }
# `#[builder]` for every piece's builder trait (docs/api-style.md), and `#[day::test]` for the
# conformance cases.
day-macros = { workspace = true }

[features]
# The dynamic piece registry (docs/lite.md §4 in https://github.com/daybrite/day-lite):
# name-keyed constructors + modifiers with loosely-typed args, the surface day-lite's JS layer
# drives. Off by default, so compiled apps pay nothing for it.
dyn-registry = []
# Model-driven collections (docs/model.md, docs/list.md): a day-model store as a `RowSource`
# for `list`/`each`, rows binding fields through `ModelSlot`. Off by default, so apps that bind
# plain data pay nothing for it.
model = ["dep:day-model"]
# The built-in pieces' conformance cases (docs/testing.md): compiled only into a test build,
# never into a shipping app.
conformance = []

[dev-dependencies]
day-mock = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSURL", "NSData", "NSError", "NSString", "NSArray"] }

# The model-rows suite proves the granularity and reclamation claims docs/list.md makes.
[[test]]
name = "model_rows"
required-features = ["model"]
