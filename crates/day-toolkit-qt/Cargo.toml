[package]
name = "day-toolkit-qt"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
day-reactive = { workspace = true }
log = { workspace = true }
day-spec = { workspace = true }
# Tweaks (docs/tweaks.md): the ext module reads the realized tree (day-core) and
# extends Decorate (day-pieces) with this toolkit\'s tweak modifier.
day-core = { workspace = true }
day-pieces = { workspace = true }
day-toolkit-qt-sys = { workspace = true }
linkme = { workspace = true }

[target.'cfg(windows)'.dependencies]
day-platform-windows = { workspace = true }

# The Linux launcher entry and single-instance forwarding (docs/status-item.md,
# docs/deep-links.md): Unity LauncherEntry and a claimed bus name over the session bus, std-only.
[target.'cfg(target_os = "linux")'.dependencies]
day-platform-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
day-platform-macos = { path = "../day-platform-macos" }
