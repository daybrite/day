[package]
name = "day-toolkit-qt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
day-reactive = { workspace = true }
log = { workspace = true }
day-spec = { workspace = true }
# The realized tree, events and window policy. The ext module (docs/tweaks.md) reads the tree
# to hand a tweak the native widget; the backend needs no widget builders for that.
day-core = { workspace = true }
day-toolkit-qt-sys = { workspace = true }
linkme = { workspace = true }

# The Linux launcher entry and single-instance forwarding (docs/status-item.md,
# docs/deep-links.md): Unity LauncherEntry and a claimed bus name over the session bus, std-only.
[target.'cfg(target_os = "linux")'.dependencies]
day-platform-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
day-platform-macos = { path = "../day-platform-macos", version = "0.*" }

[lints]
workspace = true
