[package]
name = "day-lite"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
# The bundled SQLite, on by default — the engine every mobile target cross-compiles. A
# superapp linking the OS's libsqlite3 instead uses default-features = false and picks its
# engine through day-persistence's own features.
default = ["bundled"]
bundled = ["day-persistence/bundled"]

[dependencies]
log = { workspace = true }
day-reactive = { workspace = true }
day-core = { workspace = true }
day-spec = { workspace = true }
day-pieces = { workspace = true, features = ["dyn-registry"] }
day-part-http = { workspace = true }
day-part-prefs = { workspace = true }

# The JS engine: QuickJS. `bindgen` because rquickjs ships no prebuilt bindings for the
# mobile cross-targets (docs/lite.md §13); the day CLI supplies the sysroot/ar env the
# build scripts need per target.
rquickjs = { version = "0.12", features = ["bindgen", "loader"] }

# TypeScript type-stripping at module load (docs/lite.md §1).
oxc_allocator = "0.147"
oxc_parser = "0.147"
oxc_semantic = "0.147"
oxc_transformer = "0.147"
oxc_codegen = "0.147"
oxc_span = "0.147"

# Built-in persistence (docs/lite.md §7) rides day-persistence's driver seam, so a superapp
# carrying both compiles ONE SQLite and the app's engine features (`sqlite-system`,
# `sqlite-cipher`) govern miniapp storage too. The `bundled` default keeps the engine every
# mobile target cross-compiles; a system-engine build turns it off (default-features = false).
day-persistence = { workspace = true, default-features = false, features = ["driver-rusqlite"] }

# Per-miniapp Fluent bundles (docs/lite.md §7) — same crate/version day-l10n builds on.
fluent-bundle = "0.16"
day-l10n = { workspace = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
day-mock = { workspace = true }
